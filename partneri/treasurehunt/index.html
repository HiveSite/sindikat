function adminContent(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Hunt Version v1.4</div><h2 style="font-size:24px;margin-top:3px">Pečat izgubljenog glasnika</h2></div><span class="pill good">Objavljeno</span></div><div class="card brass" style="margin-top:13px"><div class="eyebrow" style="color:var(--brass-2)">Story bible</div><div class="dim" style="font-size:11.5px;line-height:1.55;margin-top:7px">Centralna misterija, likovi, istorijska ograničenja, ton i pravila svijeta čuvaju se odvojeno od rute. Tako se ista priča može prilagoditi corporate ili turističkom modu.</div></div><div class="eyebrow" style="margin:18px 0 9px">Vizuelni tok priče</div><div class="flow">${CASE.checkpoints.map((p,i)=>`<div class="flow-node"><div class="no">0${i+1}</div><div class="grow"><div style="font-weight:800;font-size:12.5px">${p.chapter}</div><div class="faint" style="font-size:10.5px;margin-top:2px">${p.name} · ${p.type} · ${p.points} pts</div></div><span class="pill ${i===2?'red':'good'}">${i===2?'Provjeri':'Spremno'}</span></div>${i<CASE.checkpoints.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}</div><div class="card" style="margin-top:13px"><div class="row"><div class="grow"><div style="font-weight:800">Istorijska revizija</div><div class="faint" style="font-size:10.5px;margin-top:2px">12 činjenica · 12 izvora · pregled 29.07.2026.</div></div><span class="pill good">Odobreno</span></div></div><div class="card" style="margin-top:10px"><div class="row"><div class="grow"><div style="font-weight:800">Test rute</div><div class="faint" style="font-size:10.5px;margin-top:2px">Posljednji terenski test · GPS i sigurnost</div></div><span class="pill brass">4 napomene</span></div></div><button class="btn primary" style="margin-top:13px">Otvori puni Hunt Builder</button></div>`}
function adminEvents(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Event instances</div><h2 style="font-size:24px;margin-top:3px">Privatni događaji</h2></div><button class="btn primary mini">+ Novi event</button></div>${[
['HIVE Demo Company','Kotor Mystery Challenge','18.09 · 17:30','32 igrača','good'],['Adriatic Resort','Guest Mystery Hunt','19.09 · fleksibilno','12 passova','brass'],['Studio North','Podgorica City Mission','23.09 · 16:00','24 igrača','']
].map(x=>`<div class="admin-card" style="margin-top:10px"><div class="row"><div class="grow"><h4>${x[0]}</h4><div class="faint" style="font-size:10.5px;margin-top:3px">${x[1]}</div></div><span class="pill ${x[4]}">${x[2]}</span></div><div class="divider" style="margin:11px 0"></div><div class="row"><div class="statusline"><i></i>${x[3]}</div><div class="grow"></div><button class="btn ghost mini">Otvori</button></div></div>`).join('')}</div>`}
function adminLive(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Live · HIVE Demo Company</div><h2 style="font-size:24px;margin-top:3px">6 timova na terenu</h2></div><span class="pill good">Signal stabilan</span></div><div class="card brass" style="margin-top:13px"><div class="row"><div class="grow"><div style="font-weight:800">Broadcast svim timovima</div><div class="faint" style="font-size:10.5px;margin-top:2px">Poruka se prikazuje iznad sadržaja priče.</div></div>${IC.bell}</div><div class="row" style="gap:8px;margin-top:10px"><input class="input grow" id="broadcast" placeholder="Npr. Leaderboard se skriva za 10 minuta"><button class="btn primary mini" id="sendBroadcast">Pošalji</button></div></div><div class="eyebrow" style="margin:18px 0 9px">Timovi uživo</div>${TEAMS.concat([{name:'Čuvari Škurde',score:430,progress:42,status:'Poglavlje III'},{name:'Kapetani',score:390,progress:37,status:'Poglavlje II'}]).map((t,i)=>`<div class="live-team"><div><div style="font-weight:800;font-size:13px">${t.name}</div><div class="loc">${t.status} · GPS ${i===4?'slab':'dobar'}</div></div><span class="pill ${i===4?'red':'good'}">${i===4?'Pomoć':'Aktivan'}</span><div class="progress"><i style="width:${t.progress}%"></i></div><div class="mono" style="font-size:10px;color:var(--brass-2)">${t.score} pts</div></div>`).join('')}<div class="row" style="gap:8px;margin-top:12px"><button class="btn ghost">Sakrij leaderboard</button><button class="btn danger">Pauziraj event</button></div></div>`}
function adminCommerce(){return `<div style="margin-top:15px"><div class="metrics"><div class="metric"><div class="v">4.860 €</div><div class="l">Ovaj mjesec</div></div><div class="metric"><div class="v">38</div><div class="l">Narudžbina</div></div><div class="metric"><div class="v">128 €</div><div class="l">Prosjek</div></div></div><div class="eyebrow" style="margin:18px 0 9px">Proizvodi</div>${[
['Kotor Self-guided','79 €','24 prodaje'],['Kotor Corporate Hosted','od 590 €','6 prodaja'],['Custom Story Package','od 1.800 €','2 projekta'],['Hotel Partner Pass','12 € / gost','6 partnera']
].map(x=>`<div class="admin-card"><div class="row"><div class="grow"><h4>${x[0]}</h4><div class="faint" style="font-size:10.5px;margin-top:2px">${x[2]}</div></div><span class="pill brass">${x[1]}</span></div></div>`).join('')}<div class="card brass" style="margin-top:13px"><div class="eyebrow" style="color:var(--brass-2)">Access Pass logika</div><div class="dim" style="font-size:11.5px;line-height:1.55;margin-top:7px">Svaka plaćena narudžbina kreira zaseban pass, event i ograničenja učesnika. Kod hunta nikada se ne dijeli kao univerzalna šifra.</div></div></div>`}

function mount(){
 $$('[data-back]').forEach(x=>x.onclick=back);
 $$('[data-tab]').forEach(x=>x.onclick=()=>{const v=x.dataset.tab;if(v==='admin')nav('admin',{role:'admin'});else if(v==='client')nav('client',{role:'client'});else nav(v,{role:'player'})});
 $$('[data-mode]').forEach(x=>x.onclick=()=>{const m=x.dataset.mode;if(m==='admin')nav('admin',{role:'admin'});else if(m==='client')nav('client',{role:'client'});else nav('discover',{role:'player'})});
 const enter=$('#enter');if(enter)enter.onclick=()=>nav('discover',{role:'player'});
 const featured=$('#featured');if(featured)featured.onclick=()=>nav('huntDetail',{hunt:HUNTS[0]});
 $$('[data-city]').forEach(x=>x.onclick=()=>nav('hunts'));
 $$('[data-hunt]').forEach(x=>x.onclick=()=>{const h=HUNTS.find(y=>y.id===x.dataset.hunt)||HUNTS[0];nav('huntDetail',{hunt:h})});
 const buy=$('#buy');if(buy)buy.onclick=()=>nav('checkout');
 $$('[data-pack]').forEach(x=>x.onclick=()=>{S.package=x.dataset.pack;render()});
 const pay=$('#pay');if(pay)pay.onclick=()=>{nav('purchaseSuccess');setTimeout(confetti,100)};
 const copy=$('#copylink');if(copy)copy.onclick=()=>{try{navigator.clipboard.writeText('https://hivehunt.me/join/KTR-7F4A-26')}catch(e){}toast('Privatni link je kopiran')};
 const openLobby=$('#openLobby');if(openLobby)openLobby.onclick=()=>nav('lobby');
 const goHome=$('#goHome');if(goHome)goHome.onclick=()=>nav('discover');
 const invite=$('#invite');if(invite)invite.onclick=()=>toast('Event link spreman za slanje timu');
 const prepare=$('#prepare');if(prepare)prepare.onclick=()=>nav('preflight');
 const startGame=$('#startGame');if(startGame)startGame.onclick=()=>startGameNow();
 $$('[data-game-tab]').forEach(x=>x.onclick=()=>{S.game.tab=x.dataset.gameTab;render()});
 const challenge=$('#openChallenge');if(challenge)challenge.onclick=openChallenge;
 const help=$('#help');if(help)help.onclick=()=>toast('Moderator je dobio zahtjev i vidi vašu posljednju lokaciju');
 const locate=$('#locate');if(locate)locate.onclick=realLocate;
 const simulate=$('#simulate');if(simulate)simulate.onclick=()=>{S.game.arrived=true;vibrate([40,60,120]);toast('Demo: ciljna zona je potvrđena');S.game.tab='case';render()};
 if(S.view==='game'&&S.game.tab==='map')setTimeout(initGameMap,80);
 const share=$('#shareResult');if(share)share.onclick=()=>toast('Rezultat i digitalna kartica su spremni za dijeljenje');
 const finish=$('#finish');if(finish)finish.onclick=()=>resetToDiscover();
 const copyClient=$('#copyClient');if(copyClient)copyClient.onclick=()=>toast('Event link je kopiran');
 $$('[data-admin-tab]').forEach(x=>x.onclick=()=>{S.adminTab=x.dataset.adminTab;render()});
 const send=$('#sendBroadcast');if(send)send.onclick=()=>{const v=$('#broadcast').value.trim();toast(v?'Poruka poslata svim timovima':'Unesite poruku')};
}
function startGameNow(){S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'case',arrived:false,selected:null};S.event.started=true;nav('game');clearInterval(TIMER);TIMER=setInterval(()=>{S.game.elapsed++;const c=$('#clock');if(c)c.textContent=String(Math.floor(S.game.elapsed/60)).padStart(2,'0')+':'+String(S.game.elapsed%60).padStart(2,'0')},1000)}
function resetToDiscover(){clearInterval(TIMER);S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'case',arrived:false,selected:null};S.history=[];nav('discover')}
function initGameMap(){const p=CASE.checkpoints[S.game.idx];try{MAP=L.map('map',{zoomControl:false,attributionControl:true}).setView([p.lat-.0022,p.lng-.002],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(MAP);L.circle([p.lat,p.lng],{radius:150,color:'#57ced1',weight:1,fillColor:'#57ced1',fillOpacity:.07,dashArray:'5 7'}).addTo(MAP);L.circleMarker([p.lat-.0022,p.lng-.002],{radius:8,color:'#57ced1',weight:3,fillColor:'#57ced1',fillOpacity:1}).addTo(MAP);setTimeout(()=>MAP.invalidateSize(),150)}catch(e){}}
function realLocate(){if(!navigator.geolocation){toast('Lokacija nije dostupna na ovom uređaju');return}toast('Provjeravam lokaciju…');navigator.geolocation.getCurrentPosition(pos=>{const p=CASE.checkpoints[S.game.idx];const d=distance(pos.coords.latitude,pos.coords.longitude,p.lat,p.lng);if(d<=Math.max(p.radius,60)){S.game.arrived=true;S.game.tab='case';toast('Ciljna zona je potvrđena');render()}else toast('Još ste oko '+Math.round(d)+' m od ciljne zone')},()=>toast('Nije moguće dobiti preciznu lokaciju. Pokušajte ponovo.'),{enableHighAccuracy:true,timeout:8000})}
function distance(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;const q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function openChallenge(){const p=CASE.checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay';let body='';if(p.type==='text')body=`<input class="input mono" id="answerText" placeholder="Unesite odgovor" style="text-align:center;margin-top:12px">`;else body=`<div style="margin-top:13px">${p.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`;ov.innerHTML=`<div class="sheet"><div class="grab"></div><div class="row"><div class="grow"><div class="eyebrow">Zadatak · ${p.points} pts</div><h3 style="font-size:22px;margin-top:5px">${p.name}</h3></div><span class="pill brass">Poglavlje ${S.game.idx+1}</span></div><div class="dim" style="font-family:'Fraunces';font-size:16px;line-height:1.6;margin-top:12px">${p.question}</div>${body}<div id="challengeFeedback" style="margin-top:10px"></div><div class="row" style="gap:8px;margin-top:12px"><button class="btn ghost" id="useHint">Hint -25 pts</button><button class="btn primary" id="submitAnswer">Potvrdi odgovor</button></div><button class="btn ghost" id="closeChallenge" style="margin-top:8px">Vrati se u slučaj</button></div>`;$('#phone').appendChild(ov);let picked=null;$$('[data-choice]',ov).forEach(x=>x.onclick=()=>{$$('[data-choice]',ov).forEach(y=>y.classList.remove('pick'));x.classList.add('pick');picked=+x.dataset.choice});$('#closeChallenge',ov).onclick=()=>ov.remove();$('#useHint',ov).onclick=()=>{S.game.hints++;S.game.score=Math.max(0,S.game.score-25);toast(p.hint)};$('#submitAnswer',ov).onclick=()=>{let ok=false;if(p.type==='text'){ok=$('#answerText',ov).value.trim().toUpperCase()===String(p.answer).toUpperCase()}else ok=picked===p.answer;const f=$('#challengeFeedback',ov);if(!ok){f.className='feedback bad';f.textContent='Nije tačno. Pregledajte lokaciju i dokaze pa pokušajte ponovo.';vibrate(30);return}f.className='feedback good';f.textContent='Dokaz potvrđen. +'+p.points+' poena';S.game.score+=p.points;S.game.evidence.push(p.evidence);vibrate([40,50,100]);setTimeout(()=>{ov.remove();showDiscovery(p)},700)}}
function showDiscovery(p){const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet center"><div style="font-size:50px">${p.evidence.glyph}</div><div class="eyebrow" style="color:var(--green);margin-top:10px">Novi dokaz</div><h3 style="font-size:26px;margin-top:5px">${p.evidence.title}</h3><div class="dim" style="font-size:12.5px;line-height:1.55;margin-top:8px">${p.evidence.copy}</div><div class="card" style="margin-top:14px;text-align:left"><div class="eyebrow">Istorijska činjenica</div><div class="dim" style="font-size:11.5px;line-height:1.55;margin-top:6px">${p.fact}</div></div><button class="btn primary" id="continueCase" style="margin-top:14px">${S.game.idx===CASE.checkpoints.length-1?'Zatvori slučaj':'Nastavi na sljedeće poglavlje'}</button></div>`;$('#phone').appendChild(ov);$('#continueCase',ov).onclick=()=>{ov.remove();if(S.game.idx===CASE.checkpoints.length-1){clearInterval(TIMER);confetti();nav('finale')}else{S.game.idx++;S.game.arrived=false;S.game.tab='case';render()}}}

render();
</script>
</body>
</html>
