<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061c22">
<meta name="description" content="Montenegro Treasure Hunt — istorijski GPS lov na blago kroz 6 crnogorskih gradova.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Montenegro Treasure Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Montenegro Treasure Hunt — stilovi (konsolidovano)
   Jedan :root set tokena. Bez admin/legacy selektora.
   ============================================================ */
:root{
  --night:#061c22; --deep:#0a2830; --ocean:#0e3540; --ocean-2:#124451;
  --surface:rgba(9,31,37,.96); --surface-2:rgba(14,53,64,.9);
  --paper:#f3e7c9; --paper-2:#e7d5ab; --paper-edge:#cdb37e;
  --ink:#241708; --ink-soft:#4a3a22;
  --cream:#f6efdd; --muted:#b9c9c4; --muted-2:#8aa39d;
  --gold:#d8a94a; --gold-2:#f0cf82; --gold-deep:#a97f2f;
  --rust:#b5542e; --sea:#41b6c4; --green:#5aa877; --red:#d05a48; --amber:#e0a83f;
  --line:rgba(216,169,74,.26); --line-2:rgba(216,169,74,.14);
  --tap:48px; --app-max:480px; --header-h:74px; --tabs-h:66px;
  --map-h:43dvh; --panel-radius:24px; --radius:16px; --radius-sm:11px;
  --shadow:0 18px 46px rgba(0,0,0,.42); --shadow-sm:0 8px 20px rgba(0,0,0,.28);
  --ease:cubic-bezier(.22,.61,.36,1);
  --disp:"Pirata One",'Georgia',serif;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans); color:var(--cream);
  background:
    radial-gradient(120% 80% at 50% -10%,#0d3742 0%,var(--night) 60%,#03151a 100%) fixed;
  overflow:hidden;
}
button{font-family:inherit}
img{max-width:100%;display:block}
::selection{background:rgba(216,169,74,.35)}

/* ---------- Telefon shell ---------- */
#app{
  position:relative; width:100%; max-width:var(--app-max); height:100dvh;
  margin:0 auto; overflow:hidden; isolation:isolate;
  background:linear-gradient(180deg,#082630 0%,#061d24 100%);
  box-shadow:0 0 60px rgba(0,0,0,.55);
}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .28s var(--ease),transform .28s var(--ease),visibility 0s linear .28s;
  pointer-events:none}
.view.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.game-scroll::-webkit-scrollbar{display:none}
button,input{touch-action:manipulation}
.pad{padding:20px}
.safe{height:env(safe-area-inset-bottom,0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Tipografija ---------- */
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.5px;line-height:1}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.title{font-family:var(--disp);font-size:26px;line-height:1.05;color:var(--cream);margin:6px 0 4px}
.muted{color:var(--muted)}

/* ---------- Dugmad ---------- */
.btn{appearance:none;border:0;border-radius:var(--radius-sm);min-height:var(--tap);
  padding:0 18px;font:700 15px/1 var(--sans);letter-spacing:.2px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s var(--ease),filter .2s,box-shadow .2s;width:100%}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#2a1d05;box-shadow:0 8px 20px rgba(216,169,74,.28)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--cream);border:1px solid var(--line)}
.btn.danger{background:rgba(208,90,72,.14);color:#ffb9ad;border:1px solid rgba(208,90,72,.4)}
.btn.mini{min-height:38px;padding:0 13px;font-size:13px;width:auto}
.btn.paperbtn{background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--ink);border:1px solid var(--paper-edge)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:var(--header-h);
  border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,rgba(6,28,34,.9),rgba(6,28,34,0));backdrop-filter:blur(6px)}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--cream);font-size:18px;display:grid;place-items:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font:700 12px/1 var(--sans);
  border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--cream)}
.pill.gold{border-color:rgba(216,169,74,.5);color:var(--gold-2);background:rgba(216,169,74,.1)}
.pill.good{border-color:rgba(90,168,119,.5);color:#a7e3bd;background:rgba(90,168,119,.12)}
.pill.red{border-color:rgba(208,90,72,.5);color:#ffb0a4;background:rgba(208,90,72,.12)}

/* ---------- Kartice / forme ---------- */
.card{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:16px}
.card.gold{border-color:rgba(216,169,74,.4);box-shadow:inset 0 0 0 1px rgba(216,169,74,.06)}
.card.paper{background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--ink);border:1px solid var(--paper-edge);
  box-shadow:var(--shadow-sm);position:relative}
.card.paper .eyebrow{color:var(--gold-deep)}
.divider{height:1px;background:var(--line-2);margin:14px 0}
.field{margin:12px 0}
.field>label{display:block;font:600 12px/1 var(--sans);letter-spacing:.05em;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.input{width:100%;min-height:var(--tap);border-radius:var(--radius-sm);border:1px solid var(--line);
  background:rgba(0,0,0,.25);color:var(--cream);padding:0 14px;font:600 16px/1 var(--sans)}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,169,74,.18)}
.input.code{letter-spacing:.18em;text-transform:uppercase;text-align:center;font-family:var(--disp);font-size:20px}
.form-error{color:#ffb0a4;font:600 13px/1.35 var(--sans);margin-top:8px;min-height:16px}
.statusline{font:600 12px/1.4 var(--sans);color:var(--muted-2);margin-top:10px}

/* ---------- Gate ---------- */
.gate{justify-content:center}
.gate .pad{margin:auto;width:100%}
.brandmark{width:78px;height:78px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;
  font-size:38px;background:radial-gradient(circle at 30% 25%,#12414d,#08222b);border:1px solid var(--line);
  box-shadow:var(--shadow-sm),inset 0 0 24px rgba(216,169,74,.12)}
.brandtitle{font-family:var(--disp);font-size:34px;text-align:center;line-height:1.02;color:var(--cream);margin:0}
.launch-badge{display:block;text-align:center;color:var(--gold);font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin:8px 0 2px}
.gate-card{margin-top:22px}
.ux-kicker{text-align:center;color:var(--muted);font:500 14px/1.5 var(--sans);margin:6px 0 0}
.legal-links{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.legal-links button{background:none;border:0;color:var(--muted-2);font:600 12px/1 var(--sans);text-decoration:underline;cursor:pointer}
.resume-card{margin-top:16px;border:1px dashed var(--line);border-radius:var(--radius);padding:14px;background:rgba(216,169,74,.05)}

/* ---------- Voucher / izbor ture ---------- */
.voucher-compact{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.voucher-compact .amount{font-family:var(--disp);font-size:26px;color:var(--gold-2)}
.voucher-compact .code{font:700 12px/1 var(--sans);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ux-note{color:var(--muted-2);font:500 13px/1.5 var(--sans)}
.ux-note.center{text-align:center}
.city-count{color:var(--gold);font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:14px 20px 4px}
.city-grid{display:flex;flex-direction:column;gap:12px;padding:6px 16px 20px}
.city-tile{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:12px;transition:border-color .2s,transform .12s var(--ease)}
.city-tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.city-tile:disabled{opacity:.5;cursor:not-allowed}
.city-thumb{width:60px;height:60px;flex:0 0 60px;border-radius:13px;display:grid;place-items:center;font-size:28px;
  background:radial-gradient(circle at 32% 28%,#12414d,#071e26);border:1px solid var(--line);color:var(--gold-2)}
.city-body{flex:1;min-width:0}
.city-body h3{margin:2px 0 3px;font-family:var(--disp);font-size:20px;color:var(--cream);line-height:1.05}
.city-body p{margin:0;color:var(--muted);font:500 13px/1.4 var(--sans)}
.city-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.city-meta span{font:600 11px/1 var(--sans);color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:rgba(216,169,74,.06)}

/* ---------- Tour detail ---------- */
.hero-art{height:180px;position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 20%,#12414d,#071e26)}
.hero-art .mark{font-size:64px;color:var(--gold-2);filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(6,28,34,.9))}
.hero-copy{padding:16px 20px 4px}
.hero-copy .kick{color:var(--gold);font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.hero-copy h1{font-family:var(--disp);font-size:30px;line-height:1.02;margin:8px 0 6px;color:var(--cream)}
.quick-facts{display:flex;gap:8px;flex-wrap:wrap;padding:6px 20px 4px}
.quick-fact{font:600 12px/1 var(--sans);color:var(--cream);background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:999px;padding:7px 11px}
.tour-section{padding:14px 20px}
.tour-section-title{font:700 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.story-premise{font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--cream)}
.case-question{font-family:var(--disp);font-size:21px;line-height:1.15;color:var(--gold-2);margin:12px 0 0}
.route-summary-row{display:flex;align-items:center;gap:9px;font:600 13px/1.3 var(--sans);color:var(--cream);padding:8px 0;border-bottom:1px dashed var(--line-2)}
.route-summary-row:last-child{border-bottom:0}
.route-arrow{color:var(--gold);font-size:13px}
.route-num{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--sans);color:#2a1d05;background:var(--gold)}
.flow-steps{display:flex;flex-direction:column;gap:8px}
.flow-step{display:flex;gap:10px;align-items:flex-start;font:500 14px/1.45 var(--serif);color:var(--muted)}
.flow-step b{color:var(--cream);font-weight:700;font-family:var(--sans);font-size:13px}
.route-warning{margin:8px 20px;padding:12px 14px;border-radius:12px;background:rgba(224,168,63,.1);border:1px solid rgba(224,168,63,.4);
  color:#f2d79a;font:600 13px/1.45 var(--sans)}
.sticky-action{position:sticky;z-index:14;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg,rgba(6,28,34,0),rgba(6,28,34,.98) 32%);border-top:1px solid var(--line-2);
  box-shadow:0 -12px 28px rgba(3,15,19,.22)}
.sticky-action.dual{display:flex;gap:10px}
.action-help{text-align:center;color:var(--muted-2);font:500 12px/1.4 var(--sans);margin-top:8px}


/* ---------- Ugrađena mapa rute na detalju ---------- */
.route-preview{margin:4px 20px 8px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,#12414d,#071e26);box-shadow:var(--shadow-sm)}
.route-preview-map{height:174px;position:relative;overflow:hidden}
.route-preview-map svg{width:100%;height:100%;display:block}
.route-preview-head{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.route-preview-head span{font:700 11px/1 var(--sans);padding:7px 10px;border-radius:999px;
  background:rgba(6,28,34,.88);border:1px solid var(--line);color:var(--cream)}
.route-preview-foot{display:flex;align-items:center;gap:10px;padding:11px 12px;background:rgba(6,28,34,.76);border-top:1px solid var(--line-2)}
.route-preview-foot p{flex:1;margin:0;color:var(--muted);font:500 12px/1.4 var(--sans)}
.route-preview-pin{filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.demo-help{margin-top:10px;color:var(--muted-2);font:600 12px/1.4 var(--sans)}
.demo-help summary{cursor:pointer;color:var(--gold);list-style:none;text-align:center}
.demo-help summary::-webkit-details-marker{display:none}
.demo-help p{margin:8px 0 0;text-align:center}
@media(max-height:700px){:root{--map-h:38dvh}.hero-art{height:140px}.route-preview-map{height:145px}}

/* ---------- Setup ---------- */
.avatar-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.avatar{width:52px;height:52px;border-radius:14px;font-size:26px;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line-2)}
.avatar.on{border-color:var(--gold);background:rgba(216,169,74,.14);box-shadow:0 0 0 3px rgba(216,169,74,.14)}

/* ---------- Preflight ---------- */
.permission-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.permission-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line-2)}
.permission-row .ico{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(0,0,0,.25)}
.permission-row .txt{flex:1;min-width:0}
.permission-row .txt b{display:block;color:var(--cream);font:700 14px/1.2 var(--sans)}
.permission-row .txt span{color:var(--muted);font:500 12px/1.4 var(--sans)}
.permission-row .state{font:700 12px/1 var(--sans);padding:5px 9px;border-radius:999px;white-space:nowrap}
.permission-row .state.ok{color:#a7e3bd;background:rgba(90,168,119,.15)}
.permission-row .state.warn{color:#f2d79a;background:rgba(224,168,63,.15)}

/* ---------- Game head + tabs ---------- */
.game{position:relative}
.game-head{padding:12px 16px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,rgba(6,28,34,.96),rgba(6,28,34,.7));backdrop-filter:blur(6px)}
.game-head-main{display:flex;align-items:center;gap:12px}
.game-title{flex:1;min-width:0}
.game-title b{display:block;font-family:var(--disp);font-size:19px;color:var(--cream);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-title span{color:var(--muted);font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.signal-button{position:relative;width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);
  background:rgba(216,169,74,.08);color:var(--gold-2);font-size:19px;display:grid;place-items:center;cursor:pointer}
.signal-button .count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--red);color:#fff;font:700 11px/19px var(--sans);text-align:center}
.game-meta-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.game-meta{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);color:var(--muted)}
.gps-dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2)}
.gps-dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(90,168,119,.6);animation:pulse 1.8s infinite}
.gps-dot.waiting{background:var(--amber)}
.gps-dot.error{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,168,119,.5)}70%{box-shadow:0 0 0 8px rgba(90,168,119,0)}100%{box-shadow:0 0 0 0 rgba(90,168,119,0)}}
.test-chip{font:700 11px/1 var(--sans);color:#2a1d05;background:var(--amber);border-radius:999px;padding:5px 9px;cursor:pointer}
.chapterbar{display:flex;gap:6px;margin-top:12px}
.chapterdot{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.1)}
.chapterdot.done{background:var(--green)}
.chapterdot.now{background:var(--gold)}
.tabs{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line-2);background:rgba(6,28,34,.94);min-height:var(--tabs-h);align-items:center}
.tab{flex:1;min-height:44px;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);
  font:700 12px/1.2 var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tab .ti{font-size:18px}
.tab.on{color:var(--gold-2);background:rgba(216,169,74,.1);border-color:var(--line)}

/* ---------- Explore / mapa ---------- */
.game-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.live-map-shell{position:relative;height:var(--map-h);min-height:220px;background:var(--ocean);transition:height .28s var(--ease)}
.live-map-shell.big{height:74dvh}
.live-map,#map{position:absolute;inset:0}
#map{background:var(--ocean)}
.map-loading{position:absolute;z-index:7;top:54px;left:50%;display:flex;align-items:center;justify-content:center;gap:7px;
  transform:translateX(-50%);padding:8px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;
  background:rgba(6,28,34,.9);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  color:var(--gold-2);font:700 12px/1 var(--sans)}
.mlspin{display:inline-block;font-size:18px;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.map-fallback-note{position:absolute;left:10px;right:52px;bottom:10px;text-align:left;color:var(--muted);
  font:500 10.5px/1.35 var(--sans);background:rgba(6,28,34,.82);border:1px solid var(--line-2);
  border-radius:8px;padding:6px 8px;white-space:normal}
.map-pill.on{background:rgba(216,169,74,.9);color:#2a1d05;border-color:var(--gold-2)}
.map-expand{position:absolute;right:10px;bottom:10px;z-index:6;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:rgba(6,28,34,.86);color:var(--gold-2);font-size:16px;display:grid;place-items:center;cursor:pointer}
@keyframes lpin{50%{filter:brightness(1.25)}}
/* Leaflet tema */
.leaflet-container{background:var(--ocean)!important;font-family:var(--sans)!important}
.leaflet-control-zoom a{background:rgba(6,28,34,.9)!important;color:var(--gold-2)!important;border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:rgba(14,53,64,.95)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow-sm)!important}
.leaflet-popup-content-wrapper{background:linear-gradient(180deg,var(--ocean-2),var(--deep))!important;color:var(--cream)!important;
  border:1px solid var(--line)!important;border-radius:12px!important}
.leaflet-popup-content{margin:10px 12px!important;font:600 13px/1.4 var(--sans)!important}
.leaflet-popup-tip{background:var(--deep)!important;border:1px solid var(--line)!important}
.leaflet-popup-close-button{color:var(--muted)!important}
.leaflet-control-attribution{background:rgba(6,28,34,.7)!important;color:var(--muted-2)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--sea)!important}
.map-fallback{position:absolute;inset:0;display:flex;flex-direction:column}
.map-fallback-card{flex:1;position:relative;overflow:hidden;background:
  repeating-linear-gradient(0deg,rgba(216,169,74,.05) 0 1px,transparent 1px 30px),
  repeating-linear-gradient(90deg,rgba(216,169,74,.05) 0 1px,transparent 1px 30px),
  radial-gradient(circle at 50% 40%,#12414d,#071e26)}
.map-top-actions{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:5;pointer-events:none}
.map-pill{pointer-events:auto;font:700 12px/1 var(--sans);color:var(--cream);background:rgba(6,28,34,.86);
  border:1px solid var(--line);border-radius:999px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.map-stage-badge{margin-left:auto;pointer-events:none;font:700 12px/1 var(--sans);color:var(--gold-2);
  background:rgba(6,28,34,.86);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.mission-sheet-inline{padding:16px 18px 8px}
.mission-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mission-heading h2{font-family:var(--disp);font-size:22px;color:var(--cream);margin:0;line-height:1.05}
.stop-count{font:700 11px/1 var(--sans);color:var(--gold);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.mission-copy{color:var(--muted);font:500 14px/1.5 var(--serif);margin:8px 0 0}
.arrival-action-card{margin:14px 18px;border-radius:var(--radius);border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(216,169,74,.12),rgba(216,169,74,.03));padding:16px}
.arrival-art{font-size:30px;margin-bottom:6px}
.arrival-task{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--cream)}
.distance-block{display:flex;align-items:center;gap:12px;margin:14px 18px;padding:14px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--line-2)}
.distance-block .big{font-family:var(--disp);font-size:30px;color:var(--gold-2);line-height:1}
.distance-block .lbl{color:var(--muted);font:600 12px/1.3 var(--sans)}
.heat{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--gold),var(--red));transition:width .5s var(--ease)}
.primary-route-actions{padding:6px 18px 14px;display:flex;flex-direction:column;gap:10px}
.deduction-card{margin:6px 18px 14px;border-radius:var(--radius);border:1px solid rgba(90,168,119,.4);
  background:rgba(90,168,119,.1);padding:14px}
.deduction-card .kick{color:#a7e3bd;font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.deduction-card p{margin:6px 0 0;color:var(--cream);font:500 14px/1.5 var(--serif)}
.route-pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50% 50% 50% 0;
  transform-origin:center;background:var(--surface);border:2px solid var(--gold);rotate:-45deg;display:grid;place-items:center}
.route-pin span{rotate:45deg;font:700 12px/1 var(--sans);color:var(--gold-2)}
.route-pin.done{border-color:var(--green);background:rgba(90,168,119,.25)}
.route-pin.done span{color:#a7e3bd}
.route-pin.active{border-color:var(--gold-2);box-shadow:0 0 0 4px rgba(216,169,74,.25);animation:pinpulse 1.6s infinite}
@keyframes pinpulse{50%{box-shadow:0 0 0 8px rgba(216,169,74,.05)}}

/* ---------- Case file ---------- */
.game-pad{padding:18px}
.case-hero{border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(180deg,rgba(216,169,74,.08),transparent);padding:16px;margin-bottom:14px}
.case-hero .cno{color:var(--gold);font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.case-hero h2{font-family:var(--disp);font-size:24px;color:var(--cream);margin:8px 0 4px;line-height:1.05}
.section-head{font:700 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}
.logic-spine{display:flex;flex-direction:column;gap:0;margin:4px 0}
.case-beat{position:relative;padding:0 0 16px 30px}
.case-beat::before{content:"";position:absolute;left:9px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--night);border:2px solid var(--muted-2)}
.case-beat::after{content:"";position:absolute;left:14px;top:15px;bottom:0;width:2px;background:var(--line-2)}
.case-beat:last-child::after{display:none}
.case-beat.done::before{background:var(--green);border-color:var(--green)}
.case-beat.active::before{background:var(--gold);border-color:var(--gold-2);box-shadow:0 0 0 4px rgba(216,169,74,.2)}
.case-beat.locked{opacity:.5}
.case-beat b{display:block;color:var(--cream);font:700 14px/1.25 var(--sans)}
.case-beat p{margin:4px 0 0;color:var(--muted);font:500 13.5px/1.5 var(--serif)}
.truth-card{margin-top:14px;border-radius:var(--radius);border:1px dashed var(--line);background:rgba(0,0,0,.2);padding:16px;filter:blur(0)}
.truth-card.locked{filter:blur(5px);user-select:none;pointer-events:none}
.truth-card .kick{color:var(--gold);font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.truth-card p{margin:8px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--cream)}
.fiction-note{margin-top:12px;color:var(--muted-2);font:500 12px/1.5 var(--sans);border-top:1px solid var(--line-2);padding-top:10px}
.source-note{margin-top:14px;color:var(--muted-2);font:500 11.5px/1.5 var(--sans)}
.source-note a{color:var(--sea)}

/* ---------- Side quests ---------- */
.bonus-intro{color:var(--muted);font:500 14px/1.5 var(--serif);margin:0 0 14px}
.side-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:10px}
.side-card .sq-ico{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(0,0,0,.25)}
.side-card .sq-body{flex:1;min-width:0}
.side-card .sq-body b{display:block;color:var(--cream);font:700 14px/1.25 var(--sans)}
.side-card .sq-body p{margin:4px 0 0;color:var(--muted);font:500 13px/1.45 var(--serif)}
.side-card.lock{opacity:.5}
.side-card.done{border-color:rgba(90,168,119,.4);background:rgba(90,168,119,.08)}
.side-score{font:700 12px/1 var(--sans);color:var(--gold);white-space:nowrap}

/* ---------- Overlay / sheet ---------- */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(3,15,19,.62);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.overlay.on{opacity:1;pointer-events:auto}
.overlay.center{align-items:center;justify-content:center;padding:20px}
.sheet{width:100%;max-height:88dvh;overflow-y:auto;background:linear-gradient(180deg,var(--ocean-2),var(--deep));
  border-top-left-radius:var(--panel-radius);border-top-right-radius:var(--panel-radius);border:1px solid var(--line);
  padding:8px 20px calc(20px + env(safe-area-inset-bottom,0));transform:translateY(20px);transition:transform .3s var(--ease);box-shadow:var(--shadow)}
.overlay.on .sheet{transform:none}
.overlay.center .sheet{max-width:400px;border-radius:var(--panel-radius);transform:scale(.96)}
.overlay.center.on .sheet{transform:none}
.sheet-handle{width:42px;height:5px;border-radius:999px;background:rgba(255,255,255,.2);margin:6px auto 12px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet-head h3{font-family:var(--disp);font-size:22px;color:var(--cream);margin:0;flex:1;line-height:1.1}
.sheet-body{color:var(--cream)}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.location-visual{height:120px;border-radius:14px;display:grid;place-items:center;font-size:44px;margin-bottom:12px;
  background:radial-gradient(circle at 40% 30%,#12414d,#071e26);border:1px solid var(--line);color:var(--gold-2)}
.location-caption{color:var(--muted);font:500 13px/1.5 var(--serif);margin-bottom:6px}
.challenge-title{color:var(--gold);font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.challenge-question{font-family:var(--serif);font-size:18px;line-height:1.4;color:var(--cream);margin:8px 0 14px}
.choice{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;margin-bottom:9px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--cream);font:600 15px/1.35 var(--sans);transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--gold)}
.choice.pick{border-color:var(--gold);background:rgba(216,169,74,.14)}
.choice.correct{border-color:var(--green);background:rgba(90,168,119,.16)}
.choice.wrong{border-color:var(--red);background:rgba(208,90,72,.14)}
.feedback{margin-top:10px;padding:12px 14px;border-radius:12px;font:600 14px/1.45 var(--sans)}
.feedback.good{background:rgba(90,168,119,.14);color:#a7e3bd;border:1px solid rgba(90,168,119,.4)}
.feedback.bad{background:rgba(208,90,72,.12);color:#ffb0a4;border:1px solid rgba(208,90,72,.4)}
.decision-grid{display:flex;gap:10px;margin-top:6px}
.decision-option{flex:1}
.reveal-sheet .evi{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:rgba(216,169,74,.1);border:1px solid var(--line);margin-top:6px}
.reveal-sheet .evi .g{font-size:30px}
.reveal-sheet .evi b{display:block;color:var(--gold-2);font-family:var(--disp);font-size:18px}
.reveal-sheet .evi p{margin:4px 0 0;color:var(--cream);font:500 14px/1.5 var(--serif)}

/* ---------- Signali / lista ---------- */
.signal-list{display:flex;flex-direction:column;gap:10px}
.signal-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.signal-item .si{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(0,0,0,.25)}
.signal-item .sc{flex:1;min-width:0}
.signal-item .signal-kind{font:700 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.signal-item b{display:block;color:var(--cream);font:700 14px/1.25 var(--sans);margin:3px 0}
.signal-item p{margin:0;color:var(--muted);font:500 13px/1.45 var(--serif)}
.signal-toast{position:absolute;left:16px;right:16px;top:calc(var(--header-h) + 6px);z-index:50;display:flex;gap:10px;
  padding:10px 12px;border-radius:13px;background:linear-gradient(180deg,var(--ocean-2),var(--deep));border:1px solid var(--gold);
  box-shadow:var(--shadow);transform:translateY(-12px);opacity:0;transition:transform .26s var(--ease),opacity .26s;
  pointer-events:none;max-width:calc(var(--app-max) - 32px);max-height:94px;overflow:hidden}
.signal-toast.on{transform:none;opacity:1}
.signal-toast .si{font-size:22px}
.signal-toast .sc b{display:block;color:var(--gold-2);font:700 14px/1.2 var(--sans)}
.signal-toast .sc p{margin:3px 0 0;color:var(--cream);font:500 13px/1.4 var(--serif)}

/* ---------- Route fullscreen sheet ---------- */
.route-stops{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.route-stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line-2)}
.route-stop .rn{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--sans);color:#2a1d05;background:var(--gold)}
.route-stop b{color:var(--cream);font:700 14px/1.2 var(--sans)}
.route-stop span{color:var(--muted);font:500 12px/1.4 var(--sans)}
.route-note{color:var(--muted-2);font:500 12px/1.5 var(--sans);margin-top:10px}

/* ---------- Finale ---------- */
.finale{justify-content:center}
.final-seal{width:104px;height:104px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:48px;
  background:radial-gradient(circle at 34% 28%,var(--gold-2),var(--gold-deep));color:#2a1d05;box-shadow:0 12px 40px rgba(216,169,74,.4)}
.metrics{display:flex;gap:10px;margin:16px 0}
.metric{flex:1;text-align:center;padding:14px 8px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2)}
.metric .n{font-family:var(--disp);font-size:26px;color:var(--gold-2);line-height:1}
.metric .l{color:var(--muted);font:600 11px/1.3 var(--sans);margin-top:5px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- Toasts ---------- */
.toast{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translate(-50%,16px);
  z-index:60;padding:11px 18px;border-radius:999px;background:rgba(6,28,34,.96);border:1px solid var(--gold);
  color:var(--cream);font:700 13px/1 var(--sans);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:transform .28s var(--ease),opacity .28s;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- Confetti ---------- */
.confetti{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120dvh) rotate(540deg);opacity:0}}

/* ---------- Utility ---------- */
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.stack>*+*{margin-top:12px}


/* ---------- UX zaštita od preklapanja ---------- */
#app:has(.signal-toast.on) .map-top-actions{top:102px}
#app:has(.signal-toast.on) .map-loading{top:154px}
.setup-summary{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.setup-summary div{text-align:center;padding:11px 6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line-2)}
.setup-summary b{display:block;color:var(--gold-2);font:700 13px/1.2 var(--sans)}
.setup-summary span{display:block;margin-top:4px;color:var(--muted);font:500 10.5px/1.25 var(--sans)}
@media(max-width:340px){.setup-summary{grid-template-columns:1fr}.setup-summary div{text-align:left}}

/* ---------- Responsive / a11y ---------- */
@media (max-width:380px){:root{--header-h:70px}.title,.hero-copy h1{font-size:26px}.brandtitle{font-size:30px}}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.05ms!important}
}

":19.267,"radius":55,"art":"bridge","far":"Spustite se do mosta Sastavci, na mjestu gdje se Ribnica uliva u Moraču.","near":"Tražite kameni most preko Ribnice, blizu ušća.","close":"Završna dedukcija spaja sve prethodne oznake u jedan zaključak.","arrival":"Na mostu Sastavci svi tragovi se spajaju. Oznake iz bilježnice ne vode do zlata, već do mreže mjesta na kojima je čuvana i evakuisana gradska dokumentacija.","objective":"Zaključi šta oznake zapravo predstavljaju.","type":"choice","question":"Šta zaista prikazuje plan iz bilježnice?","answer":3,"hint":"Sve tačke su bile mjesta uprave, objava i evidencije.","points":300,"evidence":{"glyph":"🗃️","title":"Karta arhiva","copy":"Oznake prate mrežu gradske dokumentacije. Kada je jezgro bilo ugroženo, arhiv je razmješten na sigurna mjesta, a plan je kasnije pogrešno pročitan kao karta blaga."},"fact":"Most Sastavci nalazi se na ušću Ribnice u Moraču, u zoni najstarijeg gradskog jezgra.","access":"Javni spoljašnji prostor.","options":["Tačne lokacije zakopanog zlata","Plan kanalizacije grada","Raspored vojnih topova","Mrežu mjesta gdje je čuvan gradski arhiv"],"signals":{"start":{"icon":"🌉","label":"Posljednja oznaka","title":"Peti simbol spaja rijeke i tragove","body":"Uz njega piše: 'gdje se sve sastaje, tu se sve čuva'.","kind":"message"},"near":{"icon":"💧","label":"Istorijska zanimljivost","title":"Sastavci označavaju spajanje Ribnice i Morače","body":"To mjesto je simbol najstarijeg dijela grada.","kind":"fact"},"close":{"icon":"🧩","label":"Završna dedukcija","title":"Spojite svih pet tačaka","body":"Sve su bile mjesta uprave, objava ili evidencije.","kind":"message"},"after":{"icon":"✅","label":"Slučaj zatvoren","title":"Istraga napreduje","body":"Most Sastavci zatvara istragu: plan je karta sklonjenog arhiva, a legenda o zlatu je kasnija zabluda.","kind":"message"}},"id":"podgorica-cp-5","accept":[],"deduction":"Most Sastavci zatvara istragu: plan je karta sklonjenog arhiva, a legenda o zlatu je kasnija zabluda.", id":"p-ev5","minIdx":4,"icon":"🗃️","label":"Završni signal","title":"Mreža oznaka odgovara mreži evidencije","body":"Plan je karta dokumentacije, ne blaga.","kind":"message"}],"sourceNote":"Osnova: Turistička organizacija Glavnog grada Podgorice i otvoreni kartografski podaci. Prije prodaje potvrditi pristup vjerskim objektima i bezbjednost prilaza ušću. Sadržaj je dramaturški revidiran 02.08.2026; istorijske tvrdnje treba održavati prema navedenim zvaničnim izvorima.","contentVersion":"2.1.0","arc":{"premise":"Plan sa pet oznaka izgleda kao karta skrivenog zlata.","question":"Da li oznake predstavljaju sanduke zlata ili dijelove gradskog arhiva?","stakes":"Pogrešno čitanje pretvara ozbiljnu istoriju grada u lov na izmišljeno blago.","truth":"Oznake prate mrežu mjesta na kojima je čuvana i evakuisana gradska dokumentacija.","fictionNote":"Bilježnica i oznake su fiktivne. Sahat-kula, džamije, tvrđava na ušću i most Sastavci su stvarni.","steps":["Referentna tačka vremena","Mjesto objava zajednice","Tačka carinske evidencije","Sigurna utvrđena tačka","Spoj svih tragova - arhiv"]},"editorialSources":["https://podgorica.travel/","https://podgorica.travel/sta-raditi/kulturne-znamenitosti/"]}}};

<script>
/* ============================================================
   Montenegro Treasure Hunt — engine (v2, čist)
   Jedan tok: gate → voucher → tour → setup → preflight → game → finale
   Bez admin panela, bez legacy view-ova, bez nedefinisanih referenci.
   ============================================================ */
(function(){
"use strict";
var CFG=window.MTH_CONFIG, DATA=window.MTH_CONTENT;
if(!CFG||!DATA){document.body.innerHTML='<p style="color:#fff;padding:20px">Greška: sadržaj nije učitan.</p>';return;}

/* ---------- Helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms||10);}catch(e){}}
var app=$('#app');

function normalizeAnswer(s){
  return String(s==null?'':s).toUpperCase()
    .replace(/Đ/g,'DJ').replace(/Ђ/g,'DJ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
function haversine(a,b,c,d){
  var R=6371000,p=Math.PI/180;
  var dlat=(c-a)*p,dlng=(d-b)*p;
  var x=Math.sin(dlat/2)*Math.sin(dlat/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dlng/2)*Math.sin(dlng/2);
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+' km':m+' m';}

/* ---------- State ---------- */
var S={voucher:null,tourId:null,caseData:null,player:'Posada',avatar:'🧭',
  chapterIdx:0,points:0,solved:{},side:{},events:{},signals:[],
  test:{enabled:false},pos:null,accuracy:null,gpsState:'idle',streak:0,map:null,mapMode:null,
  activeTab:'explore',signalTimer:null};

function save(){
  try{localStorage.setItem(CFG.STORAGE_KEY,JSON.stringify({
    voucherCode:S.voucher&&S.voucher.code,tourId:S.tourId,player:S.player,avatar:S.avatar,
    chapterIdx:S.chapterIdx,points:S.points,solved:S.solved,side:S.side,events:S.events
  }));}catch(e){}
}
function loadSaved(){try{var r=localStorage.getItem(CFG.STORAGE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function clearSaved(){try{localStorage.removeItem(CFG.STORAGE_KEY);}catch(e){}}

/* ---------- Voucher (demo, lokalno) ---------- */
function validateVoucher(code){
  var c=String(code||'').trim().toUpperCase();
  var v=CFG.DEMO_VOUCHERS[c];
  if(!v)return null;
  return {code:c,amount:v.amount,label:v.label,tours:v.tours.slice()};
}

/* ---------- Router ---------- */
function show(id){
  var views=app.querySelectorAll('.view');
  for(var i=0;i<views.length;i++){
    var active=views[i].id==='view-'+id;
    views[i].classList.toggle('on',active);
    views[i].setAttribute('aria-hidden',active?'false':'true');
    try{views[i].inert=!active;}catch(e){}
  }
  var t=$('#view-'+id);
  var sc=t&&t.querySelector('.scroll,.game-scroll');if(sc)sc.scrollTop=0;
  if(t){var focus=t.querySelector('input,button,[tabindex]:not([tabindex="-1"])');if(focus)setTimeout(function(){try{focus.focus({preventScroll:true});}catch(e){}},30);}
}
function mount(id,node){var v=$('#view-'+id);v.innerHTML='';v.appendChild(node);}

/* ---------- Toast ---------- */
var toastEl=el('div','toast');app.appendChild(toastEl);var toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},2200);}

/* ============================================================
   GATE
   ============================================================ */
function renderGate(){
  var v=el('div','view gate on');v.id='view-gate';
  var pad=el('div','pad');
  pad.innerHTML=
    '<div class="brandmark">⚜</div>'+
    '<h1 class="brandtitle">Montenegro<br>Treasure Hunt</h1>'+
    '<span class="launch-badge">Istorijski lov na blago • 6 gradova</span>'+
    '<p class="ux-kicker">Prošetaj kroz stvarne gradske ulice i riješi slučaj korak po korak. Unesi svoj kod da otključaš ture.</p>'+
    '<div class="card gold gate-card">'+
      '<div class="field"><label>Pristupni kod</label>'+
      '<input class="input code" id="vcode" placeholder="MNE-FLEX-89" autocomplete="off" spellcheck="false" maxlength="16"></div>'+
      '<div class="form-error" id="verr"></div>'+
      '<button class="btn primary" id="vgo">Otključaj ture</button>'+
      (CFG.DEMO_MODE?'<details class="demo-help"><summary>Prikaži testne kodove</summary><p><b>MNE-FLEX-89</b> · <b>MNE-DEMO-79</b> · <b>KOTOR-ONLY</b></p></details>':'')+
    '</div>'+
    '<div id="resume-slot"></div>'+
    '<div class="legal-links">'+
      '<button data-info="privatnost">Privatnost</button>'+
      '<button data-info="uslovi">Uslovi</button>'+
      '<button data-info="o-igri">O igri</button>'+
    '</div>';
  v.appendChild(pad);
  app.appendChild(v);

  var input=$('#vcode',v),err=$('#verr',v);
  function attempt(){
    var res=validateVoucher(input.value);
    if(!res){err.textContent='Kod nije prepoznat. Provjeri unos.';haptic(30);input.focus();return;}
    err.textContent='';S.voucher=res;haptic(12);openVoucher();
  }
  $('#vgo',v).addEventListener('click',attempt);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
  input.addEventListener('input',function(){err.textContent='';});
  v.querySelectorAll('[data-info]').forEach(function(b){b.addEventListener('click',function(){openInfo(b.getAttribute('data-info'));});});

  // Resume
  var saved=loadSaved();
  if(saved&&saved.tourId&&DATA.cases[saved.tourId]){
    var slot=$('#resume-slot',v);
    var tour=findTour(saved.tourId);
    slot.innerHTML='<div class="resume-card"><div class="eyebrow">Nastavi</div>'+
      '<p style="margin:6px 0 10px;font-weight:600">'+esc(tour?tour.city:saved.tourId)+' — poglavlje '+((saved.chapterIdx||0)+1)+'</p>'+
      '<div class="row"><button class="btn paperbtn mini grow" id="rres">Nastavi igru</button>'+
      '<button class="btn ghost mini" id="rclr">Obriši</button></div></div>';
    $('#rres',slot).addEventListener('click',function(){resumeGame(saved);});
    $('#rclr',slot).addEventListener('click',function(){clearSaved();slot.innerHTML='';});
  }
}
function findTour(id){for(var i=0;i<DATA.tours.length;i++)if(DATA.tours[i].id===id)return DATA.tours[i];return null;}

function openInfo(kind){
  var map={
    'privatnost':['Privatnost','Lokacija se koristi isključivo za provjeru dolaska na kontrolne tačke i ne šalje se van uređaja u ovoj demo verziji. Napredak se čuva lokalno u pregledaču.'],
    'uslovi':['Uslovi','Demo/preview verzija. Rute su digitalno provjerene i zahtijevaju završni terenski prolazak prije komercijalne upotrebe.'],
    'o-igri':['O igri','Šest gradova, šest slučajeva zasnovanih na stvarnim javnim lokacijama Crne Gore. Misterije su fiktivne; istorijske kartice se oslanjaju na zvanične izvore navedene u svakom slučaju.']
  };
  var m=map[kind]||['Info',''];
  openSheet(m[0],'<p style="font:500 14px/1.55 var(--serif);color:var(--cream)">'+esc(m[1])+'</p>',false);
}

/* ============================================================
   VOUCHER — otključane ture
   ============================================================ */
function openVoucher(){
  var v=S.voucher;
  var node=el('div','view');node.id='view-voucher';
  var head=el('div','voucher-compact');
  head.innerHTML='<button class="iconbtn" id="vback" aria-label="Nazad">‹</button>'+
    '<div class="grow"><div class="amount">'+v.amount+' €</div><div class="code">'+esc(v.code)+'</div></div>'+
    '<span class="pill good">Aktivno</span>';
  node.appendChild(head);
  var sc=el('div','scroll');
  sc.appendChild(el('div','city-count',v.tours.length+' otključanih gradova'));
  var grid=el('div','city-grid');
  DATA.tours.forEach(function(t){
    var unlocked=v.tours.indexOf(t.id)>-1;
    var tile=el('button','city-tile'+(unlocked?'':' '));
    if(!unlocked)tile.disabled=true;
    tile.innerHTML='<div class="city-thumb">'+esc(t.mark)+'</div>'+
      '<div class="city-body"><h3>'+esc(t.city)+'</h3><p>'+esc(t.title)+'</p>'+
      '<div class="city-meta"><span>'+esc(t.duration)+'</span><span>'+esc(t.distance)+'</span><span>'+esc(t.level)+'</span>'+
      (unlocked?'':'<span>🔒 zaključano</span>')+'</div></div>';
    if(unlocked)tile.addEventListener('click',function(){openTour(t.id);});
    grid.appendChild(tile);
  });
  sc.appendChild(grid);
  sc.appendChild(el('p','ux-note center',' Izaberi grad da vidiš detalje ture.'));
  sc.appendChild(el('div','safe'));
  node.appendChild(sc);
  var old=$('#view-voucher');if(old)old.remove();
  app.appendChild(node);
  $('#vback',node).addEventListener('click',function(){show('gate');});
  show('voucher');
}

/* ============================================================
   TOUR DETAIL
   ============================================================ */
function routePreviewHTML(c){
  var cps=c.checkpoints||[],W=320,H=170,p=24;
  if(!cps.length)return '';
  var las=cps.map(function(x){return x.lat;}),los=cps.map(function(x){return x.lng;});
  var minLa=Math.min.apply(null,las),maxLa=Math.max.apply(null,las),minLo=Math.min.apply(null,los),maxLo=Math.max.apply(null,los);
  function x(lng){return p+(lng-minLo)/((maxLo-minLo)||1)*(W-2*p);}
  function y(lat){return H-p-(lat-minLa)/((maxLa-minLa)||1)*(H-2*p);}
  var d='';cps.forEach(function(cp,i){d+=(i?' L':'M')+x(cp.lng).toFixed(1)+' '+y(cp.lat).toFixed(1);});
  var pins='';cps.forEach(function(cp,i){
    pins+='<g class="route-preview-pin" transform="translate('+x(cp.lng).toFixed(1)+','+y(cp.lat).toFixed(1)+')">'+

/* ============================================================
   PREFLIGHT — dozvole
   ============================================================ */
function openPreflight(id){
  var node=el('div','view');node.id='view-preflight';
  var top=el('div','topbar');top.innerHTML='<button class="iconbtn" id="pback">‹</button><b class="disp" style="font-size:20px">Priprema</b>';
  node.appendChild(top);
  var sc=el('div','scroll');var pad=el('div','pad');
  pad.innerHTML='<div class="eyebrow">Prije polaska</div><h2 class="title">Provjeri opremu posade</h2>'+
    '<div class="permission-list" id="perms">'+
    permRow('location','📍','Lokacija (GPS)','Potvrđuje dolazak na kontrolne tačke','warn','Traži se')+
    permRow('move','🚶','Kretanje','Igra se odvija u pokretu, kroz grad','ok','Spremno')+
    permRow('battery','🔋','Baterija i podaci','Preporučeno napunjeno i uključeni podaci','ok','Provjeri')+
    '</div>'+
    '<div class="card mt16"><div class="eyebrow">Bezbjednost</div>'+
    '<p class="ux-note mt8">Pratite saobraćaj i okolinu. Zadaci se rješavaju iz javnog prostora — nije potrebno ulaziti u objekte niti dirati eksponate.</p></div>'+
    (isSecure()?'':'<div class="route-warning mt16" style="margin-left:0;margin-right:0">🔒 GPS radi samo kada je sajt otvoren preko <b>https://</b> (ili localhost). Ako je fajl otvoren kao <b>file://</b>, lokacija neće raditi — koristi „Test bez GPS-a" ili hostuj sajt na HTTPS-u.</div>');
  sc.appendChild(pad);sc.appendChild(el('div','safe'));node.appendChild(sc);
  var sticky=el('div','sticky-action dual');
  sticky.innerHTML=(CFG.ALLOW_QA?'<button class="btn ghost" id="pqa">Pokreni test</button>':'')+
    '<button class="btn primary grow" id="pstart">Koristi GPS i kreni</button>';
  node.appendChild(sticky);
  var old=$('#view-preflight');if(old)old.remove();app.appendChild(node);

  $('#pback',node).addEventListener('click',function(){show('setup');});
  var qaBtn=$('#pqa',node),startBtn=$('#pstart',node);
  function lockStart(label){
    if(qaBtn)qaBtn.disabled=true;if(startBtn){startBtn.disabled=true;startBtn.textContent=label||'Pokrećem…';}
  }
  if(CFG.ALLOW_QA&&qaBtn)qaBtn.addEventListener('click',function(){lockStart('Pokrećem test…');S.test.enabled=true;beginGame(id,true);});
  startBtn.addEventListener('click',function(){
    lockStart('Tražim GPS…');
    var row=$('#perms .state',node);
    if(navigator.geolocation){
      row.textContent='Tražim…';row.className='state warn';
      navigator.geolocation.getCurrentPosition(function(p){
        row.textContent='Aktivno';row.className='state ok';
        S.pos={lat:p.coords.latitude,lng:p.coords.longitude};S.accuracy=p.coords.accuracy;
        beginGame(id,false);
      },function(err){
        row.textContent=(err&&err.code===1)?'Odbijeno':'Nedostupno';row.className='state warn';
        toast((err&&err.code===1&&!isSecure())?'GPS traži HTTPS — pokrećem test režim.':'GPS nije dostupan — test režim.');
        S.test.enabled=true;beginGame(id,true);
      },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
    }else{
      toast('Uređaj nema GPS — test režim.');S.test.enabled=true;beginGame(id,true);
    }
  });
  show('preflight');
}
function permRow(k,ico,title,sub,state,label){
  return '<div class="permission-row" data-k="'+k+'"><div class="ico">'+ico+'</div>'+
    '<div class="txt"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'+
    '<span class="state '+state+'">'+esc(label)+'</span></div>';
}

/* ============================================================
   GAME — start / resume
   ============================================================ */
function beginGame(id,testMode){
  S.tourId=id;S.caseData=DATA.cases[id];
  S.chapterIdx=0;S.points=0;S.solved={};S.side={};S.events={};S.signals=[];S.streak=0;
  S.test.enabled=!!testMode;S.activeTab='explore';S.gpsState=testMode?'test':'waiting';
  save();requestWake();renderGame();show('game');
  if(!testMode)startWatch();
  fireStartSignal();
}
function resumeGame(saved){
  S.voucher=validateVoucher(saved.voucherCode)||{code:saved.voucherCode,amount:0,tours:[saved.tourId]};
  S.tourId=saved.tourId;S.caseData=DATA.cases[saved.tourId];
  S.player=saved.player||'Posada';S.avatar=saved.avatar||'🧭';
  S.chapterIdx=saved.chapterIdx||0;S.points=saved.points||0;
  S.solved=saved.solved||{};S.side=saved.side||{};S.events=saved.events||{};
  S.signals=[];S.streak=0;S.test.enabled=false;S.activeTab='explore';
  requestWake();renderGame();
  if(navigator.geolocation)startWatch();else{S.test.enabled=true;S.gpsState='test';}
  show('game');
}

function curCP(){var cps=S.caseData.checkpoints;return cps[Math.min(S.chapterIdx,cps.length-1)];}
function allSolved(){return S.chapterIdx>=S.caseData.checkpoints.length;}

function renderGame(){
  var node=$('#view-game');if(node){node.innerHTML='';}else{node=el('div','view game');node.id='view-game';app.appendChild(node);}
  var c=S.caseData,tour=findTour(S.tourId);

  // Head
  var head=el('div','game-head');
  var unread=S.signals.filter(function(s){return !s.read;}).length;
  head.innerHTML=
    '<div class="game-head-main">'+
      '<button class="iconbtn" id="gexit" aria-label="Izlaz">✕</button>'+
      '<div class="game-title"><b>'+esc(tour.city)+'</b><span>'+esc(c.caseNo)+'</span></div>'+
      '<button class="signal-button" id="gsig" aria-label="Signali">📡'+(unread?'<span class="count">'+unread+'</span>':'')+'</button>'+
    '</div>'+
    '<div class="game-meta-row">'+
      '<span class="game-meta"><span class="gps-dot '+gpsDotClass()+'"></span>'+gpsLabel()+'</span>'+
      '<span class="game-meta">⭐ '+S.points+' poena</span>'+
      (S.test.enabled?'<button class="test-chip" id="gtest" aria-label="Otvori test kontrole">🧪 TEST</button>':'')+
    '</div>'+
    chapterBar();
  node.appendChild(head);

  // Tabs
  var tabs=el('div','tabs');
  [['explore','🧭','Lov'],['case','🗂️','Dosije'],['side','✨','Bonus']].forEach(function(t){
    var b=el('button','tab'+(S.activeTab===t[0]?' on':''));
    b.innerHTML='<span class="ti">'+t[1]+'</span>'+t[2];
    b.addEventListener('click',function(){S.activeTab=t[0];renderGame();});
    tabs.appendChild(b);
  });

  // Body — ubaci u DOM prije renderovanja taba, da document-scoped
  // lookup (npr. #map u initMap) pronađe elemente.
  var body=el('div','game-scroll');body.id='gbody';
  node.appendChild(body);
  node.appendChild(tabs);
  if(S.activeTab==='explore')renderExplore(body);
  else if(S.activeTab==='case')renderCaseFile(body);
  else renderSide(body);

  $('#gexit',node).addEventListener('click',function(){confirmExit();});
  $('#gsig',node).addEventListener('click',openSignals);
  var gt=$('#gtest',node);if(gt)gt.addEventListener('click',openTestPanel);
}
function gpsDotClass(){return {live:'live',waiting:'waiting',error:'error',denied:'error',insecure:'error',test:'waiting',idle:'waiting'}[S.gpsState]||'waiting';}
function gpsLabel(){
  var acc=(S.gpsState==='live'&&S.accuracy!=null)?' ±'+Math.round(S.accuracy)+'m':'';
  return ({live:'GPS aktivan'+acc,waiting:'Tražim GPS…',error:'GPS greška',denied:'GPS odbijen',insecure:'GPS traži HTTPS',test:'Test režim',idle:'GPS'}[S.gpsState]||'GPS');
}
function chapterBar(){
  var n=S.caseData.checkpoints.length,h='<div class="chapterbar">';
  for(var i=0;i<n;i++){var cls=i<S.chapterIdx?'done':(i===S.chapterIdx&&!allSolved()?'now':'');h+='<span class="chapterdot '+cls+'"></span>';}
  return h+'</div>';
}

/* ---------- EXPLORE ---------- */
function renderExplore(body){
  var c=S.caseData;
  if(allSolved()){renderFinale();show('finale');return;}
  var cp=curCP();

  var shell=el('div','live-map-shell');shell.id='mapshell';
  shell.innerHTML='<div id="map" class="live-map"></div>'+
    '<div id="maploading" class="map-loading"><span class="mlspin">🧭</span> Povezujem uličnu mapu…</div>'+
    '<div class="map-top-actions">'+
      '<button class="map-pill" id="mrecenter">◎ Ja</button>'+
      '<button class="map-pill" id="mfollow">🎯 Prati</button>'+
      '<button class="map-pill" id="mroute">🗺 Ruta</button>'+
      '<span class="map-stage-badge">'+(S.chapterIdx+1)+'/'+c.checkpoints.length+'</span>'+
    '</div>'+
    '<button class="map-expand" id="mexpand" aria-label="Proširi mapu">⤢</button>';
  body.appendChild(shell);

  var head=el('div','mission-sheet-inline');
  head.innerHTML='<div class="mission-heading"><h2>'+esc(cp.name)+'</h2><span class="stop-count">'+esc(cp.chapter)+'</span></div>'+
    '<p class="mission-copy">'+esc(cp.objective)+'</p>';
  body.appendChild(head);

  var arrived=isArrived(cp);
  if(arrived){
    var ac=el('div','arrival-action-card');
    ac.innerHTML='<div class="arrival-art">'+cpArt(cp.art)+'</div>'+
      '<p class="arrival-task">'+esc(cp.arrival)+'</p>';
    var btn=el('button','btn primary mt12','Riješi zagonetku 🧩');
    btn.addEventListener('click',function(){openChallenge(cp);});
    ac.appendChild(btn);
    body.appendChild(ac);
  }else{
    var d=distTo(cp);
    var db=el('div','distance-block');
    db.innerHTML='<div><div class="big">'+(d==null?'—':fmtDist(d))+'</div><div class="lbl">'+(d==null?'Čekam GPS…':'do tačke')+'</div></div>'+
      '<div class="heat"><i style="width:'+heatWidth(d,cp.radius)+'%"></i></div>';
    body.appendChild(db);
    var actions=el('div','primary-route-actions');
    actions.innerHTML='<div class="mission-copy" style="margin:0">'+esc(d!=null&&d<250?cp.close:(d!=null&&d<700?cp.near:cp.far))+'</div>';
    var nav=el('button','btn ghost mt8','🧭 Otvori navigaciju');
    nav.addEventListener('click',function(){openExternalRoute(cp);});
    actions.appendChild(nav);
    body.appendChild(actions);
  }

  // Prethodna dedukcija
  if(S.chapterIdx>0){
    var prev=c.checkpoints[S.chapterIdx-1];
    var dc=el('div','deduction-card');
    dc.innerHTML='<div class="kick">Posljednji dokaz</div><p>'+esc(prev.deduction)+'</p>';
    body.appendChild(dc);
  }
  body.appendChild(el('div','safe'));

  // Map wiring
  $('#mrecenter',body).addEventListener('click',function(){recenterMap();});
  $('#mroute',body).addEventListener('click',openRouteSheet);
  $('#mfollow',body).addEventListener('click',function(){S.follow=!S.follow;syncFollowBtn();if(S.follow&&S.pos&&S.map)S.map.setView([S.pos.lat,S.pos.lng]);});
  $('#mexpand',body).addEventListener('click',function(){
    var sh=$('#mapshell');if(!sh)return;sh.classList.toggle('big');
    $('#mexpand').textContent=sh.classList.contains('big')?'⤡':'⤢';
    if(S.map)setTimeout(function(){try{S.map.invalidateSize();}catch(e){}},260);
  });
  syncFollowBtn();
  initMap();
}
function syncFollowBtn(){var b=$('#mfollow');if(b)b.classList.toggle('on',!!S.follow);}
function heatWidth(d,r){if(d==null)return 4;if(d<=r)return 100;var w=Math.max(4,Math.min(96,100-(d-r)/12));return Math.round(w);}
function distTo(cp){if(!S.pos)return null;return haversine(S.pos.lat,S.pos.lng,cp.lat,cp.lng);}
function isArrived(cp){if(S.test.enabled&&S.test.forceArrive)return true;var d=distTo(cp);return d!=null&&d<=cp.radius&&(S.accuracy==null||S.accuracy<=CFG.GPS_ARRIVE_ACCURACY)&&S.streak>=CFG.GPS_ARRIVE_STREAK;}
function cpArt(a){return {gate:'🚪',clock:'🕰️',cathedral:'⛪',chapel:'⛪',rivergate:'🌉',sea:'🌊',tower:'🗼',palace:'🏛️',square:'⛲',aqueduct:'🏗️',olive:'🫒',fortress:'🏰',bridge:'🌉'}[a]||'📍';}

function locationScene(cp){
  var ico=cpArt(cp.art),label=esc(cp.name);
  return '<div class="location-visual" style="height:148px;position:relative;overflow:hidden">'+
    '<svg viewBox="0 0 360 148" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">'+
      '<defs><linearGradient id="sky-'+cp.id+'" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#124451"/><stop offset="1" stop-color="#071e26"/></linearGradient></defs>'+
      '<rect width="360" height="148" fill="url(#sky-'+cp.id+')"/>'+
      '<circle cx="292" cy="34" r="22" fill="#f0cf82" opacity=".18"/>'+
      '<path d="M0 118 L55 77 L96 108 L155 61 L216 111 L275 74 L360 116 V148 H0Z" fill="#082b34" opacity=".9"/>'+
      '<path d="M0 130 Q70 118 140 132 T280 126 T360 130 V148 H0Z" fill="#0d3b46" opacity=".9"/>'+
    '</svg><div style="position:relative;z-index:2;text-align:center"><div style="font-size:48px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))">'+ico+'</div>'+
    '<div style="margin-top:7px;font:700 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2)">'+label+'</div></div></div>';
}

/* ---------- CASE FILE ---------- */
function renderCaseFile(body){
  var c=S.caseData;var pad=el('div','game-pad');
  var hero=el('div','case-hero');
  hero.innerHTML='<div class="cno">'+esc(c.caseNo)+'</div><h2>'+esc(c.title)+'</h2>'+
    '<p class="mission-copy" style="margin:6px 0 0">'+esc(c.arc.question)+'</p>';
  pad.appendChild(hero);

  pad.appendChild(el('div','section-head','Tok istrage'));
  var spine=el('div','logic-spine');
  c.checkpoints.forEach(function(cp,i){
    var st=i<S.chapterIdx?'done':(i===S.chapterIdx&&!allSolved()?'active':'locked');
    var beat=el('div','case-beat '+st);
    beat.innerHTML='<b>'+(i+1)+'. '+esc(cp.name)+'</b>'+
      '<p>'+esc(i<S.chapterIdx?cp.deduction:(i===S.chapterIdx?cp.objective:'Zaključano — riješi prethodne tačke.'))+'</p>';
    spine.appendChild(beat);
  });
  pad.appendChild(spine);

  pad.appendChild(el('div','section-head','Rasplet'));
  var truth=el('div','truth-card'+(allSolved()?'':' locked'));
  truth.innerHTML='<div class="kick">Istina slučaja</div><p>'+esc(allSolved()?c.arc.truth:c.finale)+'</p>';
  pad.appendChild(truth);
  pad.appendChild(el('div','fiction-note',esc(c.arc.fictionNote)));

  var src=el('div','source-note');
  var links=(c.editorialSources||[]).map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\//,''))+'</a>';}).join(' · ');
  src.innerHTML='<b>Izvori:</b> '+links+'<br>'+esc(c.sourceNote);
  pad.appendChild(src);
  pad.appendChild(el('div','safe'));
  body.appendChild(pad);
}

/* ---------- SIDE QUESTS ---------- */
function renderSide(body){
  var c=S.caseData;var pad=el('div','game-pad');
  pad.appendChild(el('p','bonus-intro','Bonus zadaci se otključavaju kako napredujete kroz tačke. Nose dodatne poene i traju samo minut.'));
  var total=0,done=0;
  c.sidequests.forEach(function(sq){
    total++;
    var unlocked=S.chapterIdx>=sq.unlock;
    var isDone=!!S.side[sq.id];if(isDone)done++;
    var card=el('div','side-card'+(isDone?' done':(unlocked?'':' lock')));
    card.innerHTML='<div class="sq-ico">'+sqIco(sq.type)+'</div>'+
      '<div class="sq-body"><b>'+esc(sq.title)+'</b><p>'+esc(unlocked?sq.copy:'🔒 Otključava se na tački '+(sq.unlock+1)+'.')+'</p>'+
      (isDone?'<p style="color:#a7e3bd;margin-top:6px">✓ '+esc(sq.result)+'</p>':'')+'</div>'+
      '<div class="side-score">+'+sq.points+'</div>';
    if(unlocked&&!isDone){
      var b=el('button','btn paperbtn mini mt8','Označi urađeno');
      b.addEventListener('click',function(){S.side[sq.id]=true;S.points+=sq.points;haptic(12);toast('+'+sq.points+' poena — '+sq.title);save();renderGame();});
      card.querySelector('.sq-body').appendChild(b);
    }
    pad.appendChild(card);
  });
  var bar=el('div','card mt12 center');
  bar.innerHTML='<div class="eyebrow">Bonus napredak</div><p style="font-family:var(--disp);font-size:24px;color:var(--gold-2);margin:6px 0 0">'+done+' / '+total+'</p>';
  pad.appendChild(bar);
  pad.appendChild(el('div','safe'));
  body.appendChild(pad);
}
function sqIco(t){return {photo:'📷',audio:'🎙️',counter:'🔢'}[t]||'✨';}

/* ============================================================
   CHALLENGE overlay
   ============================================================ */
var overlay=el('div','overlay center');overlay.id='overlay';
var sheet=el('div','sheet');overlay.appendChild(sheet);app.appendChild(overlay);
var overlayScrim=false;
overlay.addEventListener('click',function(e){if(e.target===overlay&&overlayScrim)closeOverlay();});
function openSheet(title,bodyHtml,bottom){
  overlayScrim=true;
  overlay.className='overlay'+(bottom===false?' center':'');
  sheet.innerHTML='<div class="sheet-handle"></div><div class="sheet-head"><h3>'+esc(title)+'</h3>'+
    '<button class="iconbtn" id="shx">✕</button></div><div class="sheet-body">'+bodyHtml+'</div>';
  requestAnimationFrame(function(){overlay.classList.add('on');});
  $('#shx',sheet).addEventListener('click',closeOverlay);
  return sheet;
}
function closeOverlay(){overlay.classList.remove('on');}

function openChallenge(cp){
  overlayScrim=false;
  overlay.className='overlay';
  var body=locationScene(cp)+
    '<p class="location-caption">'+esc(cp.arrival)+'</p>'+
    '<div class="challenge-title">'+esc(cp.objective)+'</div>'+
    '<p class="challenge-question">'+esc(cp.question)+'</p>'+
    '<div id="chbody"></div>'+
    '<div class="feedback" id="chfb" style="display:none"></div>';
  sheet.innerHTML='<div class="sheet-handle"></div>'+body;
  requestAnimationFrame(function(){overlay.classList.add('on');});
  var chbody=$('#chbody',sheet),fb=$('#chfb',sheet),answered=false;

  function win(){
    if(answered)return;answered=true;haptic(20);
    fb.style.display='block';fb.className='feedback good';
    fb.textContent='✓ Tačno! +'+cp.points+' poena';
    S.points+=cp.points;S.solved[cp.id]=true;
    var actions=el('div','sheet-actions');
    var cont=el('button','btn primary grow','Otključaj dokaz →');
    cont.addEventListener('click',function(){closeOverlay();showEvidence(cp);});
    actions.appendChild(cont);sheet.appendChild(actions);
    save();
  }
  function lose(msg){
    fb.style.display='block';fb.className='feedback bad';fb.textContent='✗ '+(msg||'Nije tačno. Trag: '+cp.hint);haptic(30);
  }

  if(cp.type==='choice'){
    cp.options.forEach(function(opt,i){
      var b=el('button','choice',esc(opt));
      b.addEventListener('click',function(){
        if(answered)return;
        chbody.querySelectorAll('.choice').forEach(function(x){x.classList.remove('pick');});
        b.classList.add('pick');
        if(i===cp.answer){b.classList.add('correct');win();}
        else{b.classList.add('wrong');lose();}
      });
      chbody.appendChild(b);
    });
  }else{
    var wrap=el('div');
    wrap.innerHTML='<input class="input" id="txans" placeholder="Upiši odgovor…" autocomplete="off" spellcheck="false">';
    var sub=el('button','btn primary mt12','Provjeri odgovor');
    wrap.appendChild(sub);chbody.appendChild(wrap);
    function check(){
      if(answered)return;
      var val=$('#txans',chbody).value;
      var target=[cp.answer].concat(cp.accept||[]).map(normalizeAnswer);
      if(target.indexOf(normalizeAnswer(val))>-1)win();else lose();
    }
    sub.addEventListener('click',check);
    $('#txans',chbody).addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  }
}

function showEvidence(cp){
  overlayScrim=true;overlay.className='overlay';
  sheet.innerHTML='<div class="sheet-handle"></div>'+
    '<div class="sheet-head"><h3>Novi dokaz</h3><button class="iconbtn" id="evx">✕</button></div>'+
    '<div class="sheet-body reveal-sheet">'+
      '<div class="evi"><div class="g">'+esc(cp.evidence.glyph)+'</div><div><b>'+esc(cp.evidence.title)+'</b>'+
      '<p>'+esc(cp.evidence.copy)+'</p></div></div>'+
      '<div class="card mt12"><div class="eyebrow">Istorijska kartica</div><p class="mission-copy" style="margin:6px 0 0">'+esc(cp.fact)+'</p></div>'+
    '</div>';
  var actions=el('div','sheet-actions');
  var last=(S.chapterIdx+1>=S.caseData.checkpoints.length);
  var b=el('button','btn primary grow',last?'Zatvori slučaj 🏁':'Nastavi ka sljedećoj tački →');
  b.addEventListener('click',function(){closeOverlay();advance(cp);});
  actions.appendChild(b);
  sheet.appendChild(actions);
  requestAnimationFrame(function(){overlay.classList.add('on');});
  $('#evx',sheet).addEventListener('click',function(){closeOverlay();advance(cp);});
}

function advance(cp){
  S.chapterIdx++;S.streak=0;if(S.test)S.test.forceArrive=false;
  save();
  // event?
  maybeFireEvent();
  if(allSolved()){renderFinale();show('finale');celebrate();return;}
  fireStartSignal();
  S.activeTab='explore';renderGame();
  updateMapStage();
}

/* ============================================================
   EVENTS
   ============================================================ */
function maybeFireEvent(){
  var evs=S.caseData.events||[];
  for(var i=0;i<evs.length;i++){
    var ev=evs[i];
    if(ev.minIdx===S.chapterIdx-1&&!S.events[ev.id]){
      S.events[ev.id]=true;
      if(ev.kind==='decision'){setTimeout(function(e){return function(){openDecision(e);};}(ev),400);}
      else{pushSignal({icon:ev.icon,label:ev.label,title:ev.title,body:ev.body,kind:ev.kind});}
      return;
    }
  }
}
function openDecision(ev){
  overlayScrim=false;overlay.className='overlay';
  var body='<div class="location-visual" style="font-size:38px">'+esc(ev.icon)+'</div>'+
    '<div class="challenge-title">'+esc(ev.label)+'</div>'+
    '<p class="challenge-question">'+esc(ev.title)+'</p>'+
    '<p class="mission-copy">'+esc(ev.body)+'</p>'+
    '<div class="decision-grid" id="decg"></div><div class="feedback" id="decfb" style="display:none"></div>';
  sheet.innerHTML='<div class="sheet-handle"></div>'+body;
  requestAnimationFrame(function(){overlay.classList.add('on');});
  var g=$('#decg',sheet),fb=$('#decfb',sheet),done=false;
  (ev.choices||[]).forEach(function(ch,i){
    var b=el('button','btn ghost decision-option',esc(ch));
    b.addEventListener('click',function(){
      if(done)return;done=true;
      S.points+=10;save();
      fb.style.display='block';fb.className='feedback good';
      fb.textContent=(ev.responses&&ev.responses[i])||'Zabilježeno. +10 poena';
      var act=el('div','sheet-actions');var cb=el('button','btn primary grow','Nastavi');
      cb.addEventListener('click',function(){closeOverlay();renderGame();});
      act.appendChild(cb);sheet.appendChild(act);
    });
    g.appendChild(b);
  });
}

/* ============================================================
   SIGNALS
   ============================================================ */
function pushSignal(sig){
  sig.read=false;sig.t=Date.now();S.signals.unshift(sig);
  showSignalToast(sig);
  var badge=$('#gsig');if(badge){var unread=S.signals.filter(function(s){return !s.read;}).length;
    badge.innerHTML='📡'+(unread?'<span class="count">'+unread+'</span>':'');}
}
var sigToast=el('div','signal-toast');app.appendChild(sigToast);var sigT;
function showSignalToast(sig){
  sigToast.innerHTML='<div class="si">'+esc(sig.icon||'📡')+'</div><div class="sc">'+
    '<b>'+esc(sig.title)+'</b><p>'+esc(sig.body)+'</p></div>';
  sigToast.classList.add('on');clearTimeout(sigT);
  sigT=setTimeout(function(){sigToast.classList.remove('on');},3400);
}
function fireStartSignal(){
  if(allSolved())return;
  var cp=curCP();if(cp&&cp.signals&&cp.signals.start){
    setTimeout(function(){pushSignal({icon:cp.signals.start.icon,label:cp.signals.start.label,title:cp.signals.start.title,body:cp.signals.start.body,kind:cp.signals.start.kind});},600);
  }
  scheduleAmbientSignal();
}
function scheduleAmbientSignal(){
  clearTimeout(S.signalTimer);
  var min=CFG.SIGNAL_MIN_SECONDS,max=CFG.SIGNAL_MAX_SECONDS;
  var wait=(min+Math.random()*(max-min))*1000;
  S.signalTimer=setTimeout(function(){
    if(allSolved())return;
    var cp=curCP();if(!cp||!cp.signals)return;
    var d=distTo(cp);var key=d==null?'near':(d<250?'close':'near');
    var sig=cp.signals[key]||cp.signals.near;
    if(sig)pushSignal({icon:sig.icon,label:sig.label,title:sig.title,body:sig.body,kind:sig.kind});
    scheduleAmbientSignal();
  },wait);
}
function openSignals(){
  S.signals.forEach(function(s){s.read=true;});
  var list='';
  if(!S.signals.length)list='<p class="ux-note">Još nema signala. Kreni prema prvoj tački.</p>';
  else S.signals.forEach(function(s){
    list+='<div class="signal-item"><div class="si">'+esc(s.icon||'📡')+'</div><div class="sc">'+
      '<div class="signal-kind">'+esc(s.label||s.kind||'signal')+'</div>'+
      '<b>'+esc(s.title)+'</b><p>'+esc(s.body)+'</p></div></div>';
  });
  openSheet('Signali istrage','<div class="signal-list">'+list+'</div>',true);
  var badge=$('#gsig');if(badge)badge.innerHTML='📡';
}
