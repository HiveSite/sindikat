function currentCase(){return CASES[(S.tour&&S.tour.caseId)||'kotor']||CASES.kotor}
function eligibleTours(v){if(!v)return[];if(v.mode==='exact')return TOURS.filter(t=>t.published&&(v.tourIds||[]).includes(t.id));return TOURS.filter(t=>t.published&&t.value<=v.amount)}
function newSideCount(){const c=currentCase();return c.sidequests.filter(q=>q.unlock<=S.game.idx&&!S.game.sideDone.includes(q.id)).length}
function gameTabs(active){const n=newSideCount();return `<div class="tabbar">${[
 ['story',IC.scroll,'Priča',''],['map',IC.compass,'Kompas',''],['evidence',IC.chest,'Dokazi',''],['side',IC.flag,'Bonusi',n]
 ].map(([v,i,l,b])=>`<div class="tab ${active===v?'on':''}" data-game-tab="${v}">${i}<span>${l}</span>${b?`<i class="badge">${b}</i>`:''}</div>`).join('')}</div>`}
function adminTabs(){return `<div class="admin-rail">${[['dashboard','Pregled'],['tours','Huntovi'],['vouchers','Vaučeri'],['events','Aktivacije'],['live','Live']].map(([v,l])=>`<div class="admin-chip ${S.adminTab===v?'on':''}" data-admin-tab="${v}">${l}</div>`).join('')}</div>`}
function render(){if(MAP){try{MAP.remove()}catch(e){}MAP=null}const views={gate:vGate,voucher:vVoucher,tour:vTourDetail,setup:vSetup,preflight:vPreflight,game:vGame,finale:vFinale,admin:vAdmin};$('#app').innerHTML=(views[S.view]||vGate)();mount()}

function vGate(){return `<div class="view"><div class="mast"><div class="brandmark"><span>⚓</span></div><div class="eyebrow">Istorijske avanture kroz Crnu Goru</div><h1 class="brandtitle pirate">Montenegro<br>Treasure Hunt<small>Follow the clue. Find the story.</small></h1><div class="gate-card"><div class="eyebrow" style="color:var(--gold-2)">Već imate vaučer?</div><h2 style="font-size:23px;margin:5px 0 3px">Unesite kod i krenite.</h2><div class="faint" style="font-size:11px;line-height:1.45;margin-bottom:12px">Kupovina se obavlja na posebnom prodajnom sajtu. Ovdje samo aktivirate dobijeni vaučer.</div><input class="input code" id="voucherInput" placeholder="MNE-XXXX-XX" autocomplete="off"><button class="btn primary" id="useVoucher" style="margin-top:10px">Otvori vaučer</button><button class="btn ghost" id="demoVoucher" style="margin-top:8px">Koristi demo kod</button><div class="steps"><div class="step"><b>1</b><span>Unesi kod</span></div><div class="step"><b>2</b><span>Izaberi turu</span></div><div class="step"><b>3</b><span>Pokreni potragu</span></div></div></div><button class="btn ghost mini" id="adminDemo" style="margin:14px auto 0">Admin demo</button></div></div>`}

function vVoucher(){const v=S.voucher,tours=eligibleTours(v);return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Vaš vaučer</div><h2 class="title">Izaberite avanturu</h2></div></div><div class="scroll"><div class="pad" style="padding-top:6px"><div class="voucher-head"><div class="row"><div class="grow"><div class="eyebrow" style="color:rgba(29,33,30,.55)">Vrijednost vaučera</div><div class="voucher-value">${v.amount} €</div><div class="voucher-code">${esc(v.code)}</div></div><div class="center"><div style="font-family:'Pirata One';font-size:33px">⚓</div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em">do ${v.maxPlayers} igrača</div></div></div><div style="font-size:10px;margin-top:12px;color:rgba(29,33,30,.64)">Važi do ${v.expires} · ${v.mode==='exact'?'određena tura':'birate bilo koju turu u vrijednosti vaučera'}</div></div><div class="row" style="margin:20px 0 10px"><div class="grow"><div class="eyebrow">Dostupno sa ovim kodom</div><h2 style="font-size:23px;margin-top:2px">${tours.length} ${tours.length===1?'tura':'ture'} za izbor</h2></div></div><div class="tour-list">${tours.map(t=>tourCard(t)).join('')}</div><div class="card" style="margin-top:14px"><div class="eyebrow">Važno</div><div class="dim" style="font-size:11px;line-height:1.5;margin-top:7px">Turu možete pregledati prije aktivacije. Kada je aktivirate, vaučer se vezuje za taj hunt i više se ne može koristiti za drugu turu.</div></div></div></div></div>`}
function tourCard(t){return `<div class="tour-card" style="--h:${t.h}" data-tour="${t.id}" data-mark="${t.mark}"><div class="row" style="gap:7px;margin-bottom:7px"><span class="pill gold">${t.city}</span><span class="pill">${t.tag}</span></div><h3>${t.title}</h3><p>${t.copy}</p><div class="row" style="gap:6px"><span class="pill">${t.duration}</span><span class="pill">${t.distance}</span><span class="pill">${t.level}</span></div></div>`}

function vTourDetail(){const t=S.tour;return `<div class="view"><div class="scroll"><div class="detail-art"><button class="iconbtn" data-back style="position:absolute;left:17px;top:15px;z-index:5">${IC.back}</button><div class="symbol">${t.mark}</div><div class="row" style="gap:7px;margin-bottom:9px"><span class="pill gold">${t.city}</span><span class="pill">${t.tag}</span></div><h1>${t.title}</h1><p>${t.copy}</p></div><div class="pad"><div class="metrics"><div class="metric"><div class="v">${t.duration.split(' ')[0]}</div><div class="l">Trajanje</div></div><div class="metric"><div class="v">${t.distance}</div><div class="l">Ruta</div></div><div class="metric"><div class="v">${t.level}</div><div class="l">Težina</div></div></div><div class="card paper" style="margin-top:16px"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Kapetanov zapis</div><h3 style="font-size:24px;margin-top:5px">Šta vas čeka</h3><div style="font-size:12px;line-height:1.5;margin-top:7px">Stvarne lokacije, istorijska misterija, tragovi koji se otključavaju kako prilazite i završna odluka koju može donijeti samo vaš tim.</div><div class="rope"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10.5px"><div>✓ Bez instalacije</div><div>✓ Bez štampanih kodova</div><div>✓ GPS i offline sadržaj</div><div>✓ Sporedni izazovi</div></div></div><div class="card gold" style="margin-top:14px"><div class="row"><div class="grow"><div class="eyebrow" style="color:var(--gold-2)">Vaučer prihvaćen</div><div style="font-weight:800;margin-top:5px">${S.voucher.code}</div><div class="faint" style="font-size:10.5px;margin-top:3px">Vrijednost ${S.voucher.amount} € · do ${S.voucher.maxPlayers} igrača</div></div><span class="pill good">Dostupno</span></div></div></div></div><div class="pad safe" style="padding-top:0"><button class="btn primary" id="activateTour">Aktiviraj ovu turu</button><button class="btn ghost" data-back style="margin-top:8px">Pogledaj druge ture</button></div></div>`}

function vSetup(){return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Priprema posade</div><h2 class="title">Ko kreće u potragu?</h2></div></div><div class="scroll"><div class="pad" style="padding-top:6px"><div class="card gold"><div class="row" style="gap:11px"><div class="avatar">${S.tour.mark}</div><div><div class="eyebrow">Aktivirana tura</div><h3 style="font-size:19px;margin-top:3px">${S.tour.title}</h3><div class="faint" style="font-size:10.5px;margin-top:2px">${S.tour.city} · ${S.tour.duration}</div></div></div></div><div class="field" style="margin-top:16px"><label>Ime vaše posade</label><input class="input" id="teamName" value="${esc(S.team.name)}" placeholder="Npr. Jadranski vukovi"></div><div class="row" style="gap:10px"><div class="field grow"><label>Broj igrača</label><select class="select" id="playerCount">${[2,3,4,5,6].map(n=>`<option ${n===S.team.players?'selected':''}>${n}</option>`).join('')}</select></div><div class="field grow"><label>Ime kapetana</label><input class="input" id="captainName" value="${esc(S.team.captain)}"></div></div><div class="card"><div class="eyebrow">Kako tim igra</div><div class="setup-member"><div class="avatar">K</div><div class="grow"><div style="font-weight:800">Kapetan drži glavni telefon</div><div class="faint" style="font-size:10.5px">Potvrđuje odgovore i koristi hintove.</div></div></div><div class="setup-member"><div class="avatar">N</div><div class="grow"><div style="font-weight:800">Navigator prati kompas</div><div class="faint" style="font-size:10.5px">Dobija sve preciznije tragove dok se približavate.</div></div></div><div class="setup-member"><div class="avatar">A</div><div class="grow"><div style="font-weight:800">Ostali čuvaju dokaze</div><div class="faint" style="font-size:10.5px">Rješavaju priču i sporedne izazove.</div></div></div></div></div></div><div class="pad safe" style="padding-top:0"><button class="btn primary" id="saveTeam">Provjeri telefon i kreni</button></div></div>`}

function vPreflight(){return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Prije polaska</div><h2 class="title">Brod je spreman</h2></div></div><div class="scroll"><div class="pad" style="padding-top:6px"><div class="card paper"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Početna tačka</div><h2 style="font-size:26px;margin-top:4px">${currentCase().city}</h2><div style="font-size:11.5px;line-height:1.45;margin-top:5px">Dođite do Starog grada. Tačna prva lokacija otkriće se kroz kompas kada pokrenete hunt.</div></div><div class="card" style="margin-top:14px"><div class="check-row"><div class="check-icon">✓</div><div class="grow"><div style="font-weight:800">Lokacija</div><div class="faint" style="font-size:10.5px">GPS će se koristiti samo tokom hunta.</div></div><span class="pill good">Spremno</span></div><div class="check-row"><div class="check-icon">✓</div><div class="grow"><div style="font-weight:800">Sadržaj ture</div><div class="faint" style="font-size:10.5px">Priča i ilustracije su pripremljene za slab internet.</div></div><span class="pill good">Preuzeto</span></div><div class="check-row"><div class="check-icon">✓</div><div class="grow"><div style="font-weight:800">Kamera i mikrofon</div><div class="faint" style="font-size:10.5px">Potrebni samo za bonus izazove.</div></div><span class="pill good">Dozvoli po potrebi</span></div><div class="check-row"><div class="check-icon">72%</div><div class="grow"><div style="font-weight:800">Baterija</div><div class="faint" style="font-size:10.5px">Dovoljno za očekivano trajanje ture.</div></div><span class="pill good">Dobro</span></div></div><div class="card gold" style="margin-top:13px"><div class="eyebrow" style="color:var(--gold-2)">Pravilo posade</div><div class="dim" style="font-size:11.5px;line-height:1.5;margin-top:6px">Ne trčite preko ulica, ne ulazite u privatne prostore i ne pokušavajte da se penjete na zidine. Ako je lokacija zatvorena, koristite pomoć u aplikaciji.</div></div></div></div><div class="pad safe" style="padding-top:0"><button class="btn primary" id="startGame">Pokreni hunt</button></div></div>`}

function vGame(){const c=currentCase(),p=c.checkpoints[S.game.idx];let content='';if(S.game.tab==='story')content=storyView(c,p);if(S.game.tab==='map')content=mapView(p);if(S.game.tab==='evidence')content=evidenceView(c);if(S.game.tab==='side')content=sideView(c);return `<div class="view"><div class="game-head"><div class="row"><div class="grow"><div class="eyebrow">${c.city} · ${S.team.name}</div><div style="font-family:'Cormorant Garamond';font-size:20px;font-weight:700;margin-top:1px">${p.chapter}</div></div><div class="center"><div class="mono" id="clock" style="font-size:12px;color:var(--cream-72)">${formatTime(S.game.elapsed)}</div><div style="font-family:'Pirata One';font-size:20px;color:var(--gold-2)">${S.game.score} pts</div></div></div><div class="chapterbar">${c.checkpoints.map((_,i)=>`<i class="chapterdot ${i<S.game.idx?'done':i===S.game.idx?'now':''}"></i>`).join('')}</div></div><div class="scroll">${content}</div>${gameTabs(S.game.tab)}</div>`}
function storyView(c,p){return `<div class="game-pad"><div class="objective"><div class="eyebrow" style="color:var(--gold-2)">Poglavlje ${S.game.idx+1} od ${c.checkpoints.length}</div><h2>${p.chapter}</h2><p>${S.game.arrived?p.arrival:p.far}</p></div>${S.game.arrived?`<div class="status-card found"><div class="status-orb">⚓</div><div class="grow"><div class="eyebrow" style="color:var(--gold-2)">Lokacija pronađena</div><div style="font-weight:800;margin-top:3px">${p.name}</div><div class="faint" style="font-size:10.5px;margin-top:2px">Ilustracija i zadatak su otključani.</div></div></div><div class="location-visual" style="margin-top:11px">${locationArt(p.art)}<div class="location-caption"><div class="eyebrow">Nalazite se kod</div><div style="font-family:'Cormorant Garamond';font-weight:700;font-size:19px;margin-top:2px">${p.name}</div></div></div><button class="btn primary" id="openChallenge" style="margin-top:11px">Otvori izazov</button>`:`<div class="status-card"><div class="status-orb">⌖</div><div class="grow"><div style="font-weight:800">Sljedeći trag još je skriven</div><div class="faint" style="font-size:10.5px;line-height:1.4;margin-top:3px">Otvorite kompas. Informacije će se pojavljivati postepeno kako se približavate.</div></div></div><button class="btn primary" id="openMap" style="margin-top:11px">Otvori kompas</button>`}<div class="card" style="margin-top:13px"><div class="row"><div class="grow"><div class="eyebrow">Posada</div><div style="font-weight:800;margin-top:3px">${S.team.players} igrača · kapetan ${esc(S.team.captain)}</div></div><span class="pill gold">${S.game.hints} hintova</span></div></div>${newSideCount()?`<div class="card gold" id="openSide" style="margin-top:11px;cursor:pointer"><div class="row"><div style="font-size:25px;margin-right:10px">🏴‍☠️</div><div class="grow"><div style="font-weight:800">${newSideCount()} ${newSideCount()===1?'bonus izazov čeka':'bonus izazova čekaju'}</div><div class="faint" style="font-size:10.5px;margin-top:2px">Nijesu obavezni, ali donose dodatne poene i fotografije.</div></div><span class="pill gold">Otvori</span></div></div>`:''}</div>`}
function mapView(p){const d=S.game.distance,stage=approachStage(d),pct=Math.max(8,Math.min(100,100-d/9));return `<div class="map-wrap"><div id="map" class="map"></div><div class="compass-hud"><div class="row"><div class="grow"><div class="eyebrow" style="color:${stage.color}">${stage.label}</div><div class="distance">${d<=60?'Pronađeno':Math.round(d)+' m'}</div></div><div style="font-size:32px">${stage.icon}</div></div><div class="approach-copy">${stage.copy(p)}</div><div class="heat" style="--w:${pct}%"><i></i></div><div class="row" style="gap:8px"><button class="btn ghost" id="realLocate">Provjeri GPS</button><button class="btn primary" id="closer">Demo: približi se</button></div></div></div>`}
function approachStage(d){if(d>500)return{label:'Daleki kurs',color:'var(--sea)',icon:'🧭',copy:p=>p.far};if(d>200)return{label:'Trag na horizontu',color:'var(--sea)',icon:'⛵',copy:p=>p.near};if(d>60)return{label:'Vrlo blizu',color:'var(--gold-2)',icon:'🔭',copy:p=>p.close};return{label:'Lokacija potvrđena',color:'var(--gold-2)',icon:'⚓',copy:p=>p.arrival}}
function evidenceView(c){return `<div class="game-pad"><div class="row" style="margin-bottom:11px"><div class="grow"><div class="eyebrow">Kapetanov sanduk</div><h2 style="font-size:25px;margin-top:2px">Prikupljeni dokazi</h2></div><span class="pill gold">${S.game.evidence.length}/${c.checkpoints.length}</span></div><div class="evidence-grid">${c.checkpoints.map(p=>{const got=S.game.evidence.includes(p.evidence.title);return `<div class="evidence-card ${got?'':'lock'}"><div class="glyph">${got?p.evidence.glyph:'?'}</div><h4>${got?p.evidence.title:'Zaključano'}</h4><p>${got?p.evidence.copy:'Otkriva se završavanjem glavne priče.'}</p></div>`}).join('')}</div><div class="card paper" style="margin-top:13px"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Savjet</div><div style="font-size:11.5px;line-height:1.45;margin-top:5px">Pred finale otvorite svaki dokaz. Odgovor se neće nalaziti na jednoj lokaciji - morate povezati cijelu priču.</div></div></div>`}
function sideView(c){return `<div class="game-pad"><div class="row" style="margin-bottom:11px"><div class="grow"><div class="eyebrow">Dodatni plijen</div><h2 style="font-size:25px;margin-top:2px">Sporedni izazovi</h2></div><span class="pill gold">${S.game.sideDone.length}/${c.sidequests.length}</span></div><div class="faint" style="font-size:11px;line-height:1.45;margin-bottom:13px">Ovo nije dio glavne misterije. Radite ih usput, kada se pojave, i skupljajte dodatne poene.</div>${c.sidequests.map(q=>{const unlocked=q.unlock<=S.game.idx,done=S.game.sideDone.includes(q.id);return `<div class="side-card ${done?'done':unlocked?'new':'lock'}"><div class="row"><div class="grow"><div class="eyebrow">${done?'Završeno':unlocked?'Dostupno sada':'Otključava se kasnije'}</div><h4>${q.title}</h4></div><div class="side-score">+${q.points}</div></div><p>${q.copy}</p>${unlocked&&!done?`<button class="btn ghost" data-side="${q.id}" style="margin-top:10px">${q.type==='photo'?'Dodaj fotografiju':q.type==='audio'?'Snimi dokaz':'Završi izazov'}</button>`:''}${done?`<div class="pill good" style="margin-top:9px">✓ Plijen dodat</div>`:''}</div>`}).join('')}</div>`}

function vFinale(){const c=currentCase(),max=c.checkpoints.reduce((a,p)=>a+p.points,0)+c.sidequests.reduce((a,q)=>a+q.points,0);return `<div class="view"><div class="scroll"><div class="pad safe" style="padding-top:45px"><div class="final-seal">⚓</div><div class="center"><div class="eyebrow" style="color:var(--green);margin-top:19px">Slučaj zatvoren</div><h1 style="font-size:34px;margin-top:5px">Plijen je vaš.</h1><div class="dim" style="font-size:12.5px;line-height:1.5;margin:8px auto 17px;max-width:330px">${finalCopy(c.id)}</div></div><div class="metrics"><div class="metric"><div class="v">${S.game.score}</div><div class="l">Poena</div></div><div class="metric"><div class="v">${S.game.evidence.length}/${c.checkpoints.length}</div><div class="l">Dokazi</div></div><div class="metric"><div class="v">${S.game.sideDone.length}</div><div class="l">Bonusi</div></div></div><div class="card paper" style="margin-top:15px"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Šta je bilo stvarno?</div><h3 style="font-size:22px;margin-top:5px">Istorija i fikcija</h3><div style="font-size:11.5px;line-height:1.5;margin-top:6px">${c.facts}</div><div class="rope"></div><div style="font-size:11px">Rezultat: <b>${Math.round(S.game.score/max*100)}%</b> ukupnog mogućeg plijena.</div></div><button class="btn primary" id="restart" style="margin-top:14px">Vrati se na početak</button></div></div></div>`}
function finalCopy(id){if(id==='ulcinj')return'Knjiga nije skrivala zakopano blago. Čuvala je dogovor da svaki član posade dobije svoj dio.';if(id==='cetinje')return'Jedna promijenjena riječ kupila je vrijeme za pregovore. Originalna depeša konačno je vraćena u dosije.';return'Glasnik je uklonio pečat da nijedna strana ne prisvoji poruku. Tajna nije bila kome pripada - već da je pripadala oboma.'}

function vAdmin(){let content='';if(S.adminTab==='dashboard')content=adminDashboard();if(S.adminTab==='tours')content=adminTours();if(S.adminTab==='vouchers')content=adminVouchers();if(S.adminTab==='events')content=adminEvents();if(S.adminTab==='live')content=adminLive();return `<div class="view"><div class="topbar"><div class="grow"><div class="eyebrow">Montenegro Treasure Hunt</div><h2 class="title">Admin kontrola</h2></div><button class="btn ghost mini" id="backPlayer">Igrač</button></div><div class="scroll"><div class="pad" style="padding-top:5px">${adminTabs()}${content}</div></div></div>`}
function adminDashboard(){return `<div style="margin-top:15px"><div class="metrics"><div class="metric"><div class="v">6</div><div class="l">Aktivne ture</div></div><div class="metric"><div class="v">142</div><div class="l">Važeći vaučeri</div></div><div class="metric"><div class="v">18</div><div class="l">Aktivacije danas</div></div></div><div class="card gold" style="margin-top:13px"><div class="row"><div class="grow"><div class="eyebrow" style="color:var(--gold-2)">Važno pravilo sistema</div><h3 style="font-size:21px;margin-top:4px">Prodaja je van aplikacije</h3><div class="faint" style="font-size:11px;line-height:1.45;margin-top:5px">Admin samo izdaje vaučer nakon eksterne kupovine. Igrač u aplikaciji unosi kod, bira dozvoljenu turu i aktivira je.</div></div><span style="font-size:31px">🎟️</span></div></div><div class="eyebrow" style="margin:18px 0 9px">Danas</div>${[['MNE-DEMO-79','Kotor · aktiviran','Jadranski vukovi','good'],['MNE-FLEX-89','Čeka izbor ture','Poklon vaučer','gold'],['KOTOR-ONLY','Kotor · nije pokrenut','Partner hotel','']].map(x=>`<div class="admin-card"><div class="row"><div class="grow"><div class="mono" style="font-size:11px;color:var(--gold-2)">${x[0]}</div><h4 style="margin-top:3px">${x[1]}</h4><div class="faint" style="font-size:10px;margin-top:2px">${x[2]}</div></div><span class="pill ${x[3]}">${x[3]==='good'?'Aktivno':x[3]==='gold'?'Novi':'Spremno'}</span></div></div>`).join('')}</div>`}

{v.code}</div><div style="font-weight:800;margin-top:3px">${v.amount} € · do ${v.maxPlayers} igrača</div><div class="faint" style="font-size:10px;margin-top:2px">${v.reference} · važi do ${v.expires}</div></div><span class="pill ${v.status==='active'?'good':'red'}">${v.status==='active'?'Aktivan':'Iskorišćen'}</span></div></div>`).join('')}</div>`}
function adminEvents(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Aktivacije vaučera</div><h2 style="font-size:25px;margin-top:2px">Pokrenute ture</h2></div></div>${[['Jadranski vukovi','Kotor - Pečat izgubljenog glasnika','Poglavlje 3/5','620 pts','good'],['Morski psi','Ulcinj - Knjiga posljednjeg korsara','Lobby','0 pts','gold'],['Orlovi','Cetinje - Telegram koji nije stigao','Završeno','890 pts','']].map(x=>`<div class="admin-card"><div class="row"><div class="grow"><h4>${x[0]}</h4><div class="faint" style="font-size:10px;margin-top:2px">${x[1]}</div></div><span class="pill ${x[4]}">${x[2]}</span></div><div class="divider" style="margin:11px 0"></div><div class="row"><div class="statusline"><i></i>${x[3]}</div><div class="grow"></div><button class="btn ghost mini">Otvori</button></div></div>`).join('')}</div>`}
function adminLive(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Live kontrola</div><h2 style="font-size:25px;margin-top:2px">Timovi na terenu</h2></div><span class="pill good">Sistem stabilan</span></div><div class="card gold" style="margin-top:13px"><div style="font-weight:800">Poruka svim aktivnim timovima</div><div class="row" style="gap:8px;margin-top:10px"><input class="input grow" id="broadcast" placeholder="Npr. Trg je privremeno zatvoren"><button class="btn primary mini" id="sendBroadcast">Pošalji</button></div></div>${[['Jadranski vukovi','Kotor','Vrlo blizu tačke 3','620','good'],['Morski psi','Ulcinj','Čeka GPS','310','gold'],['Kapetani','Kotor','Traži ručno otključavanje','455','red']].map(x=>`<div class="admin-card"><div class="row"><div class="grow"><h4>${x[0]}</h4><div class="faint" style="font-size:10px;margin-top:2px">${x[1]} · ${x[2]}</div></div><span class="pill ${x[4]}">${x[3]} pts</span></div><div class="row" style="gap:7px;margin-top:10px"><button class="btn ghost mini">Poruka</button><button class="btn ghost mini">Otključaj tačku</button><button class="btn danger mini">Pauza</button></div></div>`).join('')}</div>`}

function mount(){
 $$('[data-back]').forEach(x=>x.onclick=back);
 const adminDemo=$('#adminDemo');if(adminDemo)adminDemo.onclick=()=>nav('admin',{role:'admin'});
 const backPlayer=$('#backPlayer');if(backPlayer)backPlayer.onclick=()=>{S.history=[];nav('gate',{role:'player'})};
 const demo=$('#demoVoucher');if(demo)demo.onclick=()=>{$('#voucherInput').value='MNE-DEMO-79';validateVoucher()};
 const use=$('#useVoucher');if(use)use.onclick=validateVoucher;
 const input=$('#voucherInput');if(input){input.oninput=()=>input.value=input.value.toUpperCase();input.onkeydown=e=>{if(e.key==='Enter')validateVoucher()}}
 $$('[data-tour]').forEach(x=>x.onclick=()=>{const t=TOURS.find(t=>t.id===x.dataset.tour);if(t)nav('tour',{tour:t})});
 const activate=$('#activateTour');if(activate)activate.onclick=()=>{S.voucher.status='reserved';nav('setup')};
 const save=$('#saveTeam');if(save)save.onclick=()=>{S.team.name=$('#teamName').value.trim()||'Posada bez imena';S.team.captain=$('#captainName').value.trim()||'Kapetan';S.team.players=+$(`#playerCount`).value;nav('preflight')};
 const start=$('#startGame');if(start)start.onclick=startGame;
 $$('[data-game-tab]').forEach(x=>x.onclick=()=>{S.game.tab=x.dataset.gameTab;render()});
 const openMap=$('#openMap');if(openMap)openMap.onclick=()=>{S.game.tab='map';render()};
 const openSide=$('#openSide');if(openSide)openSide.onclick=()=>{S.game.tab='side';render()};
 const closer=$('#closer');if(closer)closer.onclick=simulateCloser;
 const real=$('#realLocate');if(real)real.onclick=realLocate;
 const challenge=$('#openChallenge');if(challenge)challenge.onclick=openChallenge;
 $$('[data-side]').forEach(x=>x.onclick=()=>completeSide(x.dataset.side));
 if(S.view==='game'&&S.game.tab==='map')setTimeout(initMap,80);
 const restart=$('#restart');if(restart)restart.onclick=resetAll;
 $$('[data-admin-tab]').forEach(x=>x.onclick=()=>{S.adminTab=x.dataset.adminTab;render()});
 const mode=$('#genMode');if(mode)mode.onchange=()=>{$('#exactTourWrap').style.display=mode.value==='exact'?'block':'none'};
 const gen=$('#generateVoucher');if(gen)gen.onclick=generateVoucher;
 const copyGen=$('#copyGenerated');if(copyGen)copyGen.onclick=()=>{try{navigator.clipboard.writeText(S.generatedCode)}catch(e){}toast('Kod je kopiran')};
 const send=$('#sendBroadcast');if(send)send.onclick=()=>toast($('#broadcast').value.trim()?'Poruka je poslata':'Unesite poruku');
}
function validateVoucher(){const raw=($('#voucherInput')?.value||'').trim().toUpperCase();const v=VOUCHERS[raw];if(!v){toast('Kod nije pronađen. Provjerite slova i brojeve.');return}if(v.status==='used'){toast('Ovaj vaučer je već iskorišćen.');return}S.voucher={...v};S.history=[];nav('voucher')}
function startGame(){S.voucher.status='used';VOUCHERS[S.voucher.code].status='used';S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'story',distance:850,arrived:false,sideDone:[],locationShown:false};nav('game');clearInterval(TIMER);TIMER=setInterval(()=>{S.game.elapsed++;const c=$('#clock');if(c)c.textContent=formatTime(S.game.elapsed)},1000)}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function simulateCloser(){const steps=[850,420,175,48];const i=steps.findIndex(v=>v===S.game.distance);S.game.distance=steps[Math.min(i+1,steps.length-1)];if(S.game.distance<=60){S.game.arrived=true;S.game.tab='story';vibrate([35,55,120]);render();setTimeout(showLocationReveal,120)}else{vibrate(20);render()}}
function realLocate(){if(!navigator.geolocation){toast('GPS nije dostupan na ovom uređaju');return}toast('Provjeravam lokaciju…');navigator.geolocation.getCurrentPosition(pos=>{const p=currentCase().checkpoints[S.game.idx],d=distance(pos.coords.latitude,pos.coords.longitude,p.lat,p.lng);S.game.distance=Math.round(d);if(d<=Math.max(p.radius,60)){S.game.arrived=true;S.game.tab='story';render();setTimeout(showLocationReveal,120)}else render()},()=>toast('Lokacija nije dovoljno precizna. Pokušajte ponovo.'),{enableHighAccuracy:true,timeout:8000})}
function distance(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function initMap(){const p=currentCase().checkpoints[S.game.idx],d=S.game.distance;try{MAP=L.map('map',{zoomControl:false,attributionControl:true}).setView([p.lat-.003,p.lng-.0024],d>500?15:d>200?16:17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(MAP);const playerLat=p.lat-(Math.max(d,70)/111000),playerLng=p.lng-.0015;L.circleMarker([playerLat,playerLng],{radius:8,color:'#5fb8b5',weight:3,fillColor:'#5fb8b5',fillOpacity:1}).addTo(MAP);if(d<=500)L.circle([p.lat,p.lng],{radius:d>200?180:85,color:'#c99a45',weight:1,fillColor:'#c99a45',fillOpacity:.07,dashArray:'5 7'}).addTo(MAP);if(d<=200)L.marker([p.lat,p.lng]).addTo(MAP);setTimeout(()=>MAP.invalidateSize(),130)}catch(e){}}
function showLocationReveal(){if(!S.game.arrived)return;const p=currentCase().checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet"><div class="location-visual">${locationArt(p.art)}<div class="location-caption"><div class="eyebrow">Lokacija otkrivena</div><div style="font-family:'Cormorant Garamond';font-size:22px;font-weight:700;margin-top:2px">${p.name}</div></div></div><div class="eyebrow" style="color:var(--gold-2);margin-top:14px">${p.chapter}</div><div class="dim" style="font-size:12px;line-height:1.5;margin-top:5px">${p.arrival}</div><div class="card" style="margin-top:12px"><div class="eyebrow">Sada obratite pažnju</div><div style="font-weight:800;font-size:13px;margin-top:5px">${p.objective}</div></div><button class="btn primary" id="revealChallenge" style="margin-top:12px">Otvori izazov</button><button class="btn ghost" id="studyPlace" style="margin-top:8px">Još malo pogledaj lokaciju</button></div>`;$('#phone').appendChild(ov);$('#revealChallenge',ov).onclick=()=>{ov.remove();openChallenge()};$('#studyPlace',ov).onclick=()=>ov.remove()}
function openChallenge(){const p=currentCase().checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay';const body=p.type==='text'?`<input class="input code" id="answerText" placeholder="ODGOVOR" style="margin-top:13px">`:`<div style="margin-top:13px">${p.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`;ov.innerHTML=`<div class="sheet"><div class="grab"></div><div class="row"><div class="grow"><div class="eyebrow">Glavni izazov · ${p.points} poena</div><h3 style="font-size:24px;margin-top:4px">${p.name}</h3></div><span class="pill gold">${S.game.idx+1}/${currentCase().checkpoints.length}</span></div><div style="font-family:'Cormorant Garamond';font-size:18px;line-height:1.45;margin-top:13px">${p.question}</div>${body}<div id="challengeFeedback" style="margin-top:10px"></div><div class="row" style="gap:8px;margin-top:12px"><button class="btn ghost" id="useHint">Hint -25</button><button class="btn primary" id="submitAnswer">Potvrdi</button></div><button class="btn ghost" id="closeChallenge" style="margin-top:8px">Vrati se na lokaciju</button></div>`;$('#phone').appendChild(ov);let picked=null;$$('[data-choice]',ov).forEach(x=>x.onclick=()=>{$$('[data-choice]',ov).forEach(y=>y.classList.remove('pick'));x.classList.add('pick');picked=+x.dataset.choice});$('#closeChallenge',ov).onclick=()=>ov.remove();$('#useHint',ov).onclick=()=>{S.game.hints++;S.game.score=Math.max(0,S.game.score-25);toast(p.hint)};$('#submitAnswer',ov).onclick=()=>{let ok=p.type==='text'?($('#answerText',ov).value.trim().toUpperCase()===String(p.answer).toUpperCase()):picked===p.answer;const f=$('#challengeFeedback',ov);if(!ok){f.className='feedback bad';f.textContent='Nije to. Pogledajte mjesto još jednom i povežite trag.';vibrate(30);return}f.className='feedback good';f.textContent=`Dokaz pronađen. +${p.points} poena`;S.game.score+=p.points;S.game.evidence.push(p.evidence.title);vibrate([40,50,100]);setTimeout(()=>{ov.remove();showEvidenceFound(p)},650)}}
function showEvidenceFound(p){const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet center"><div style="font-size:48px">${p.evidence.glyph}</div><div class="eyebrow" style="color:var(--green);margin-top:8px">Novi dokaz</div><h3 style="font-size:27px;margin-top:4px">${p.evidence.title}</h3><div class="dim" style="font-size:12px;line-height:1.5;margin-top:7px">${p.evidence.copy}</div><div class="card paper" style="margin-top:13px;text-align:left"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Stvarna istorija</div><div style="font-size:11.5px;line-height:1.45;margin-top:5px">${p.fact}</div></div><button class="btn primary" id="continueStory" style="margin-top:13px">${S.game.idx===currentCase().checkpoints.length-1?'Zatvori slučaj':'Nastavi potragu'}</button></div>`;$('#phone').appendChild(ov);$('#continueStory',ov).onclick=()=>{ov.remove();if(S.game.idx===currentCase().checkpoints.length-1){clearInterval(TIMER);confetti();nav('finale')}else{S.game.idx++;S.game.distance=850;S.game.arrived=false;S.game.tab='story';render();toast('Novi trag i bonus izazovi su otključani')}}}
function completeSide(id){const q=currentCase().sidequests.find(x=>x.id===id);if(!q||S.game.sideDone.includes(id))return;S.game.sideDone.push(id);S.game.score+=q.points;vibrate([20,40,70]);toast(`Bonus završen. +${q.points} poena`);render()}
function resetAll(){clearInterval(TIMER);S.view='gate';S.history=[];S.voucher=null;S.tour=null;S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'story',distance:850,arrived:false,sideDone:[],locationShown:false};render()}
function generateVoucher(){const amount=+$('#genAmount').value,mode=$('#genMode').value,maxPlayers=+$('#genPlayers').value,expires=$('#genExpiry').value.trim()||'31.12.2026',reference=$('#genRef').value.trim()||'Eksterna prodaja';const chunk=Math.random().toString(36).slice(2,6).toUpperCase();const code=`MNE-${amount}-${chunk}`;const v={code,amount,mode,maxPlayers,expires,status:'active',reference};if(mode==='exact')v.tourIds=[$('#genTour').value];VOUCHERS[code]=v;S.generatedCode=code;render();toast('Vaučer je generisan')}

function locationArt(type){const sky=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#254e59"/><stop offset="1" stop-color="#c58d4a"/></linearGradient><linearGradient id="seaG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c3540"/><stop offset="1" stop-color="#2d6b70"/></linearGradient></defs><rect width="640" height="400" fill="url(#sky)"/><circle cx="500" cy="88" r="38" fill="#efd18b" opacity=".72"/><path d="M0 250 Q140 215 270 250 T640 245 V400 H0Z" fill="url(#seaG)"/><path d="M0 278 Q150 254 300 280 T640 270" stroke="#b9d0c8" stroke-opacity=".28" fill="none" stroke-width="4"/>`;

 else if(type==='clock')scene=`${sky}${ground}<g fill="#96866a" stroke="#d3c5a5" stroke-width="3"><rect x="250" y="100" width="140" height="215"/><path d="M237 100h166l-28-32h-110z"/><circle cx="320" cy="157" r="37" fill="#17252a"/><path d="M320 132v28l19 11" stroke="#efd18b" stroke-width="6" fill="none"/><rect x="285" y="230" width="70" height="85" fill="#263135"/></g><path d="M90 315h460" stroke="#c5af7d" stroke-width="8"/>${common}`;
 else if(type==='cathedral')scene=`${sky}${ground}<g fill="#a99a79" stroke="#ded0ad" stroke-width="3"><rect x="205" y="155" width="230" height="160"/><rect x="165" y="92" width="82" height="223"/><rect x="393" y="92" width="82" height="223"/><path d="M165 92l41-54 41 54M393 92l41-54 41 54"/><circle cx="320" cy="205" r="34" fill="#283237"/><path d="M292 315v-70c0-39 56-39 56 0v70" fill="#283237"/></g>${common}`;
 else if(type==='chapel')scene=`${sky}${ground}<g fill="#a39372" stroke="#dacba8" stroke-width="3"><rect x="215" y="152" width="220" height="163"/><path d="M195 152l130-88 130 88z"/><rect x="300" y="225" width="52" height="90" fill="#263035"/><circle cx="325" cy="178" r="23" fill="#263035"/></g><path d="M125 315h390" stroke="#bda879" stroke-width="6"/>${common}`;
 else if(type==='fortress'||type==='tower')scene=`${sky}<path d="M0 320L100 180l115 35 80-95 110 100 90-55 145 155v80H0z" fill="#302e28"/><g fill="#8f8065" stroke="#cdbc99" stroke-width="3"><path d="M120 288V150h400v138z"/><rect x="150" y="112" width="80" height="176"/><rect x="410" y="95" width="86" height="193"/><path d="M150 112h80M410 95h86"/><rect x="294" y="210" width="62" height="78" fill="#1a282c"/></g>${common}`;

 else if(type==='mountain')scene=`${sky}<path d="M0 310L120 155l75 65 88-140 92 130 70-76 195 176v90H0z" fill="#27302d"/><path d="M0 340Q180 290 360 330T640 315V400H0Z" fill="#173039"/><g fill="#b0a17f" opacity=".75"><rect x="255" y="235" width="130" height="55"/><path d="M240 235h160l-35-28h-90z"/></g>${common}`;
 else scene=`${sky}${ground}${common}`;
 return `<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustracija lokacije">${scene}<rect x="8" y="8" width="624" height="384" rx="22" fill="none" stroke="#efd18b" stroke-opacity=".22" stroke-width="2"/></svg>`
