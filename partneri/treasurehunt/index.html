<style>

*{box-sizing:border-box}

background:

radial-gradient(800px 580px at -12% 110%,rgba(24,55,67,.72),transparent 60%),
#020709}

repeating-linear-gradient(104deg,transparent 0 38px,rgba(255,255,255,.01) 39px 40px)}

button{color:inherit}

.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:20px}.safe{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center}.stack{display:flex;flex-direction:column}.grow{flex:1}.center{text-align:center}.hidden{display:none!important}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;margin:0;font-weight:700;letter-spacing:-.015em}.pirate{font-family:'Pirata One',serif;letter-spacing:.02em}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;font-weight:800;color:var(--cream-48)}
.dim{color:var(--cream-72)}.faint{color:var(--cream-48)}
.card{background:rgba(244,234,212,.045);border:1px solid var(--line);border-radius:17px;padding:16px;backdrop-filter:blur(8px)}
.card.gold{background:linear-gradient(145deg,rgba(201,154,69,.14),rgba(201,154,69,.035));border-color:rgba(201,154,69,.33)}
.card.paper{position:relative;background:linear-gradient(155deg,#efe2c7,#cdb88d);color:var(--ink);border:none;box-shadow:0 18px 34px -20px rgba(0,0,0,.75)}
.card.paper:before,.card.paper:after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 8px -2px,transparent 6px,#eadbbd 6.5px) repeat-x;background-size:16px 8px;opacity:.72}
.card.paper:before{top:-6px}.card.paper:after{bottom:-6px;transform:rotate(180deg)}
.divider{height:1px;background:var(--line);margin:15px 0}
.rope{height:7px;margin:14px 0;background:repeating-linear-gradient(120deg,#9a6c2b 0 4px,#d2ad61 4px 8px,#7a5221 8px 12px);border-radius:99px;box-shadow:inset 0 1px rgba(255,255,255,.2),0 3px 8px rgba(0,0,0,.34)}

.btn.paperbtn{background:#2b3029;color:#f5e7c7;border:1px solid rgba(29,33,30,.35)}
.btn.danger{background:rgba(224,119,105,.1);border:1px solid rgba(224,119,105,.3);color:#ffaaa0}
.btn.mini{width:auto;padding:9px 12px;font-size:12px;border-radius:11px}.btn.icon{width:42px;height:42px;padding:0;flex:none}

.input,.select,.ta{width:100%;background:rgba(244,234,212,.055);border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:var(--cream);outline:none;font-weight:650}.input:focus,.select:focus,.ta:focus{border-color:rgba(201,154,69,.56)}
.input.code{font-size:18px;letter-spacing:.12em;text-transform:uppercase;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.select option{background:#0b2026}.ta{min-height:90px;resize:vertical;line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:800;color:var(--cream-48)}
.topbar{display:flex;align-items:center;gap:11px;padding:16px 18px 9px;z-index:30}.topbar .title{font-size:23px}.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(244,234,212,.055);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.iconbtn svg{width:20px;height:20px}

.mast{position:relative;min-height:100%;padding:68px 22px 22px;overflow:hidden;display:flex;flex-direction:column}
.mast:before{content:"";position:absolute;inset:0;background:

linear-gradient(180deg,rgba(11,47,56,.25),rgba(4,16,21,.92) 72%),

.mast:after{content:"";position:absolute;right:-75px;top:-72px;width:290px;height:290px;border:1px solid rgba(239,209,139,.12);border-radius:50%;box-shadow:0 0 0 36px rgba(239,209,139,.025),0 0 0 72px rgba(239,209,139,.018)}
.mast>*{position:relative;z-index:2}
.brandmark{width:82px;height:82px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(201,154,69,.06),0 18px 42px -18px rgba(201,154,69,.72);margin-bottom:18px;position:relative}
.brandmark:before,.brandmark:after{content:"";position:absolute;background:var(--gold)}.brandmark:before{width:2px;height:104px}.brandmark:after{height:2px;width:104px}.brandmark span{font-size:38px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));z-index:2}
.brandtitle{font-size:43px;line-height:.88;text-transform:uppercase;color:var(--cream)}
.brandtitle small{display:block;font-family:'Manrope';font-size:10px;letter-spacing:.28em;color:var(--gold-2);margin-top:12px}
.gate-card{margin-top:auto;background:rgba(2,12,16,.78);border:1px solid rgba(201,154,69,.28);border-radius:20px;padding:17px;backdrop-filter:blur(12px)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.step{padding:10px 7px;border-radius:12px;background:rgba(244,234,212,.04);border:1px solid var(--line);text-align:center}.step b{display:block;font-family:'Cormorant Garamond';font-size:20px;color:var(--gold-2)}.step span{display:block;font-size:9px;color:var(--cream-48);margin-top:2px;line-height:1.25}
.voucher-head{position:relative;overflow:hidden;padding:20px;border-radius:22px;background:linear-gradient(145deg,#ede0c5,#c9b384);color:var(--ink);box-shadow:0 20px 40px -24px rgba(0,0,0,.9)}
.voucher-head:before{content:"";position:absolute;right:-45px;top:-50px;width:170px;height:170px;border:2px solid rgba(29,33,30,.13);border-radius:50%;box-shadow:0 0 0 19px rgba(29,33,30,.035),0 0 0 38px rgba(29,33,30,.025)}
.voucher-head>*{position:relative}.voucher-value{font-family:'Pirata One';font-size:38px}.voucher-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.1em;margin-top:3px;color:rgba(29,33,30,.65)}
.tour-list{display:flex;flex-direction:column;gap:12px}.tour-card{position:relative;min-height:164px;border-radius:20px;overflow:hidden;border:1px solid var(--line);padding:17px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;background:linear-gradient(150deg,#153c44,#061419 74%)}
.tour-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 8%,hsla(var(--h),55%,55%,.34),transparent 52%),linear-gradient(180deg,transparent 18%,rgba(2,10,13,.94))}.tour-card:after{content:attr(data-mark);position:absolute;right:13px;top:-14px;font-family:'Pirata One';font-size:112px;color:rgba(244,234,212,.05)}.tour-card>*{position:relative}.tour-card h3{font-size:24px;max-width:310px}.tour-card p{font-size:11.5px;line-height:1.45;color:var(--cream-72);margin:5px 0 10px;max-width:330px}.tour-card.disabled{filter:grayscale(.7);opacity:.52;cursor:not-allowed}
.detail-art{position:relative;min-height:275px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(9,33,40,.25),#061319 94%)}.detail-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 73% 12%,rgba(201,154,69,.22),transparent 50%),repeating-radial-gradient(circle at 78% 8%,transparent 0 35px,rgba(239,209,139,.04) 36px 37px)}.detail-art>*{position:relative}.detail-art .symbol{font-family:'Pirata One';font-size:100px;color:rgba(239,209,139,.16);position:absolute;right:18px;top:16px}.detail-art h1{font-size:35px;line-height:.98;max-width:335px}.detail-art p{font-size:12.5px;line-height:1.5;color:var(--cream-72);max-width:340px;margin:8px 0 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px 7px;border-radius:14px;background:rgba(244,234,212,.04);border:1px solid var(--line);text-align:center}.metric .v{font-family:'Cormorant Garamond';font-size:20px;font-weight:700}.metric .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cream-48);margin-top:2px}
.setup-member{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2)}.setup-member:last-child{border:none}.avatar{width:38px;height:38px;border-radius:12px;background:rgba(201,154,69,.15);border:1px solid rgba(201,154,69,.27);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond';font-size:18px;font-weight:700;color:var(--gold-2)}
.check-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line-2)}.check-row:last-child{border:none}.check-icon{width:34px;height:34px;border-radius:11px;background:rgba(115,200,146,.11);border:1px solid rgba(115,200,146,.25);display:flex;align-items:center;justify-content:center;color:var(--green)}
.game-head{padding:12px 16px 9px;border-bottom:1px solid var(--line);background:rgba(4,15,19,.93);backdrop-filter:blur(12px);z-index:30}.chapterbar{display:flex;gap:5px;margin-top:9px}.chapterdot{height:4px;flex:1;border-radius:3px;background:rgba(244,234,212,.1)}.chapterdot.done{background:var(--gold)}.chapterdot.now{background:rgba(201,154,69,.4)}
.game-pad{padding:15px 17px}.objective{position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(201,154,69,.12),rgba(244,234,212,.035));border:1px solid rgba(201,154,69,.27);border-radius:20px;padding:17px}.objective:before{content:"";position:absolute;right:-55px;top:-60px;width:150px;height:150px;border:1px solid rgba(201,154,69,.14);border-radius:50%}.objective>*{position:relative}.objective h2{font-size:26px;margin-top:4px}.objective p{font-size:12px;line-height:1.5;color:var(--cream-72);margin:7px 0 0}
.status-card{display:flex;align-items:center;gap:12px;margin-top:11px;padding:13px;border-radius:15px;border:1px solid var(--line);background:rgba(244,234,212,.038)}.status-orb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,var(--sea),rgba(95,184,181,.08) 72%);box-shadow:0 0 0 5px rgba(95,184,181,.08);font-size:22px}.status-card.found .status-orb{background:radial-gradient(circle at 35% 30%,var(--gold-2),rgba(201,154,69,.12) 72%);box-shadow:0 0 0 5px rgba(201,154,69,.08)}
.map-wrap{position:relative;height:100%;min-height:520px}.map{position:absolute;inset:0}.leaflet-container{background:#0d242b;font-family:'Manrope'}.leaflet-tile{filter:saturate(.55) brightness(.72) contrast(1.06) sepia(.14)}.leaflet-control-attribution{background:rgba(4,15,19,.7)!important;color:rgba(244,234,212,.45)!important;font-size:8px!important}.leaflet-control-attribution a{color:rgba(244,234,212,.65)!important}
.compass-hud{position:absolute;left:13px;right:13px;bottom:15px;z-index:500;background:rgba(4,16,21,.92);border:1px solid var(--line);border-radius:19px;padding:14px;backdrop-filter:blur(13px);box-shadow:0 20px 45px -25px rgba(0,0,0,.85)}.distance{font-family:'Pirata One';font-size:34px;color:var(--gold-2);line-height:1}.approach-copy{font-size:11px;line-height:1.45;color:var(--cream-72);margin-top:3px}.heat{height:5px;background:rgba(244,234,212,.08);border-radius:4px;margin:10px 0 12px;overflow:hidden}.heat i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--sea),var(--gold),var(--rust));border-radius:4px;transition:.3s}
.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.evidence-card{min-height:130px;border-radius:16px;padding:13px;background:rgba(244,234,212,.04);border:1px solid var(--line);display:flex;flex-direction:column}.evidence-card.lock{opacity:.34;filter:grayscale(1)}.evidence-card .glyph{font-size:28px}.evidence-card h4{font-size:17px;margin-top:auto}.evidence-card p{font-size:9.5px;line-height:1.35;color:var(--cream-48);margin:4px 0 0}
.side-card{position:relative;border-radius:17px;border:1px solid var(--line);padding:14px;background:rgba(244,234,212,.04);margin-bottom:10px}.side-card.new{border-color:rgba(201,154,69,.36);background:rgba(201,154,69,.07)}.side-card.lock{opacity:.46}.side-card.done{border-color:rgba(115,200,146,.25);background:rgba(115,200,146,.055)}.side-card h4{font-size:18px}.side-card p{font-size:10.5px;line-height:1.4;color:var(--cream-72);margin:5px 0 0}.side-score{font-family:'Pirata One';font-size:22px;color:var(--gold-2)}
.overlay{position:absolute;inset:0;background:rgba(1,7,9,.84);backdrop-filter:blur(7px);z-index:900;display:flex;align-items:flex-end;animation:fade .22s ease}.overlay.center{align-items:center;padding:17px}@keyframes fade{from{opacity:0}to{opacity:1}}.sheet{width:100%;max-height:92%;overflow:auto;background:linear-gradient(165deg,#0c2830,#061419);border:1px solid var(--line);border-radius:25px 25px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px -28px rgba(0,0,0,.9);animation:up .28s ease}.overlay.center .sheet{border-radius:23px;max-height:88%}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.location-visual{position:relative;border-radius:19px;overflow:hidden;border:1px solid rgba(201,154,69,.25);background:#0b2730;aspect-ratio:16/10}.location-visual svg{width:100%;height:100%;display:block}.location-caption{position:absolute;left:13px;right:13px;bottom:12px;padding:10px 12px;border-radius:12px;background:rgba(3,12,16,.77);backdrop-filter:blur(7px);border:1px solid rgba(244,234,212,.1)}
.choice{width:100%;text-align:left;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(244,234,212,.045);color:var(--cream);font-weight:700;margin-bottom:8px;cursor:pointer}.choice.pick{background:rgba(201,154,69,.13);border-color:rgba(201,154,69,.45);color:var(--gold-2)}

.admin-card{border-radius:16px;padding:14px;background:rgba(244,234,212,.04);border:1px solid var(--line);margin-top:10px}.admin-card h4{font-size:18px}.statusline{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--cream-48)}.statusline i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

/* ==================== UX REFINEMENT V3 ==================== */
:root{--tap:48px}
.btn{min-height:var(--tap);font-size:14px}.btn.mini{min-height:38px}
.topbar{padding:14px 16px 8px}.pad{padding:17px}.field{margin-bottom:12px}
.ux-kicker{font-size:11px;color:var(--gold-2);font-weight:800;letter-spacing:.04em}

function vVoucher(){const v=S.voucher,tours=eligibleTours(v);return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 1 od 3</div><h2 class="title">Izaberi grad</h2><div class="city-count">Jedan vaučer otključava jednu avanturu.</div></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="voucher-compact"><div><div class="amount">${v.amount} €</div><div class="code">${esc(v.code)}</div></div><div class="grow"><div style="font-weight:800;font-size:12px">Vaučer je važeći</div><div style="font-size:9.5px;margin-top:2px;color:rgba(29,33,30,.62)">Do ${v.maxPlayers} igrača · važi do ${v.expires}</div></div><div style="font-size:24px">🎟️</div></div><div class="ux-stepper"><i class="on"></i><i></i><i></i></div><div class="city-grid">${tours.map(t=>tourCard(t)).join('')}</div><div class="ux-note center" style="margin:13px 10px 3px">Možeš otvoriti detalje svih tura prije nego što izabereš jednu.</div></div></div></div>`}
function tourCard(t){return `<div class="city-tile" data-tour="${t.id}"><div class="city-thumb">${locationArt(t.cover)}</div><div class="city-body"><div class="row" style="gap:6px;margin-bottom:5px"><span class="pill gold">${t.city}</span></div><h3>${t.title}</h3><p>${t.copy}</p><div class="city-meta"><span>${t.duration}</span><span>·</span><span>${t.level}</span></div></div></div>`}

function vTourDetail(){const t=S.tour,c=currentCase(),r=c.route;return `<div class="view"><div class="scroll"><div class="hero-art">${locationArt(t.cover)}<button class="iconbtn" data-back style="position:absolute;left:15px;top:14px;z-index:5">${IC.back}</button><div class="hero-copy"><div class="row" style="gap:7px"><span class="pill gold">${t.city}</span><span class="pill">${t.tag}</span></div><h1>${t.title}</h1><p>${t.copy}</p></div></div><div class="pad"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i></i></div><div class="quick-facts"><div class="quick-fact"><b>${t.duration.split(' ')[0]}</b><span>Minuta</span></div><div class="quick-fact"><b>${t.distance}</b><span>Pješke</span></div><div class="quick-fact"><b>${c.checkpoints.length}</b><span>Stanica</span></div></div><div class="card route-card"><div class="route-head"><div class="eyebrow">Stvarna pješačka ruta</div><h3>${r.startLabel} → ${r.finishLabel}</h3><div class="route-status">${r.status}</div></div><div class="route-stops">${c.checkpoints.map((p,i)=>`<div class="route-stop"><div class="n">${i+1}</div><div><b>${p.name}</b><span>${p.access||'Javni spoljašnji prostor'}</span></div></div>`).join('')}</div><div class="route-practical"><div class="box"><b>${r.terrain}</b><span>Teren</span></div><div class="box"><b>${r.estimatedTime}</b><span>Realno trajanje sa zadacima</span></div></div><div class="route-warning"><b>Pristup:</b> ${r.access}<br><b>Bezbjednost:</b> ${r.safety}</div><div class="route-actions"><button class="btn ghost" id="showRouteDetails">Pregled rute</button><button class="btn primary" id="openFullRoute">Otvori navigaciju</button></div></div><div class="card" style="margin-top:11px"><div class="eyebrow">Kako igra teče</div><div class="simple-list" style="margin-top:5px"><div class="simple-row"><div class="simple-no">1</div><div><b>Stigneš do stvarne lokacije</b><div class="ux-note">GPS potvrđuje zonu, a zadatak provjerava detalj koji se vidi na licu mjesta.</div></div></div><div class="simple-row"><div class="simple-no">2</div><div><b>Dobiješ dokaz i zanimljivost</b><div class="ux-note">Fikcija je odvojena od istorijske činjenice ili lokalnog predanja.</div></div></div><div class="simple-row"><div class="simple-no">3</div><div><b>Nastaviš tačnim redosljedom</b><div class="ux-note">Ruta je složena da smanji vraćanje i nepotrebno hodanje.</div></div></div></div></div></div></div><div class="sticky-action"><button class="btn primary" id="activateTour">Izaberi ovu turu</button></div></div>`}

function vSetup(){return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 2 od 3</div><h2 class="title">Pripremi posadu</h2></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i></i></div><div class="card gold"><div class="row" style="gap:10px"><div class="avatar">${S.tour.mark}</div><div class="grow"><div class="eyebrow">Izabrana avantura</div><h3 style="font-size:19px;margin-top:2px">${S.tour.city}</h3><div class="faint" style="font-size:10px">${S.tour.title}</div></div><span class="pill good">Spremno</span></div></div><div class="field" style="margin-top:14px"><label>Ime posade</label><input class="input" id="teamName" value="${esc(S.team.name)}" placeholder="Npr. Jadranski vukovi"></div><div class="field"><label>Ime kapetana</label><input class="input" id="captainName" value="${esc(S.team.captain)}" placeholder="Ime osobe koja drži telefon"></div><div class="field"><label>Broj igrača</label><div class="player-select">${[2,3,4,5,6].map(n=>`<button type="button" data-players="${n}" class="${n===S.team.players?'on':''}">${n}</button>`).join('')}</div></div><div class="card"><div class="row" style="gap:10px"><div style="font-size:25px">📱</div><div><b>Jedan glavni telefon</b><div class="ux-note" style="margin-top:2px">Kapetan upravlja aplikacijom, a cijela posada rješava zadatke.</div></div></div></div></div></div><div class="sticky-action"><button class="btn primary" id="saveTeam">Nastavi na provjeru</button></div></div>`}

function vPreflight(){const c=currentCase(),r=c.route;return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 3 od 3</div><h2 class="title">Spremni za polazak</h2></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="card paper"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Dođite na start</div><h2 style="font-size:25px;margin-top:4px">${r.startLabel}</h2><div style="font-size:10.5px;line-height:1.45;margin-top:6px">${r.walkDistance} · ${r.estimatedTime}</div><button class="btn paperbtn" id="openRoutePreflight" style="margin-top:11px">Otvori pješačku navigaciju</button></div><div class="route-summary"><div class="chip"><b>${c.checkpoints.length} stvarnih stanica</b><span>Sve su već vidljive u pregledu rute</span></div><div class="chip"><b>${r.terrain}</b><span>Teren</span></div><div class="chip"><b>Bez fizičkih kodova</b><span>GPS + opažanje lokacije</span></div></div><div class="preflight-list" style="margin-top:12px"><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Provjeri bateriju i GPS</b><div class="ux-note">Preporučeno je najmanje 30% baterije.</div></div></div><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Pročitaj pristup ruti</b><div class="ux-note">${r.access}</div></div></div><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Bezbjednost terena</b><div class="ux-note">${r.safety}</div></div></div></div><div class="route-note" style="margin-top:12px">Koordinate i sadržaj su desk provjereni. Prije komercijalnog lansiranja ruta mora biti fizički testirana zbog GPS odstupanja, radnog vremena, građevinskih radova i sezonskih gužvi.</div></div></div><div class="sticky-action"><button class="btn primary" id="startGame">Pokreni avanturu</button></div></div>`}

function vGame(){const c=currentCase(),p=c.checkpoints[S.game.idx];let content='';if(S.game.tab==='story')content=storyView(c,p);if(S.game.tab==='map')content=mapView(p);if(S.game.tab==='evidence')content=evidenceView(c);if(S.game.tab==='side')content=sideView(c);return `<div class="view"><div class="game-head"><div class="row"><div class="grow"><div class="eyebrow">${c.city} · Poglavlje ${S.game.idx+1}/${c.checkpoints.length}</div><div class="game-title">${p.chapter}</div></div><button class="signal-button" id="signalCenter" aria-label="Kapetanov dnevnik">${IC.bell}${S.game.unread?`<i class="count">${S.game.unread}</i>`:''}</button><div class="game-stats"><div class="game-stat" id="clock">${formatTime(S.game.elapsed)}</div><div class="game-stat"><b>${S.game.score}</b> pts</div></div></div><div class="chapterbar">${c.checkpoints.map((_,i)=>`<i class="chapterdot ${i<S.game.idx?'done':i===S.game.idx?'now':''}"></i>`).join('')}</div></div><div class="scroll">${content}</div>${gameTabs(S.game.tab)}</div>`}
function storyView(c,p){const bonus=newSideCount(),latest=S.game.notifications[0];return `<div class="game-pad"><div class="focus-card"><div class="eyebrow" style="color:var(--gold-2)">${S.game.arrived?'Lokacija pronađena':'Trenutna misija'}</div><h2>${S.game.arrived?p.name:p.chapter}</h2><p>${S.game.arrived?p.arrival:p.far}</p>${S.game.arrived?`<div class="location-visual" style="margin-top:13px">${locationArt(p.art)}<div class="location-caption"><div class="eyebrow">Obrati pažnju</div><div style="font-weight:800;font-size:12px;margin-top:2px">${p.objective}</div></div></div><button class="btn primary main-action" id="openChallenge">Riješi izazov</button>`:`<button class="btn primary main-action" id="openMap">Otvori kompas</button>`}</div>${latest?`<div class="latest-signal" data-signal-id="${latest.id}"><div class="icon">${latest.icon}</div><div class="grow"><div class="signal-kind">Posljednji signal · ${latest.label}</div><b>${latest.title}</b><span>${latest.body}</span></div></div>`:`<div class="story-pulse"><div><b>Kapetanov dnevnik je aktivan</b><span>Zanimljivosti i novi tragovi pojavljivaće se tokom kretanja.</span></div><i class="pulse-dot"></i></div>`}<div class="mini-progress"><div class="item"><b>${S.game.evidence.length}</b><span>Dokazi</span></div><div class="item"><b>${S.game.sideDone.length}</b><span>Bonusi</span></div><div class="item"><b>${S.game.notifications.length}</b><span>Signali</span></div></div>${bonus?`<div class="context-banner" id="openSide"><div class="emoji">🏴‍☠️</div><div class="grow"><b>${bonus===1?'Novi bonus je dostupan':bonus+' nova bonusa su dostupna'}</b><span>Ne moraš ga raditi odmah. Bonus ostaje otvoren.</span></div><span class="pill gold">Pogledaj</span></div>`:''}</div>`}
function mapView(p){const d=S.game.distance,stage=approachStage(d),pct=Math.max(8,Math.min(100,100-d/9));return `<div class="map-wrap"><div id="map" class="map"></div><button class="btn ghost map-route-button" id="showRouteMap">☰ Cijela ruta</button><div class="compass-hud"><div class="row"><div class="grow"><div class="eyebrow" style="color:${stage.color}">${stage.label}</div><div class="distance">${d<=60?'Stigli ste':Math.round(d)+' m'}</div></div><div style="font-size:34px">${stage.icon}</div></div><div class="approach-copy">${stage.copy(p)}</div><div class="heat" style="--w:${pct}%"><i></i></div><div class="compass-actions"><button class="btn primary" id="realLocate">Provjeri moju lokaciju</button><div class="secondary"><button class="btn ghost" id="closer">Demo približavanje</button><button class="btn ghost" data-game-tab="story">Nazad na misiju</button></div></div></div></div>`}
function evidenceView(c){return `<div class="game-pad"><div class="row" style="margin-bottom:11px"><div class="grow"><div class="eyebrow">Dosije slučaja</div><h2 style="font-size:25px;margin-top:2px">Pronađeni dokazi</h2></div><span class="pill gold">${S.game.evidence.length}/${c.checkpoints.length}</span></div><div class="evidence-list">${c.checkpoints.map(p=>{const got=S.game.evidence.includes(p.evidence.title);return `<div class="evidence-line ${got?'':'lock'}"><div class="glyph">${got?p.evidence.glyph:'?'}</div><div class="grow"><h4>${got?p.evidence.title:'Još nije pronađeno'}</h4><p>${got?p.evidence.copy:'Ovaj dokaz otključava se završavanjem glavne misije.'}</p></div>${got?'<span class="pill good">✓</span>':''}</div>`}).join('')}</div><div class="ux-note center" style="margin:13px 8px 0">Na kraju ćeš povezati sve dokaze. Nije potrebno da ih pamtiš napamet.</div></div>`}
function sideView(c){const available=c.sidequests.filter(q=>q.unlock<=S.game.idx),later=c.sidequests.filter(q=>q.unlock>S.game.idx);return `<div class="game-pad"><div class="row" style="margin-bottom:10px"><div class="grow"><div class="eyebrow">Dodatni plijen</div><h2 style="font-size:25px;margin-top:2px">Bonus izazovi</h2></div><span class="pill gold">${S.game.sideDone.length}/${c.sidequests.length}</span></div><div class="bonus-intro">Bonusi nijesu obavezni. Možeš ih završiti bilo kada dok traje hunt i svaki donosi dodatne poene.</div><div class="bonus-section-title">Dostupno sada</div>${available.map(q=>{const done=S.game.sideDone.includes(q.id);return `<div class="side-card ${done?'done':'new'}"><div class="row"><div class="grow"><div class="eyebrow">${done?'Završeno':q.type==='photo'?'Fotografija':q.type==='audio'?'Audio':'Brzi zadatak'}</div><h4>${q.title}</h4></div><div class="side-score">+${q.points}</div></div><p>${q.copy}</p>${!done?`<button class="btn ghost" data-side="${q.id}" style="margin-top:10px">${q.type==='photo'?'Dodaj fotografiju':q.type==='audio'?'Snimi audio':'Označi kao završeno'}</button>`:`<div class="pill good" style="margin-top:9px">✓ Poeni dodati</div>`}</div>`}).join('')||'<div class="ux-note">Nema dostupnih bonusa u ovom poglavlju.</div>'}${later.length?`<div class="bonus-section-title">Otključava se kasnije</div><div class="ux-note">Još ${later.length} ${later.length===1?'izazov':'izazova'} pojaviće se kako napreduješ kroz priču.</div>`:''}</div>`}

function vFinale(){const c=currentCase(),max=c.checkpoints.reduce((a,p)=>a+p.points,0)+c.sidequests.reduce((a,q)=>a+q.points,0);return `<div class="view"><div class="scroll"><div class="pad safe" style="padding-top:45px"><div class="final-seal">⚓</div><div class="center"><div class="eyebrow" style="color:var(--green);margin-top:19px">Slučaj zatvoren</div><h1 style="font-size:34px;margin-top:5px">Plijen je vaš.</h1><div class="dim" style="font-size:12.5px;line-height:1.5;margin:8px auto 17px;max-width:330px">${finalCopy(c.id)}</div></div><div class="metrics"><div class="metric"><div class="v">${S.game.score}</div><div class="l">Poena</div></div><div class="metric"><div class="v">${S.game.evidence.length}/${c.checkpoints.length}</div><div class="l">Dokazi</div></div><div class="metric"><div class="v">${S.game.sideDone.length}</div><div class="l">Bonusi</div></div></div><div class="card paper" style="margin-top:15px"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Šta je bilo stvarno?</div><h3 style="font-size:22px;margin-top:5px">Istorija i fikcija</h3><div style="font-size:11.5px;line-height:1.5;margin-top:6px">${c.facts}</div><div class="source-note">${c.sourceNote||''}</div><div class="rope"></div><div style="font-size:11px">Rezultat: <b>${Math.round(S.game.score/max*100)}%</b> ukupnog mogućeg plijena.</div></div><button class="btn primary" id="restart" style="margin-top:14px">Vrati se na početak</button></div></div></div>`}
function finalCopy(id){return (CASES[id]&&CASES[id].finale)||'Slučaj je zatvoren.'}

function vAdmin(){let content='';if(S.adminTab==='dashboard')content=adminDashboard();if(S.adminTab==='tours')content=adminTours();if(S.adminTab==='vouchers')content=adminVouchers();if(S.adminTab==='events')content=adminEvents();if(S.adminTab==='live')content=adminLive();return `<div class="view"><div class="topbar"><div class="grow"><div class="eyebrow">Montenegro Treasure Hunt</div><h2 class="title">Admin kontrola</h2></div><button class="btn ghost mini" id="backPlayer">Igrač</button></div><div class="scroll"><div class="pad" style="padding-top:5px">${adminTabs()}${content}</div></div></div>`}
function adminDashboard(){return `<div style="margin-top:15px"><div class="metrics"><div class="metric"><div class="v">6</div><div class="l">Aktivne ture</div></div><div class="metric"><div class="v">142</div><div class="l">Važeći vaučeri</div></div><div class="metric"><div class="v">18</div><div class="l">Aktivacije danas</div></div></div><div class="card gold" style="margin-top:13px"><div class="row"><div class="grow"><div class="eyebrow" style="color:var(--gold-2)">Važno pravilo sistema</div><h3 style="font-size:21px;margin-top:4px">Prodaja je van aplikacije</h3><div class="faint" style="font-size:11px;line-height:1.45;margin-top:5px">Admin samo izdaje vaučer nakon eksterne kupovine. Igrač u aplikaciji unosi kod, bira dozvoljenu turu i aktivira je.</div></div><span style="font-size:31px">🎟️</span></div></div><div class="eyebrow" style="margin:18px 0 9px">Danas</div>${[['MNE-DEMO-79','Kotor · aktiviran','Jadranski vukovi','good'],['MNE-FLEX-89','Čeka izbor ture','Poklon vaučer','gold'],['KOTOR-ONLY','Kotor · nije pokrenut','Partner hotel','']].map(x=>`<div class="admin-card"><div class="row"><div class="grow"><div class="mono" style="font-size:11px;color:var(--gold-2)">${x[0]}</div><h4 style="margin-top:3px">${x[1]}</h4><div class="faint" style="font-size:10px;margin-top:2px">${x[2]}</div></div><span class="pill ${x[3]}">${x[3]==='good'?'Aktivno':x[3]==='gold'?'Novi':'Spremno'}</span></div></div>`).join('')}</div>`}
function adminTours(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Content Studio</div><h2 style="font-size:25px;margin-top:2px">Šest spremnih huntova</h2></div><button class="btn primary mini">+ Novi hunt</button></div>${TOURS.map(t=>`<div class="admin-card"><div class="row"><div class="avatar">${t.mark}</div><div class="grow" style="margin-left:10px"><h4>${t.title}</h4><div class="faint" style="font-size:10px;margin-top:2px">${t.city} · ${t.distance} · ${CASES[t.caseId].checkpoints.length} stanica · ${CASES[t.caseId].sidequests.length} bonusa</div></div><span class="pill good">Spremno</span></div><div class="progress" style="margin-top:11px"><i style="width:100%"></i></div><div class="row" style="gap:7px;margin-top:10px"><button class="btn ghost mini">Priča</button><button class="btn ghost mini">Ruta</button><button class="btn ghost mini">Bonusi</button><button class="btn ghost mini">Test</button></div></div>`).join('')}</div>`}
function adminVouchers(){return `<div style="margin-top:15px"><div class="row"><div class="grow"><div class="eyebrow">Vaučer sistem</div><h2 style="font-size:25px;margin-top:2px">Generiši pristupni kod</h2></div></div><div class="card gold" style="margin-top:13px"><div class="row" style="gap:10px"><div class="field grow"><label>Vrijednost</label><select class="select" id="genAmount"><option value="79">79 €</option><option value="89">89 €</option><option value="99">99 €</option></select></div><div class="field grow"><label>Maks. igrača</label><select class="select" id="genPlayers"><option>6</option><option>12</option><option>24</option><option>50</option></select></div></div><div class="field"><label>Pravilo izbora</label><select class="select" id="genMode"><option value="value">Bilo koja tura do vrijednosti vaučera</option><option value="exact">Samo određena tura</option></select></div><div class="field" id="exactTourWrap" style="display:none"><label>Dozvoljena tura</label><select class="select" id="genTour">${TOURS.filter(t=>t.published).map(t=>`<option value="${t.id}">${t.city} - ${t.title}</option>`).join('')}</select></div><div class="row" style="gap:10px"><div class="field grow"><label>Rok važenja</label><input class="input" id="genExpiry" value="31.12.2026"></div><div class="field grow"><label>Referenca prodaje</label><input class="input" id="genRef" value="Online prodaja"></div></div><button class="btn primary" id="generateVoucher">Generiši vaučer</button></div>${S.generatedCode?`<div class="code-result" style="margin-top:13px"><b>${S.generatedCode}</b><span>Kod je aktivan i spreman za slanje kupcu.</span><button class="btn paperbtn" id="copyGenerated" style="margin-top:11px">${IC.copy} Kopiraj kod</button></div>`:''}<div class="eyebrow" style="margin:18px 0 9px">Posljednji vaučeri</div>${Object.values(VOUCHERS).slice(-5).reverse().map(v=>`<div class="admin-card"><div class="row"><div class="grow"><div class="mono" style="font-size:11px;color:var(--gold-2)">${v.code}</div><div style="font-weight:800;margin-top:3px">${v.amount} € · do ${v.maxPlayers} igrača</div><div class="faint" style="font-size:10px;margin-top:2px">${v.reference} · važi do ${v.expires}</div></div><span class="pill ${v.status==='active'?'good':'red'}">${v.status==='active'?'Aktivan':'Iskorišćen'}</span></div></div>`).join('')}</div>`}

function validateVoucher(){const raw=($('#voucherInput')?.value||'').trim().toUpperCase();const v=VOUCHERS[raw];if(!v){toast('Kod nije pronađen. Provjerite slova i brojeve.');return}if(v.status==='used'){toast('Ovaj vaučer je već iskorišćen.');return}S.voucher={...v};S.history=[];nav('voucher')}
function startGame(){S.voucher.status='used';VOUCHERS[S.voucher.code].status='used';S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'story',distance:850,arrived:false,sideDone:[],locationShown:false,notifications:[],unread:0,eventsSeen:{},decisions:{},lastStage:'far'};nav('game');clearInterval(TIMER);clearInterval(EVENT_TIMER);TIMER=setInterval(()=>{S.game.elapsed++;const c=$('#clock');if(c)c.textContent=formatTime(S.game.elapsed)},1000);EVENT_TIMER=setInterval(()=>deliverAmbientEvent(),13000);setTimeout(()=>checkpointSignal('start'),1100);setTimeout(()=>deliverAmbientEvent(),6100);setTimeout(()=>notifyNewSidequests(),10100)}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function simulateCloser(){const steps=[850,420,175,48],old=stageKey(S.game.distance);const i=steps.findIndex(v=>v===S.game.distance);S.game.distance=steps[Math.min(i+1,steps.length-1)];const next=stageKey(S.game.distance);if(S.game.distance<=60){S.game.arrived=true;S.game.tab='story';vibrate([35,55,120]);render();setTimeout(()=>{checkpointSignal('arrival',true);showLocationReveal()},140)}else{vibrate(20);render();if(next!==old)setTimeout(()=>checkpointSignal(next),120)}S.game.lastStage=next}
function realLocate(){if(!navigator.geolocation){toast('GPS nije dostupan na ovom uređaju');return}toast('Provjeravam lokaciju…');const old=stageKey(S.game.distance);navigator.geolocation.getCurrentPosition(pos=>{const p=currentCase().checkpoints[S.game.idx],d=distance(pos.coords.latitude,pos.coords.longitude,p.lat,p.lng);S.game.distance=Math.round(d);const next=stageKey(S.game.distance);if(d<=Math.max(p.radius,60)){S.game.arrived=true;S.game.tab='story';render();setTimeout(()=>{checkpointSignal('arrival',true);showLocationReveal()},140)}else{render();if(next!==old)setTimeout(()=>checkpointSignal(next),120)}S.game.lastStage=next},()=>toast('Lokacija nije dovoljno precizna. Pokušajte ponovo.'),{enableHighAccuracy:true,timeout:8000})}
function distance(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function initMap(){const c=currentCase(),p=c.checkpoints[S.game.idx],d=S.game.distance;try{const pts=c.checkpoints.map(x=>[x.lat,x.lng]);MAP=L.map('map',{zoomControl:false,attributionControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(MAP);const line=L.polyline(pts,{color:'#c99a45',weight:3,opacity:.72,dashArray:'7 7'}).addTo(MAP);c.checkpoints.forEach((x,i)=>{const cls=i<S.game.idx?'done':i===S.game.idx?'active':'';const ic=L.divIcon({className:'',html:`<div class="route-pin ${cls}">${i+1}</div>`,iconSize:i===S.game.idx?[32,32]:[26,26],iconAnchor:i===S.game.idx?[16,16]:[13,13]});L.marker([x.lat,x.lng],{icon:ic}).addTo(MAP).bindTooltip(`${i+1}. ${x.name}`,{direction:'top',offset:[0,-10]})});const playerLat=p.lat-(Math.max(d,70)/111000),playerLng=p.lng-.0015;L.circleMarker([playerLat,playerLng],{radius:8,color:'#5fb8b5',weight:3,fillColor:'#5fb8b5',fillOpacity:1}).addTo(MAP).bindTooltip('Vaša približna pozicija');if(d<=500)L.circle([p.lat,p.lng],{radius:d>200?180:85,color:'#c99a45',weight:1,fillColor:'#c99a45',fillOpacity:.07,dashArray:'5 7'}).addTo(MAP);MAP.fitBounds(line.getBounds(),{padding:[42,42]});if(d<=200)MAP.setView([p.lat,p.lng],17);setTimeout(()=>MAP.invalidateSize(),130)}catch(e){}}
function showLocationReveal(){if(!S.game.arrived)return;const p=currentCase().checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet reveal-sheet"><div class="location-visual">${locationArt(p.art)}<div class="location-caption"><div class="eyebrow">Lokacija ${S.game.idx+1}</div><div style="font-family:'Cormorant Garamond';font-size:23px;font-weight:700;margin-top:2px">${p.name}</div></div></div><div class="eyebrow" style="color:var(--gold-2);margin-top:13px">Stigli ste</div><h2 style="margin-top:3px">${p.chapter}</h2><div class="reveal-copy">${p.arrival}</div><div class="story-pulse"><div><b>Pogledajte oko sebe prije odgovora</b><span>Tačan odgovor uvijek se može izvesti iz lokacije i dosijea.</span></div><i class="pulse-dot"></i></div><div class="card gold" style="margin-top:11px"><div class="eyebrow" style="color:var(--gold-2)">Sada uradi ovo</div><div style="font-weight:800;font-size:12px;margin-top:4px">${p.objective}</div></div><button class="btn primary" id="revealChallenge" style="margin-top:12px">Otvori izazov</button><button class="btn ghost" id="studyPlace" style="margin-top:8px">Zatvori i pogledaj lokaciju</button></div>`;$('#phone').appendChild(ov);$('#revealChallenge',ov).onclick=()=>{ov.remove();openChallenge()};$('#studyPlace',ov).onclick=()=>ov.remove()}

function openChallenge(){const p=currentCase().checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay';const body=p.type==='text'?`<input class="input code" id="answerText" placeholder="UPIŠI ODGOVOR" style="margin-top:13px">`:`<div style="margin-top:13px">${p.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`;ov.innerHTML=`<div class="sheet"><div class="grab"></div><div class="eyebrow">Izazov ${S.game.idx+1}/${currentCase().checkpoints.length} · ${p.points} poena</div><h3 class="challenge-title" style="margin-top:4px">${p.name}</h3><div style="font-family:'Cormorant Garamond';font-size:19px;line-height:1.4;margin-top:10px">${p.question}</div>${body}<div id="challengeFeedback" style="margin-top:9px"></div><button class="btn primary" id="submitAnswer" style="margin-top:11px">Potvrdi odgovor</button><div class="row" style="gap:8px;margin-top:8px"><button class="btn ghost" id="useHint">Treba mi hint -25</button><button class="btn ghost" id="closeChallenge">Vrati se</button></div></div>`;$('#phone').appendChild(ov);let picked=null;$$('[data-choice]',ov).forEach(x=>x.onclick=()=>{$$('[data-choice]',ov).forEach(y=>y.classList.remove('pick'));x.classList.add('pick');picked=+x.dataset.choice});$('#closeChallenge',ov).onclick=()=>ov.remove();$('#useHint',ov).onclick=()=>{S.game.hints++;S.game.score=Math.max(0,S.game.score-25);toast(p.hint)};$('#submitAnswer',ov).onclick=()=>{let ok=p.type==='text'?([p.answer,...(p.accept||[])].map(normalizeAnswer).includes(normalizeAnswer($('#answerText',ov).value))):picked===p.answer;const f=$('#challengeFeedback',ov);if(!ok){f.className='feedback bad';f.textContent='Nije tačno. Pogledaj lokaciju i pokušaj ponovo.';vibrate(30);return}f.className='feedback good';f.textContent=`Dokaz pronađen. +${p.points} poena`;S.game.score+=p.points;if(!S.game.evidence.includes(p.evidence.title))S.game.evidence.push(p.evidence.title);vibrate([40,50,100]);setTimeout(()=>{ov.remove();s function showEvidenceFound(p){const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet center"><div style="font-size:46px">${p.evidence.glyph}</div><div class="eyebrow" style="color:var(--green);margin-top:7px">Dokaz pronađen</div><h3 style="font-size:27px;margin-top:3px">${p.evidence.title}</h3><div class="reveal-copy">${p.evidence.copy}</div>${p.signals&&p.signals.after?`<div class="card gold" style="margin-top:12px;text-align:left"><div class="eyebrow" style="color:var(--gold-2)">Šta ovo mijenja?</div><div style="font-size:11px;line-height:1.45;margin-top:4px">${p.signals.after.body}</div></div>`:''}<div class="card paper" style="margin-top:12px;text-align:left"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Istorijski trag</div><div style="font-size:11px;line-height:1.42;margin-top:4px">${p.fact}</div></div><button class="btn primary" id="continueStory" style="margin-top:12px">${S.game.idx===currentCase().checkpoints.length-1?'Završi slučaj':'Nastavi na sljedeći trag'}</button></div>`;$('#phone').appendChild(ov);$('#continueStory',ov).onclick=()=>{ov.remove();checkpointSignal('after');if(S.game.idx===currentCase().checkpoints.length-1){clearInterval(TIMER);clearInterval(EVENT_TIMER);confetti();setTimeout(()=>nav('finale'),450)}else{S.game.idx++;S.game.distance=850;S.game.arrived=false;S.game.tab='story';S.game.lastStage='far';render();setTimeout(()=>checkpointSignal('start'),650);setTimeout(()=>deliverAmbientEvent(),5600);setTimeout(()=>notifyNewSidequests(),9200)}}}
function completeSide(id){const q=currentCase().sidequests.find(x=>x.id===id);if(!q||S.game.sideDone.includes(id))return;S.game.sideDone.push(id);S.game.score+=q.points;vibrate([20,40,70]);pushSignal({id:'side-'+id,icon:'🏴‍☠️',label:'Bonus završen',title:q.title,body:q.result||`Posada osvaja ${q.points} dodatnih poena.`,kind:'bonus'});render()}

function generateVoucher(){const amount=+$('#genAmount').value,mode=$('#genMode').value,maxPlayers=+$('#genPlayers').value,expires=$('#genExpiry').value.trim()||'31.12.2026',reference=$('#genRef').value.trim()||'Eksterna prodaja';const chunk=Math.random().toString(36).slice(2,6).toUpperCase();const code=`MNE-${amount}-${chunk}`;const v={code,amount,mode,maxPlayers,expires,status:'active',reference};if(mode==='exact')v.tourIds=[$('#genTour').value];VOUCHERS[code]=v;S.generatedCode=code;render();toast('Vaučer je generisan')}


function stageKey(d){if(d>500)return'far';if(d>200)return'near';if(d>60)return'close';return'arrival'}
function signalChime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(720,a.currentTime);o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.12);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.055,a.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2);setTimeout(()=>a.close(),300)}catch(e){}}
function checkpointSignal(stage,silent=false){if(S.view!=='game')return;const c=currentCase(),p=c.checkpoints[S.game.idx],raw=p.signals&&p.signals[stage];if(!raw)return;const item={...raw,id:`${c.id}-cp${S.game.idx}-${stage}`};pushSignal(item,{silent})}
function deliverAmbientEvent(force=false){if(S.view!=='game'||document.querySelector('.overlay')||document.querySelector('.signal-toast'))return;const c=currentCase(),pool=(c.events||[]).filter(e=>e.minIdx<=S.game.idx&&!S.game.eventsSeen[e.id]);if(!pool.length)return;pushSignal(pool[0]);}

function showSignalToast(item){if(S.view!=='game'||document.querySelector('.overlay'))return;document.querySelectorAll('.signal-toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='signal-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.dataset.signalId=item.id;el.innerHTML=`<div class="si">${item.icon||'📜'}</div><div class="grow"><div class="sl">${item.label||'Novi signal'}</div><div class="st">${item.title}</div><div class="sb">${item.body}</div><div style="font-size:8px;color:var(--cream-48);margin-top:4px">Dodirni za detalje · ostaje u dnevniku</div></div>`;$('#phone').appendChild(el);el.onclick=()=>{el.remove();openSignalDetail(item.id)};setTimeout(()=>el.remove(),4300)}
function openSignalCenter(){S.game.unread=0;const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="sheet"><div class="grab"></div><div class="row"><div class="grow"><div class="eyebrow">Kapetanov dnevnik</div><h2 style="font-size:27px;margin-top:3px">Signali i zanimljivosti</h2></div><span class="pill gold">${S.game.notifications.length}</span></div><div class="ux-note" style="margin-top:6px">Ovdje ostaju svi tragovi, istorijske kartice, poruke i odluke posade.</div><div class="signal-list">${S.game.notifications.map(n=>`<div class="signal-item" data-open-signal="${n.id}"><div class="icon">${n.icon}</div><div class="grow"><div class="signal-kind">${n.label}</div><h4>${n.title}</h4><p>${n.body}</p></div><div class="time">${formatTime(n.time)}</div></div>`).join('')||'<div class="ux-note center">Prvi signal stiže čim počne avantura.</div>'}</div><button class="btn ghost" id="closeSignals" style="margin-top:12px">Zatvori dnevnik</button></div>`;$('#phone').appendChild(ov);$('#closeSignals',ov).onclick=()=>{ov.remove();render()};$$('[data-open-signal]',ov).forEach(x=>x.onclick=()=>openSignalDetail(x.dataset.openSignal,ov))}
function openSignalDetail(id,parent){const item=S.game.notifications.find(n=>n.id===id);if(!item)return;if(parent)parent.remove();const decided=S.game.decisions[id];const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet"><div class="center" style="font-size:43px">${item.icon}</div><div class="eyebrow center" style="color:var(--gold-2);margin-top:8px">${item.label}</div><h2 class="center" style="font-size:27px;margin-top:4px">${item.title}</h2><div class="reveal-copy">${item.body}</div>${item.kind==='decision'&&!decided?`<div class="decision-grid">${item.choices.map((c,i)=>`<button class="decision-option" data-decision="${i}">${c}</button>`).join('')}</div>`:decided?`<div class="feedback good" style="margin-top:12px">${decided}</div>`:''}<button class="btn ghost" id="closeSignalDetail" style="margin-top:12px">Nazad u igru</button></div>`;$('#phone').appendChild(ov);$('#closeSignalDetail',ov).onclick=()=>ov.remove();$$('[data-decision]',ov).forEach(x=>x.onclick=()=>{const i=+x.dataset.decision,response=(item.responses&&item.responses[i])||'Odluka je upisana u dnevnik.';S.game.decisions[id]=response;S.game.score+=10;vibrate([18,35,60]);ov.remove();pushSignal({id:id+'-result',icon:'🧭',label:'Odluka posade',title:item.choices[i],body:response,kind:'result'});render()})}
function notifyNewSidequests(){const c=currentCase(),newOnes=c.sidequests.filter(q=>q.unlock===S.game.idx&&!S.game.sideDone.includes(q.id));if(newOnes.length)pushSignal({id:`${c.id}-side-unlock-${S.game.idx}`,icon:'🏴‍☠️',label:'Novi bonus',title:newOnes.length===1?newOnes[0].title:`Otključana su ${newOnes.length} bonus izazova`,body:newOnes.length===1?newOnes[0].copy:'Otvorite karticu Bonusi da izaberete dodatni plijen.',kind:'bonus'})}

function locationArt(type){const sky=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#254e59"/><stop offset="1" stop-color="#c58d4a"/></linearGradient><linearGradient id="seaG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c3540"/><stop offset="1" stop-color="#2d6b70"/></linearGradient></defs><rect width="640" height="400" fill="url(#sky)"/><circle cx="500" cy="88" r="38" fill="#efd18b" opacity=".72"/><path d="M0 250 Q140 215 270 250 T640 245 V400 H0Z" fill="url(#seaG)"/><path d="M0 278 Q150 254 300 280 T640 270" stroke="#b9d0c8" stroke-opacity=".28" fill="none" stroke-width="4"/>`;
 const ground=`<path d="M0 305 L640 286 V400 H0Z" fill="#3a3327"/><path d="M0 328 L640 308" stroke="#665a43" stroke-width="3"/>`;
 const common=`<g opacity=".24" stroke="#efd18b" fill="none"><circle cx="88" cy="80" r="45"/><path d="M88 22v116M30 80h116M56 48l64 64M120 48l-64 64"/></g>`;
 let scene='';
 if(type==='gate'||type==='rivergate')scene=`${sky}<g fill="#9b8b6b" stroke="#d2c29d" stroke-width="3"><path d="M125 295V126h390v169z"/><path d="M236 295V194c0-61 168-61 168 0v101z" fill="#182529"/><rect x="151" y="150" width="50" height="145"/><rect x="439" y="150" width="50" height="145"/></g><g fill="#c99a45"><circle cx="320" cy="157" r="18"/><path d="M320 139l-28 15 28 8 28-8z"/></g>${type==='rivergate'?'<path d="M0 315 Q150 285 320 320 T640 302 V400 H0Z" fill="#0f4d59" opacity=".9"/>':ground}${common}`;
 else if(type==='clock')scene=`${sky}${ground}<g fill="#96866a" stroke="#d3c5a5" stroke-width="3"><rect x="250" y="100" width="140" height="215"/><path d="M237 100h166l-28-32h-110z"/><circle cx="320" cy="157" r="37" fill="#17252a"/><path d="M320 132v28l19 11" stroke="#efd18b" stroke-width="6" fill="none"/><rect x="285" y="230" width="70" height="85" fill="#263135"/></g><path d="M90 315h460" stroke="#c5af7d" stroke-width="8"/>${common}`;
 else if(type==='cathedral')scene=`${sky}${ground}<g fill="#a99a79" stroke="#ded0ad" stroke-width="3"><rect x="205" y="155" width="230" height="160"/><rect x="165" y="92" width="82" height="223"/><rect x="393" y="92" width="82" height="223"/><path d="M165 92l41-54 41 54M393 92l41-54 41 54"/><circle cx="320" cy="205" r="34" fill="#283237"/><path d="M292 315v-70c0-39 56-39 56 0v70" fill="#283237"/></g>${common}`;
 else if(type==='chapel')scene=`${sky}${ground}<g fill="#a39372" stroke="#dacba8" stroke-width="3"><rect x="215" y="152" width="220" height="163"/><path d="M195 152l130-88 130 88z"/><rect x="300" y="225" width="52" height="90" fill="#263035"/><circle cx="325" cy="178" r="23" fill="#263035"/></g><path d="M125 315h390" stroke="#bda879" stroke-width="6"/>${common}`;
 else if(type==='fortress'||type==='tower')scene=`${sky}<path d="M0 320L100 180l115 35 80-95 110 100 90-55 145 155v80H0z" fill="#302e28"/><g fill="#8f8065" stroke="#cdbc99" stroke-width="3"><path d="M120 288V150h400v138z"/><rect x="150" y="112" width="80" height="176"/><rect x="410" y="95" width="86" height="193"/><path d="M150 112h80M410 95h86"/><rect x="294" y="210" width="62" height="78" fill="#1a282c"/></g>${common}`;
 else if(type==='sea')scene=`${sky}<path d="M0 302Q145 272 320 305T640 292V400H0Z" fill="#0b4653"/><path d="M70 315Q170 286 280 315" stroke="#d9d2b5" stroke-opacity=".3" stroke-width="4" fill="none"/><g transform="translate(390 205)"><path d="M0 65h132l-22 30H22z" fill="#3b2c1e"/><path d="M55 0v70" stroke="#e0cc98" stroke-width="5"/><path d="M58 5l55 48H58z" fill="#eadbbd" opacity=".85"/><path d="M51 18L12 55h39z" fill="#a84c32" opacity=".9"/></g><path d="M0 320L145 210l92 110z" fill="#252923"/>${common}`;
 else if(type==='palace'||type==='embassy')scene=`${sky}${ground}<g fill="#ad9d7e" stroke="#dfd0ae" stroke-width="3"><rect x="130" y="150" width="380" height="165"/><path d="M110 150h420l-70-56H180z"/><rect x="285" y="225" width="70" height="90" fill="#283236"/>${[170,225,385,440].map(x=>`<rect x="${x}" y="190" width="32" height="45" fill="#33444a"/>`).join('')}</g><path d="M120 315h400" stroke="#c6b27e" stroke-width="7"/>${common}`;
 else if(type==='mountain')scene=`${sky}<path d="M0 310L120 155l75 65 88-140 92 130 70-76 195 176v90H0z" fill="#27302d"/><path d="M0 340Q180 290 360 330T640 315V400H0Z" fill="#173039"/><g fill="#b0a17f" opacity=".75"><rect x="255" y="235" width="130" height="55"/><path d="M240 235h160l-35-28h-90z"/></g>${common}`;
 else if(type==='olive')scene=`${sky}${ground}<g transform="translate(310 70)"><path d="M-25 245c8-72 3-118 18-170M18 245C8 174 16 120 0 76" stroke="#59422c" stroke-width="25" fill="none" stroke-linecap="round"/><g fill="#5b7047">${[[-90,85],[-42,45],[20,52],[72,92],[-110,145],[-50,120],[20,128],[95,150],[-72,182],[48,185]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="48"/>`).join('')}</g><g fill="#758a59">${[[-75,70],[-18,35],[42,70],[-88,130],[8,110],[70,128],[-48,165],[45,170]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="28"/>`).join('')}</g></g>${common}`;
 else if(type==='aqueduct')scene=`${sky}${ground}<g fill="#9d8a68" stroke="#d1bf98" stroke-width="3">${[80,180,280,380,480].map(x=>`<path d="M${x} 310V180h80v130h-20v-65c0-50-40-50-40 0v65z"/>`).join('')}</g>${common}`;
 else if(type==='stairs')scene=`${sky}<path d="M0 400V250l150-80 145 70 125-105 220 140V400z" fill="#28312e"/><path d="M210 400l150-220 120 220z" fill="#74664f"/><path d="M236 365h220M252 335h184M270 305h150M290 275h112M310 245h75" stroke="#cdbb95" stroke-width="5"/>${common}`;
 else if(type==='bridge')scene=`${sky}<path d="M0 320Q160 285 320 315T640 300V400H0Z" fill="#0d4652"/><g fill="#9b8969" stroke="#d0bd98" stroke-width="4"><path d="M70 300h500v45H70z"/><path d="M130 300c20-120 140-120 160 0M350 300c20-120 140-120 160 0" fill="none" stroke-width="28"/></g>${common}`;
 else if(type==='square')scene=`${sky}${ground}<g fill="#a39173" stroke="#d3c09a" stroke-width="3"><rect x="75" y="165" width="130" height="150"/><rect x="435" y="150" width="130" height="165"/><rect x="238" y="205" width="164" height="110"/></g><circle cx="320" cy="285" r="22" fill="#c99a45"/>${common}`;
 else scene=`${sky}${ground}${common}`;
 return `<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustracija lokacije">${scene}<rect x="8" y="8" width="624" height="384" rx="22" fill="none" stroke="#efd18b" stroke-opacity=".22" stroke-width="2"/></svg>`
}

render();
</script>
