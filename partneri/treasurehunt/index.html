/* ============================================================
   GPS watch
   ============================================================ */
var watchId=null;
function isSecure(){try{return !!window.isSecureContext||location.protocol==='https:'||['localhost','127.0.0.1','::1'].indexOf(location.hostname)>-1;}catch(e){return false;}}
function startWatch(){
  if(!navigator.geolocation){S.gpsState='error';refreshMeta();return;}
  S.gpsState='waiting';refreshMeta();
  try{
    watchId=navigator.geolocation.watchPosition(handlePosition,handleGeoError,{enableHighAccuracy:true,maximumAge:1500,timeout:15000});
  }catch(e){S.gpsState='error';refreshMeta();}
}
function handleGeoError(err){
  if(err&&err.code===1)S.gpsState=isSecure()?'denied':'insecure';
  else S.gpsState='error';
  refreshMeta();
  if(S.activeTab==='explore')refreshExploreDistance();
}
function handlePosition(p){
  S.pos={lat:p.coords.latitude,lng:p.coords.longitude};S.accuracy=p.coords.accuracy;S.gpsState='live';
  if(!allSolved()){
    var cp=curCP();var d=haversine(S.pos.lat,S.pos.lng,cp.lat,cp.lng);
    if(d<=cp.radius&&(S.accuracy==null||S.accuracy<=CFG.GPS_ARRIVE_ACCURACY))S.streak++;else S.streak=0;
  }
  updateUserMarker();
  if(S.activeTab==='explore'&&$('#view-game')&&$('#view-game').classList.contains('on'))refreshExploreDistance();
  refreshMeta();
}
function refreshMeta(){
  var dot=$('#view-game .gps-dot');if(dot)dot.className='gps-dot '+gpsDotClass();
}
function refreshExploreDistance(){
  var body=$('#gbody');if(!body)return;
  var cp=curCP();
  if(isArrived(cp)&&!$('.arrival-action-card',body)){renderGame();return;}
  var big=$('.distance-block .big',body),heat=$('.heat i',body);
  if(big){var d=distTo(cp);big.textContent=d==null?'—':fmtDist(d);if(heat)heat.style.width=heatWidth(d,cp.radius)+'%';}
}

/* ============================================================
   MAP (Leaflet embed + geofence + live lokacija + SVG fallback)
   ============================================================ */
var leafletTried=false,userMarker=null,accCircle=null,geoZone=null,mapInvalT=null,mapLoadT=null;
var LEAFLET_CSS=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'];
var LEAFLET_JS=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'];
function setMapLoading(on){var l=$('#maploading');if(l){l.style.display=on?'flex':'none';l.setAttribute('aria-hidden',on?'false':'true');}}
function loadLeaflet(done){
  if(window.L){done(true);return;}
  var link=el('link');link.rel='stylesheet';link.href=LEAFLET_CSS[0];document.head.appendChild(link);
  var ci=1;link.onerror=function(){if(ci<LEAFLET_CSS.length){var l2=el('link');l2.rel='stylesheet';l2.href=LEAFLET_CSS[ci++];document.head.appendChild(l2);}};
  var i=0,called=false;
  function fin(ok){if(called)return;called=true;done(ok);}
  (function tryJs(){
    if(i>=LEAFLET_JS.length){fin(false);return;}
    var sc=el('script');sc.src=LEAFLET_JS[i++];sc.async=true;
    sc.onload=function(){fin(!!window.L);};
    sc.onerror=function(){tryJs();};
    document.head.appendChild(sc);
  })();
}
function initMap(){
  var host=$('#map');if(!host)return;
  if(window.L){setMapLoading(false);buildLeaflet();return;}
  if(S.mapMode==='leaflet'&&window.L){buildLeaflet();return;}
  buildFallback();                 // ruta ostaje vidljiva dok se ulična mapa povezuje
  if(leafletTried&&!window.L){setMapLoading(false);return;}
  leafletTried=true;setMapLoading(true);
  loadLeaflet(function(ok){
    setMapLoading(false);
    if(ok&&$('#map'))buildLeaflet();
  });
  clearTimeout(mapLoadT);
  mapLoadT=setTimeout(function(){setMapLoading(false);if(!window.L&&$('#map')&&S.mapMode!=='leaflet')buildFallback();},6000);
}
function caseBounds(){
  var cps=S.caseData.checkpoints;
  var la=cps.map(function(c){return c.lat;}),lo=cps.map(function(c){return c.lng;});
  return {minLa:Math.min.apply(null,la),maxLa:Math.max.apply(null,la),minLo:Math.min.apply(null,lo),maxLo:Math.max.apply(null,lo)};
}
function activeLatLng(){if(allSolved())return null;var cp=curCP();return cp?[cp.lat,cp.lng]:null;}
function buildLeaflet(){
  var host=$('#map');if(!host||!window.L)return;
  host.innerHTML='';S.mapMode='leaflet';userMarker=null;accCircle=null;geoZone=null;
  var cps=S.caseData.checkpoints;
  var map=L.map(host,{zoomControl:false,attributionControl:true,tap:true}).setView([cps[0].lat,cps[0].lng],15);
  var tileErrors=0;
  var tiles=L.tileLayer(CFG.MAP_TILE_URL,{attribution:CFG.MAP_ATTRIBUTION,maxZoom:19}).addTo(map);
  tiles.on('tileerror',function(){
    tileErrors++;
    if(tileErrors===4){
      try{map.remove();}catch(e){}
      S.map=null;S.mapMode='svg';buildFallback();
      toast('Ulična mapa nije dostupna — prikazana je ugrađena ruta.');
    }
  });
  L.control.zoom({position:'bottomright'}).addTo(map);
  var pts=[];
  cps.forEach(function(cp,i){
    var done=i<S.chapterIdx,active=i===S.chapterIdx&&!allSolved();
    var color=done?'#5aa877':(active?'#f0cf82':'#8aa39d');
    var ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28],
      html:'<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#061c22;border:2px solid '+color+';display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.4)'+(active?';animation:lpin 1.6s infinite':'')+'"><span style="transform:rotate(45deg);color:'+color+';font:700 12px/1 sans-serif">'+(done?'✓':(i+1))+'</span></div>'});
    var m=L.marker([cp.lat,cp.lng],{icon:ic}).addTo(map);
    m.bindPopup('<b>'+esc((i+1)+'. '+cp.name)+'</b><br><span style="opacity:.75">'+esc(cp.chapter)+'</span>');
    pts.push([cp.lat,cp.lng]);
    if(active){
      geoZone=L.circle([cp.lat,cp.lng],{radius:cp.radius,color:'#f0cf82',weight:1.5,fillColor:'#f0cf82',fillOpacity:.12,dashArray:'4 6'}).addTo(map);
    }
  });
  L.polyline(pts,{color:'#d8a94a',weight:3,dashArray:'6 8',opacity:.7}).addTo(map);
  S.map=map;
  var focus=activeLatLng();
  if(focus)map.setView(focus,16);
  else{try{map.fitBounds(pts,{padding:[40,40],maxZoom:16});}catch(e){}}
  updateUserMarker();
  clearTimeout(mapInvalT);
  mapInvalT=setTimeout(function(){try{map.invalidateSize();}catch(e){}},260);
  map.whenReady(function(){try{map.invalidateSize();}catch(e){}});
  map.on('dragstart',function(){if(S.follow){S.follow=false;syncFollowBtn();}});
}
function buildFallback(){
  var host=$('#map');if(!host)return;
  if(S.mapMode==='leaflet')return;
  S.mapMode='svg';
  var cps=S.caseData.checkpoints,b=caseBounds();
  var W=100,H=100,pad=14;
  function px(lng){var r=(b.maxLo-b.minLo)||1;return pad+(lng-b.minLo)/r*(W-2*pad);}
  function py(lat){var r=(b.maxLa-b.minLa)||1;return H-pad-(lat-b.minLa)/r*(H-2*pad);}
  var path='';cps.forEach(function(cp,i){path+=(i?' L':'M')+px(cp.lng).toFixed(1)+' '+py(cp.lat).toFixed(1);});
  var pins='';cps.forEach(function(cp,i){
    var done=i<S.chapterIdx,active=i===S.chapterIdx&&!allSolved();
    var col=done?'#5aa877':(active?'#f0cf82':'#8aa39d');
    pins+='<g transform="translate('+px(cp.lng).toFixed(1)+','+py(cp.lat).toFixed(1)+')">'+
      (active?'<circle r="6.5" fill="none" stroke="#f0cf82" stroke-width="0.7" stroke-dasharray="1.5 1.5" opacity="0.7"/>':'')+
      '<circle r="3.4" fill="#061c22" stroke="'+col+'" stroke-width="1.3"'+(active?' class="pmpulse"':'')+'/>'+
      '<text y="1.4" text-anchor="middle" font-size="3.4" fill="'+col+'" font-weight="700">'+(done?'✓':(i+1))+'</text></g>';
  });
  host.innerHTML='<div class="map-fallback"><div class="map-fallback-card">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%">'+
    '<path d="'+path+'" fill="none" stroke="#d8a94a" stroke-width="1.1" stroke-dasharray="2.4 2.4" opacity="0.75"/>'+
    pins+
    '<style>.pmpulse{animation:mp 1.6s infinite}@keyframes mp{50%{r:4.4;opacity:.7}}</style>'+
    '</svg><div class="map-fallback-note">Pojednostavljena mapa — puna mapa se učitava kad je uređaj online.</div></div></div>';
  updateUserMarker();
}
function updateUserMarker(){
  if(S.mapMode!=='leaflet'||!S.map||!window.L||!S.pos)return;
  var ll=[S.pos.lat,S.pos.lng];
  if(!userMarker){
    var uic=L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
      html:'<div style="width:16px;height:16px;border-radius:50%;background:#41b6c4;border:2px solid #fff;box-shadow:0 0 0 4px rgba(65,182,196,.3),0 2px 6px rgba(0,0,0,.4)"></div>'});
    userMarker=L.marker(ll,{icon:uic,zIndexOffset:1000,keyboard:false}).addTo(S.map);
    userMarker.bindPopup('Ovdje ste');
  }else userMarker.setLatLng(ll);
  if(S.accuracy!=null){
    if(!accCircle)accCircle=L.circle(ll,{radius:S.accuracy,color:'#41b6c4',weight:1,fillColor:'#41b6c4',fillOpacity:.08}).addTo(S.map);
    else{accCircle.setLatLng(ll);accCircle.setRadius(S.accuracy);}
  }
  if(S.follow)S.map.setView(ll);
}
function recenterMap(){
  if(S.mapMode==='leaflet'&&S.map){
    if(S.pos){S.follow=true;syncFollowBtn();S.map.setView([S.pos.lat,S.pos.lng],17);}
    else{var f=activeLatLng();if(f)S.map.setView(f,16);toast('Čekam GPS lokaciju…');}
  }else if(S.mapMode==='svg'){
    if(!S.pos)toast(isSecure()?'Čekam GPS lokaciju…':'GPS traži HTTPS — hostuj sajt.');
    else toast('Puna mapa se učitava kad je uređaj online.');
  }
}
function updateMapStage(){var b=$('.map-stage-badge');if(b)b.textContent=(S.chapterIdx+1)+'/'+S.caseData.checkpoints.length;}

/* ============================================================
   FINALE
   ============================================================ */
function renderFinale(){
  clearTimeout(S.signalTimer);
  var node=$('#view-finale');if(node){node.innerHTML='';}else{node=el('div','view finale');node.id='view-finale';app.appendChild(node);}
  var c=S.caseData,tour=findTour(S.tourId);
  var solvedCount=S.caseData.checkpoints.length;
  var sideDone=Object.keys(S.side).length;
  var pad=el('div','pad center');
  pad.innerHTML=
    '<div class="final-seal">🏆</div>'+
    '<div class="eyebrow">Slučaj zatvoren</div>'+
    '<h1 class="brandtitle" style="font-size:30px;margin-top:8px">'+esc(tour.city)+'</h1>'+
    '<p class="ux-kicker">'+esc(c.title)+'</p>'+
    '<div class="metrics">'+
      '<div class="metric"><div class="n">'+S.points+'</div><div class="l">poena</div></div>'+
      '<div class="metric"><div class="n">'+solvedCount+'</div><div class="l">tačaka</div></div>'+
      '<div class="metric"><div class="n">'+sideDone+'</div><div class="l">bonusa</div></div>'+
    '</div>'+
    '<div class="card paper"><div class="eyebrow">Rasplet</div>'+
      '<p style="font-family:var(--serif);font-size:15.5px;line-height:1.55;margin:8px 0 0;color:var(--ink)">'+esc(c.arc.truth)+'</p></div>'+
    '<div class="stack mt16">'+
      '<button class="btn primary" id="fnext">Izaberi sljedeći grad</button>'+
      '<button class="btn ghost" id="fcase">Pregledaj dosije</button>'+
    '</div>';
  node.appendChild(pad);node.appendChild(el('div','safe'));
  clearSaved();
  $('#fnext',node).addEventListener('click',function(){releaseWake();openVoucher();});
  $('#fcase',node).addEventListener('click',function(){S.activeTab='case';show('game');renderGame();});
}

/* ---------- Confetti ---------- */
function celebrate(){
  haptic([12,40,12]);
  var box=el('div','confetti');
  var cols=['#d8a94a','#f0cf82','#41b6c4','#5aa877','#d05a48'];
  for(var i=0;i<70;i++){
    var p=el('i');p.style.left=Math.random()*100+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.6+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*.6)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';
    box.appendChild(p);
  }
  app.appendChild(box);
  setTimeout(function(){box.remove();},5200);
}

/* ---------- Exit ---------- */
function confirmExit(){
  overlayScrim=true;overlay.className='overlay center';
  sheet.innerHTML='<div class="sheet-head"><h3>Prekid lova?</h3></div>'+
    '<div class="sheet-body"><p class="mission-copy">Napredak je sačuvan. Možeš nastaviti kasnije sa početnog ekrana.</p>'+
    '<div class="sheet-actions"><button class="btn ghost grow" id="exno">Ostani</button>'+
    '<button class="btn danger grow" id="exyes">Izađi</button></div></div>';
  requestAnimationFrame(function(){overlay.classList.add('on');});
  $('#exno',sheet).addEventListener('click',closeOverlay);
  $('#exyes',sheet).addEventListener('click',function(){
    closeOverlay();clearTimeout(S.signalTimer);if(watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
    releaseWake();save();renderGate();show('gate');
  });
}

/* ---------- Wake Lock ---------- */
var wake=null;
function requestWake(){try{if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}catch(e){}}
function releaseWake(){try{if(wake){wake.release();wake=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&$('#view-game')&&$('#view-game').classList.contains('on'))requestWake();});

/* ============================================================
   BOOT
   ============================================================ */
renderGate();
})();

</script>
</body>
</html>
