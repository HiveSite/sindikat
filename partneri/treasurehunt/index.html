00,"evidence":{"glyph":"🕊️","title":"Zavjet zajedničkog održavanja","copy":"Posljednja rečenica glasi: 'Vodu dijelimo po vremenu, a dovod čuvamo zajedno.' Maslina je bila simbol pomirenja."},"fact":"Stara maslina u Mirovici stara je više od dvije hiljade godina i zaštićeni je prirodni spomenik. Priča o mirenju pod drvetom pripada lokalnom predanju.","access":"Kompleks može imati radno vrijeme i ulaznicu. Finale se može riješiti sa javnog ulaza.","options":["Izvor pripada onome ko prvi stigne.","Vodu dijelimo po vremenu, a dovod čuvamo zajedno.","Zidine imaju prednost nad svim selima.","Akvadukt se zatvara tokom ljeta."],"signals":{"start":{"icon":"🫒","label":"Posljednji trag","title":"Maslinova grančica nalazi se na oba primjerka ugovora","body":"Potpisnici su izabrali neutralan simbol koji nije pripadao samo jednoj porodici.","kind":"message"},"near":{"icon":"🌳","label":"Istorijska zanimljivost","title":"Stara maslina ima više od dvije hiljade godina","body":"Spada među najstarija poznata stabla masline u ovom dijelu Evrope.","kind":"fact"},"close":{"icon":"📜","label":"Završna dedukcija","title":"Spojite vrijeme, vodu i popravku","body":"Odgovor mora biti održiv za sve strane.","kind":"message"},"after":{"icon":"✅","label":"Slučaj zatvoren","title":"Istraga napreduje","body":"Stara maslina potvrđuje smisao izgubljene klauzule: korišćenje vode nosi i obavezu zajedničkog čuvanja.","kind":"message"}},"id":"bar-cp-5","accept":[],"deduction":"Stara maslina potvrđuje smisao izgubljene klauzule: korišćenje vode nosi i obavezu zajedničkog čuvanja.","whyItMatters":"Stara maslina potvrđuje smisao izgubljene klauzule: korišćenje vode nosi i obavezu zajedničkog čuvanja."}],"sidequests":[{"id":"b1","unlock":0,"title":"Tri zanata čaršije","copy":"Pronađite tri različita zanatska materijala u izlozima ili arhitekturi, bez ulaska u privatne prostore.","points":45,"type":"counter","result":"Zanatska karta je dopunjena."},{"id":"b2","unlock":1,"title":"Zidine i naselje","copy":"Foto function currentCase(){return CASES[(S.tour&&S.tour.caseId)||'kotor']||CASES.kotor}
function eligibleTours(v){if(!v)return[];if(v.mode==='exact')return TOURS.filter(t=>t.published&&(v.tourIds||[]).includes(t.id));return TOURS.filter(t=>t.published&&t.value<=v.amount)}
function newSideCount(){const c=currentCase();return c.sidequests.filter(q=>q.unlock<=S.game.idx&&!S.game.sideDone.includes(q.id)).length}
function gameTabs(active){const n=newSideCount();return `<div class="tabbar">${[
 ['story',IC.scroll,'Priča',''],['map',IC.compass,'Kompas',''],['evidence',IC.chest,'Dokazi',''],['side',IC.flag,'Bonusi',n]
 ].map(([v,i,l,b])=>`<div class="tab ${active===v?'on':''}" data-game-tab="${v}">${i}<span>${l}</span>${b?`<i class="badge">${b}</i>`:''}</div>`).join('')}</div>`}
function adminTabs(){return `<div class="admin-rail">${[['dashboard','Pregled'],['test','Terenski test'],['tours','Huntovi'],['vouchers','Vaučeri'],['events','Aktivacije'],['live','Live']].map(([v,l])=>`<div class="admin-chip ${S.adminTab===v?'on':''}" data-admin-tab="${v}">${l}</div>`).join('')}</div>`}
function render(){if(MAP){try{MAP.remove()}catch(e){}MAP=null}const views={gate:vGate,voucher:vVoucher,tour:vTourDetail,setup:vSetup,preflight:vPreflight,game:vGame,finale:vFinale,admin:vAdmin};$('#app').innerHTML=(views[S.view]||vGate)();mount()}

function vGate(){return `<div class="view"><div class="mast" style="padding-top:54px"><div class="brandmark"><span>☠</span></div><div class="eyebrow">Šest istorijskih avantura kroz Crnu Goru</div><h1 class="brandtitle pirate">Montenegro<br>Treasure Hunt<small>Pronađi trag. Otključaj priču.</small></h1><div class="gate-card"><div class="ux-kicker">Aktivacija vaučera</div><h2 style="font-size:25px;margin:5px 0 4px">Unesi kod za ulaz</h2><div class="ux-note" style="margin-bottom:12px">Kupovina je završena na prodajnom sajtu. Ovdje biraš turu i počinješ igru.</div><input class="input code" id="voucherInput" placeholder="MNE-XXXX-XX" autocomplete="off"><button class="btn primary" id="useVoucher" style="margin-top:10px">Nastavi</button><button class="btn ghost" id="demoVoucher" style="margin-top:8px">Pregledaj svih 6 demo tura</button><div class="row" style="justify-content:center;gap:7px;margin-top:13px"><span class="pill">Kotor</span><span class="pill">Ulcinj</span><span class="pill">Bar</span><span class="pill">+3 grada</span></div></div><button class="btn ghost mini" id="adminDemo" style="margin:13px auto 0">Admin</button></div></div>`}

function vVoucher(){const v=S.voucher,tours=eligibleTours(v);return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 1 od 3</div><h2 class="title">Izaberi avanturu</h2><div class="city-count">Svih ${tours.length} tura su dostupne odmah.</div></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="voucher-compact"><div><div class="amount">${v.amount} €</div><div class="code">${esc(v.code)}</div></div><div class="grow"><div style="font-weight:800;font-size:12px">Vaučer je važeći</div><div style="font-size:9.5px;margin-top:2px;color:rgba(29,33,30,.62)">Do ${v.maxPlayers} igrača · do ${v.expires}</div></div><div style="font-size:24px">🎟️</div></div><div class="ux-stepper"><i class="on"></i><i></i><i></i></div><div class="city-grid">${tours.map(t=>tourCard(t)).join('')}</div><div class="ux-note center" style="margin:13px 10px 3px">Otvori turu za rutu, trajanje, teren i sadržaj prije izbora.</div></div></div></div>`}
function tourCard(t){const c=CASES[t.caseId],r=c.route;return `<button class="city-tile" data-tour="${t.id}" aria-label="Otvori turu ${t.city}"><div class="city-thumb">${locationArt(t.cover)}</div><div class="city-body"><div class="row" style="gap:6px;margin-bottom:5px"><span class="pill gold">${t.city}</span><span class="pill">${c.checkpoints.length} stanica</span></div><h3>${t.title}</h3><p>${t.copy}</p><div class="city-meta"><span>${t.duration}</span><span>·</span><span>${r.walkDistance}</span><span>·</span><span>${t.level}</span></div></div></button>`}

function vTourDetail(){const t=S.tour,c=currentCase(),r=c.route,preview=[c.checkpoints[0],c.checkpoints[Math.floor(c.checkpoints.length/2)],c.checkpoints[c.checkpoints.length-1]];return `<div class="view"><div class="scroll"><div class="hero-art">${locationArt(t.cover)}<button class="iconbtn" data-back style="position:absolute;left:15px;top:14px;z-index:5">${IC.back}</button><div class="hero-copy"><div class="row" style="gap:7px"><span class="pill gold">${t.city}</span><span class="pill">${t.tag}</span></div><h1>${t.title}</h1><p>${t.copy}</p></div></div><div class="pad"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i></i></div><div class="quick-facts"><div class="quick-fact"><b>${t.duration.split(' ')[0]}</b><span>Minuta</span></div><div class="quick-fact"><b>${r.walkDistance}</b><span>Pješke</span></div><div class="quick-fact"><b>${c.checkpoints.length}</b><span>Stanica</span></div></div><div class="tour-section"><div class="tour-section-title"><h3>Ruta ukratko</h3></div><div class="route-validation">${r.status}</div><div class="card route-preview"><div class="route-preview-main">${preview.map((p,i)=>`<div class="route-preview-line"><div class="dot">${i===0?'START':i===2?'CILJ':'•••'}</div><div><b>${p.name}</b><span>${p.access||'Javni spoljašnji prostor'}</span></div></div>`).join('')}</div><div class="route-preview-actions"><button class="btn ghost" id="showRouteDetails">Svih ${c.checkpoints.length} stanica</button><button class="btn ghost" id="openFullRoute">Navigacija</button></div></div></div><div class="tour-section"><div class="tour-section-title"><h3>Šta te čeka</h3></div><div class="expect-grid"><div class="expect-item"><div class="ico">🧭</div><div><b>Vođena pješačka ruta</b><span>Kompas otkriva tragove postepeno dok se približavaš stvarnim lokacijama.</span></div></div><div class="expect-item"><div class="ico">📜</div><div><b>Priča, činjenice i misterija</b><span>Istorijske činjenice i lokalna predanja jasno su odvojeni od fikcije.</span></div></div><div class="expect-item"><div class="ico">🏴‍☠️</div><div><b>Glavne i bonus misije</b><span>Pet glavnih stanica, sidequestovi, dokazi i događaji tokom hodanja.</span></div></div></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">Teren i pristup</div><div class="ux-note" style="margin-top:6px"><b>${r.terrain}</b><br>${r.access}<br><span style="color:var(--gold-2)">${r.safety}</span></div></div></div></div><div class="sticky-action"><button class="btn primary" id="activateTour">Izaberi ovu turu</button></div></div>`}

function vSetup(){return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 2 od 3</div><h2 class="title">Pripremi posadu</h2></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i></i></div><div class="card gold"><div class="row" style="gap:10px"><div class="avatar">${S.tour.mark}</div><div class="grow"><div class="eyebrow">Izabrana avantura</div><h3 style="font-size:19px;margin-top:2px">${S.tour.city}</h3><div class="faint" style="font-size:10px">${S.tour.title}</div></div><span class="pill good">Spremno</span></div></div><div class="field" style="margin-top:14px"><label>Ime posade</label><input class="input" id="teamName" value="${esc(S.team.name)}" placeholder="Npr. Jadranski vukovi"></div><div class="field"><label>Ime kapetana</label><input class="input" id="captainName" value="${esc(S.team.captain)}" placeholder="Ime osobe koja drži telefon"></div><div class="field"><label>Broj igrača</label><div class="player-select">${[2,3,4,5,6].map(n=>`<button type="button" data-players="${n}" class="${n===S.team.players?'on':''}">${n}</button>`).join('')}</div></div><div class="card"><div class="row" style="gap:10px"><div style="font-size:25px">📱</div><div><b>Jedan glavni telefon</b><div class="ux-note" style="margin-top:2px">Kapetan upravlja aplikacijom, a cijela posada rješava zadatke.</div></div></div></div></div></div><div class="sticky-action"><button class="btn primary" id="saveTeam">Nastavi na provjeru</button></div></div>`}

function vPreflight(){const c=currentCase(),r=c.route;return `<div class="view"><div class="topbar"><button class="iconbtn" data-back>${IC.back}</button><div class="grow"><div class="eyebrow">Korak 3 od 3</div><h2 class="title">Spremni za polazak</h2></div></div><div class="scroll"><div class="pad" style="padding-top:7px"><div class="ux-stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="card paper"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Početna lokacija</div><h2 style="font-size:25px;margin-top:4px">${r.startLabel}</h2><div style="font-size:10.5px;line-height:1.45;margin-top:6px">${r.walkDistance} · ${r.estimatedTime}</div><button class="btn paperbtn" id="openRoutePreflight" style="margin-top:11px">Otvori pješačku navigaciju</button></div><div class="route-summary"><div class="chip"><b>${c.checkpoints.length} stvarnih stanica</b><span>GPS + opažanje lokacije</span></div><div class="chip"><b>${r.terrain}</b><span>Teren</span></div><div class="chip"><b>Bez fizičkih kodova</b><span>Sve radi telefonom</span></div></div><div class="preflight-list" style="margin-top:12px"><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Baterija i GPS</b><div class="ux-note">Preporučeno najmanje 30% baterije i uključena precizna lokacija.</div></div></div><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Pristup ruti</b><div class="ux-note">${r.access}</div></div></div><div class="preflight-item"><div class="ok">✓</div><div class="grow"><b>Bezbjednost terena</b><div class="ux-note">${r.safety}</div></div></div></div><div class="mode-choice"><div class="mode-card"><div class="ico">📍</div><div><b>Uživo na terenu</b><span>Aplikacija prati GPS i automatski mijenja tragove kada se približavaš stanici.</span></div></div><div class="mode-card"><div class="ico">🧪</div><div><b>Test bez odlaska</b><span>Dobijaš alat za simulaciju udaljenosti, dolaska, događaja i svih stanica.</span></div></div></div></div></div><div class="sticky-action dual"><button class="btn primary" id="startGame">Pokreni turu uživo</button><button class="btn ghost" id="startTestGame">Testiraj cijelu turu</button><div class="action-help">Test režim ne troši vaučer i jasno je označen tokom igre.</div></div></div>`}

function vGame(){const c=currentCase(),p=c.checkpoints[S.game.idx];let content='';if(S.game.tab==='story')content=storyView(c,p);if(S.game.tab==='map')content=mapView(p);if(S.game.tab==='evidence')content=evidenceView(c);if(S.game.tab==='side')content=sideView(c);const gps=S.game.gpsStatus||'idle',locText=S.game.arrived?'Na lokaciji':S.game.distance?`${Math.round(S.game.distance)} m do cilja`:'Čekam GPS';return `<div class="view"><div class="game-head"><div class="game-head-main"><div class="game-head-copy"><div class="eyebrow">${c.city} · Poglavlje ${S.game.idx+1}/${c.checkpoints.length}</div><div class="game-title">${p.chapter}</div></div><button class="signal-button" id="signalCenter" aria-label="Kapetanov dnevnik">${IC.bell}${S.game.unread?`<i class="count">${S.game.unread}</i>`:''}</button></div><div class="game-meta-row"><span class="game-meta">⏱ <b id="clock">${formatTime(S.game.elapsed)}</b></span><span class="game-meta">⚓ <b>${S.game.score}</b> pts</span><span class="game-meta location">${gps==='live'?'● ':''}${locText}</span>${S.test&&S.test.enabled?`<button class="test-chip" id="testTools">TEST ALATI</button>`:''}</div><div class="chapterbar">${c.checkpoints.map((_,i)=>`<i class="chapterdot ${i<S.game.idx?'done':i===S.game.idx?'now':''}"></i>`).join('')}</div></div><div class="scroll game-scroll ${S.game.tab==='map'?'map-screen':''}">${content}</div>${gameTabs(S.game.tab)}</div>`}
function storyView(c,p){const bonus=newSideCount(),latest=S.game.notifications[0],status=S.game.arrived?{i:'📍',t:'Lokacija je potvrđena',b:'Pogledaj ilustraciju, pročitaj kontekst i riješi glavni izazov.'}:S.game.gpsStatus==='live'?{i:'🛰️',t:'GPS prati kretanje',b:'Otvori Kompas za udaljenost i trag koji se mijenja u hodu.'}:{i:'🧭',t:'Spremni za prvi trag',b:'Otvori Kompas i pokreni GPS ili koristi test približavanje.'};return `<div class="game-pad"><div class="focus-card"><div class="eyebrow" style="color:var(--gold-2)">${S.game.arrived?'Lokacija pronađena':'Trenutna misija'}</div><h2>${S.game.arrived?p.name:p.chapter}</h2><p>${S.game.arrived?p.arrival:p.far}</p>${S.game.arrived?`<div class="location-visual" style="margin-top:13px">${locationArt(p.art)}<div class="location-caption"><div class="eyebrow">Obrati pažnju</div><div style="font-weight:800;font-size:12px;margin-top:2px">${p.objective}</div></div></div><button class="btn primary main-action" id="openChallenge">Riješi izazov</button>`:`<button class="btn primary main-action" id="openMap">Otvori kompas</button>`}</div><div class="mission-status"><div class="status-icon">${status.i}</div><div><b>${status.t}</b><span>${status.b}</span></div></div>${latest?`<div class="latest-signal" data-signal-id="${latest.id}"><div class="icon">${latest.icon}</div><div class="grow"><div class="signal-kind">Posljednji signal · ${latest.label}</div><b>${latest.title}</b><span>${latest.body}</span></div></div>`:`<div class="story-pulse"><div><b>Kapetanov dnevnik je aktivan</b><span>Prvi signal stiže nakon početka kretanja.</span></div><i class="pulse-dot"></i></div>`}<div class="progress-strip"><div class="item"><b>${S.game.evidence.length}</b><span>Dokazi</span></div><div class="item"><b>${S.game.sideDone.length}</b><span>Bonusi</span></div><div class="item"><b>${S.game.notifications.length}</b><span>Signali</span></div></div>${bonus?`<div class="context-banner" id="openSide"><div class="emoji">🏴‍☠️</div><div class="grow"><b>${bonus===1?'Novi bonus je dostupan':bonus+' nova bonusa su dostupna'}</b><span>Možeš ga riješiti sada ili kasnije.</span></div><span class="pill gold">Otvori</span></div>`:''}</div>`}
function mapView(p){const d=S.game.distance??850,stage=approachStage(d),pct=Math.max(8,Math.min(100,100-d/9)),gps=S.game.gpsStatus||'idle',isTest=!!(S.test&&S.test.enabled),gpsText=gps==='live'?`GPS aktivan${S.game.accuracy?` · preciznost ±${Math.round(S.game.accuracy)} m`:''}`:gps==='waiting'?'Tražim preciznu lokaciju…':gps==='error'?'GPS nije dostupan - provjeri dozvole ili pokušaj ponovo':isTest?'Test režim - koristi TEST ALATE za sve faze':'GPS nije pokrenut';return `<div class="map-wrap"><div id="map" class="map"></div><button class="btn ghost map-route-button" id="showRouteMap">☰ Ruta</button><div class="compass-hud"><div class="row"><div class="grow"><div class="eyebrow" style="color:${stage.color}">${stage.label}</div><div class="distance">${d<=60?'Stigli ste':Math.round(d)+' m'}</div></div><div style="font-size:32px">${stage.icon}</div></div><div class="approach-copy">${stage.copy(p)}</div><div class="heat" style="--w:${pct}%"><i></i></div><div class="compass-actions"><button class="btn primary" id="realLocate">${gps==='live'?'Osvježi GPS':'Pokreni GPS uživo'}</button><div class="secondary">${isTest?'<button class="btn ghost" id="closer">Test približavanje</button>':''}<button class="btn ghost" data-game-tab="story">Nazad na misiju</button></div></div><div class="gps-line"><i class="gps-dot ${gps}"></i><span>${gpsText}</span></div></div></div>`}
function evidenceView(c){return `<div class="game-pad"><div class="row" style="margin-bottom:11px"><div class="grow"><div class="eyebrow">Dosije slučaja</div><h2 style="font-size:25px;margin-top:2px">Pronađeni dokazi</h2></div><span class="pill gold">${S.game.evidence.length}/${c.checkpoints.length}</span></div><div class="evidence-list">${c.checkpoints.map(p=>{const got=S.game.evidence.includes(p.evidence.title);return `<div class="evidence-line ${got?'':'lock'}"><div class="glyph">${got?p.evidence.glyph:'?'}</div><div class="grow"><h4>${got?p.evidence.title:'Još nije pronađeno'}</h4><p>${got?p.evidence.copy:'Ovaj dokaz otključava se završavanjem glavne misije.'}</p></div>${got?'<span class="pill good">✓</span>':''}</div>`}).join('')}</div><div class="ux-note center" style="margin:13px 8px 0">Na kraju ćeš povezati sve dokaze. Nije potrebno da ih pamtiš napamet.</div></div>`}
function sideView(c){const available=c.sidequests.filter(q=>q.unlock<=S.game.idx),later=c.sidequests.filter(q=>q.unlock>S.game.idx);return `<div class="game-pad"><div class="row" style="margin-bottom:10px"><div class="grow"><div class="eyebrow">Dodatni plijen</div><h2 style="font-size:25px;margin-top:2px">Bonus izazovi</h2></div><span class="pill gold">${S.game.sideDone.length}/${c.sidequests.length}</span></div><div class="bonus-intro">Bonusi nijesu obavezni. Možeš ih završiti bilo kada dok traje hunt i svaki donosi dodatne poene.</div><div class="bonus-section-title">Dostupno sada</div>${available.map(q=>{const done=S.game.sideDone.includes(q.id);return `<div class="side-card ${done?'done':'new'}"><div class="row"><div class="grow"><div class="eyebrow">${done?'Završeno':q.type==='photo'?'Fotografija':q.type==='audio'?'Audio':'Brzi zadatak'}</div><h4>${q.title}</h4></div><div class="side-score">+${q.points}</div></div><p>${q.copy}</p>${!done?`<button class="btn ghost" data-side="${q.id}" style="margin-top:10px">${q.type==='photo'?'Dodaj fotografiju':q.type==='audio'?'Snimi audio':'Označi kao završeno'}</button>`:`<div class="pill good" style="margin-top:9px">✓ Poeni dodati</div>`}</div>`}).join('')||'<div class="ux-note">Nema dostupnih bonusa u ovom poglavlju.</div>'}${later.length?`<div class="bonus-section-title">Otključava se kasnije</div><div class="ux-note">Još ${later.length} ${later.length===1?'izazov':'izazova'} pojaviće se kako napreduješ kroz priču.</div>`:''}</div>`}

function vFinale(){const c=currentCase(),max=c.checkpoints.reduce((a,p)=>a+p.points,0)+c.sidequests.reduce((a,q)=>a+q.points,0);return `<div class="view"><div class="scroll"><div class="pad safe" style="padding-top:45px"><div class="final-seal">⚓</div><div class="center"><div class="eyebrow" style="color:var(--green);margin-top:19px">Slučaj zatvoren</div><h1 style="font-size:34px;margin-top:5px">Plijen je vaš.</h1><div class="dim" style="font-size:12.5px;line-height:1.5;margin:8px auto 17px;max-width:330px">${finalCopy(c.id)}</div></div><div class="metrics"><div class="metric"><div class="v">${S.game.score}</div><div class="l">Poena</div></div><div class="metric"><div class="v">${S.game.evidence.length}/${c.checkpoints.length}</div><div class="l">Dokazi</div></div><div class="metric"><div class="v">${S.game.sideDone.length}</div><div class="l">Bonusi</div></div></div><div class="card paper" style="margin-top:15px"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Šta je bilo stvarno?</div><h3 style="font-size:22px;margin-top:5px">Istorija i fikcija</h3><div style="font-size:11.5px;line-height:1.5;margin-top:6px">${c.facts}</div><div class="source-note">${c.sourceNote||''}</div><div class="rope"></div><div style="font-size:11px">Rezultat: <b>${Math.round(S.game.score/max*100)}%</b> ukupnog mogućeg plijena.</div></div><button class="btn primary" id="restart" style="margin-top:14px">Vrati se na početak</button></div></div></div>`}
function finalCopy(id){return (CASES[id]&&CASES[id].finale)||'Slučaj je zatvoren.'}

function vAdmin(){let content='';if(S.adminTab==='dashboard')content=adminDashboard();if(S.adminTab==='tours')content=adminTours();if(S.adminTab==='vouchers')content=adminVouchers();if(S.adminTab==='events')content=adminEvents();if(S.adminTab==='live')content=adminLive();if(S.adminTab==='test')content=adminTest();return `<div class="view"><div class="topbar"><div class="grow"><div class="eyebrow">Montenegro Treasure Hunt</div><h2 class="title">Admin kontrola</h2></div><button class="btn ghost mini" id="backPlayer">Igrač</button></div><div class="scroll"><div class="pad" style="padding-top:5px">${adminTabs()}${content}</div></div></div>`}

function validateVoucher(){const raw=($('#voucherInput')?.value||'').trim().toUpperCase();const v=VOUCHERS[raw];if(!v){toast('Kod nije pronađen. Provjerite slova i brojeve.');return}if(v.status==='used'){toast('Ovaj vaučer je već iskorišćen.');return}S.voucher={...v};S.history=[];nav('voucher')}
function startGame(mode='live',fromAdmin=false){stopLocationWatch();SIGNAL_QUEUE=[];SIGNAL_BUSY=false;if(!fromAdmin&&mode==='live'&&S.voucher){S.voucher.status='used';if(VOUCHERS[S.voucher.code])VOUCHERS[S.voucher.code].status='used'}S.test={enabled:mode!=='live'||fromAdmin,mode,fromAdmin};S.game={idx:0,score:0,hints:0,evidence:[],elapsed:0,tab:'explore',distance:850,arrived:false,sideDone:[],locationShown:false,notifications:[],unread:0,eventsSeen:{},decisions:{},lastStage:'far',gpsStatus:mode==='live'?'waiting':'idle',accuracy:null,arrivalHits:0};nav('game');clearInterval(TIMER);clearInterval(EVENT_TIMER);TIMER=setInterval(()=>{S.game.elapsed++;const c=$('#clock');if(c)c.textContent=formatTime(S.game.elapsed)},1000);EVENT_TIMER=setInterval(()=>deliverAmbientEvent(),18000);setTimeout(()=>checkpointSignal('start'),1800);setTimeout(()=>deliverAmbientEvent(),9000);setTimeout(()=>notifyNewSidequests(),13500);if(mode==='live')setTimeout(startLocationWatch,700)}

function simulateCloser(){const steps=[850,420,175,48],old=stageKey(S.game.distance);let i=steps.findIndex(v=>v===S.game.distance);if(i<0)i=steps.findIndex(v=>v<S.game.distance)-1;S.game.distance=steps[Math.min(Math.max(i+1,0),steps.length-1)];const next=stageKey(S.game.distance);S.game.gpsStatus='idle';if(S.game.distance<=60)arriveAtCurrent(true);else{vibrate(20);render();if(next!==old)setTimeout(()=>checkpointSignal(next),120)}S.game.lastStage=next}

function distance(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function initMap(){const c=currentCase(),p=c.checkpoints[S.game.idx],d=S.game.distance,mapEl=$('#map');if(!mapEl)return;if(typeof L==='undefined'){mapEl.innerHTML=`<div class="map-fallback"><div class="map-fallback-card"><div class="eyebrow">Offline pregled rute</div><h3 style="font-size:23px;margin-top:4px">${p.name}</h3><div class="ux-note" style="margin-top:5px">Mapa sa pločicama nije učitana, ali GPS, kompas i cijela igra ostaju dostupni.</div><div class="map-fallback-route">${c.checkpoints.map((_,i)=>`<i class="${i<S.game.idx?'done':i===S.game.idx?'now':''}"></i>`).join('')}</div><div class="ux-note" style="margin-top:10px">Stanica ${S.game.idx+1}/${c.checkpoints.length} · ${Math.round(d)} m</div></div></div>`;return}try{const pts=c.checkpoints.map(x=>[x.lat,x.lng]);MAP=L.map('map',{zoomControl:false,attributionControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(MAP);const line=L.polyline(pts,{color:'#c99a45',weight:3,opacity:.72,dashArray:'7 7'}).addTo(MAP);c.checkpoints.forEach((x,i)=>{const cls=i<S.game.idx?'done':i===S.game.idx?'active':'';const ic=L.divIcon({className:'',html:`<div class="route-pin ${cls}">${i+1}</div>`,iconSize:i===S.game.idx?[32,32]:[26,26],iconAnchor:i===S.game.idx?[16,16]:[13,13]});L.marker([x.lat,x.lng],{icon:ic}).addTo(MAP).bindTooltip(`${i+1}. ${x.name}`,{direction:'top',offset:[0,-10]})});const playerLat=p.lat-(Math.max(d,70)/111000),playerLng=p.lng-.0015;L.circleMarker([playerLat,playerLng],{radius:8,color:'#5fb8b5',weight:3,fillColor:'#5fb8b5',fillOpacity:1}).addTo(MAP).bindTooltip('Vaša približna pozicija');if(d<=500)L.circle([p.lat,p.lng],{radius:d>200?180:85,color:'#c99a45',weight:1,fillColor:'#c99a45',fillOpacity:.07,dashArray:'5 7'}).addTo(MAP);MAP.fitBounds(line.getBounds(),{padding:[42,42]});if(d<=200)MAP.setView([p.lat,p.lng],17);setTimeout(()=>MAP.invalidateSize(),130)}catch(e){mapEl.innerHTML='<div class="map-fallback"><div class="map-fallback-card"><b>Mapa trenutno nije d function openChallenge(){const p=currentCase().checkpoints[S.game.idx];const ov=document.createElement('div');ov.className='overlay';const body=p.type==='text'?`<input class="input code" id="answerText" placeholder="UPIŠI ODGOVOR" style="margin-top:13px" autocomplete="off">`:`<div style="margin-top:13px">${p.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`;ov.innerHTML=`<div class="sheet"><div class="sheet-handle"><div class="grab"></div></div><div class="sheet-head"><div class="eyebrow">Izazov ${S.game.idx+1}/${currentCase().checkpoints.length} · ${p.points} poena</div><h3 class="challenge-title" style="margin-top:4px">${p.name}</h3></div><div class="sheet-body"><div class="challenge-question">${p.question}</div>${body}<div id="challengeFeedback" style="margin-top:9px"></div></div><div class="sheet-actions"><button class="btn primary" id="submitAnswer">Potvrdi odgovor</button><div class="row" style="gap:8px"><button class="btn ghost" id="useHint">Hint -25</button><button class="btn ghost" id="closeChallenge">Vrati se</button></div></div></div>`;$('#phone').appendChild(ov);let picked=null;$$('[data-choice]',ov).forEach(x=>x.onclick=()=>{$$('[data-choice]',ov).forEach(y=>y.classList.remove('pick'));x.classList.add('pick');picked=+x.dataset.choice});$('#closeChallenge',ov).onclick=()=>ov.remove();$('#useHint',ov).onclick=()=>{S.game.hints++;S.game.score=Math.max(0,S.game.score-25);toast(p.hint)};$('#submitAnswer',ov).onclick=()=>{let ok=p.type==='text'?([p.answer,...(p.accept||[])].map(normalizeAnswer).includes(normalizeAnswer($('#answerText',ov).value))):picked===p.answer;const f=$('#challengeFeedback',ov);if(!ok){f.className='feedback bad';f.textContent='Nije tačno. Pogledaj detalj na lokaciji i pokušaj ponovo.';vibrate(30);return}f.className='feedback good';f.textContent=`Dokaz pronađen. +${p.points} poena`;S.game.score+=p.points;if(!S.game.evidence.includes(p.evidence.title))S.game.evidence.push(p.evidence.title);vibra function showEvidenceFound(p){const ov=document.createElement('div');ov.className='overlay center';ov.innerHTML=`<div class="sheet"><div class="sheet-handle"><div class="grab"></div></div><div class="sheet-body center"><div style="font-size:46px">${p.evidence.glyph}</div><div class="eyebrow" style="color:var(--green);margin-top:7px">Dokaz pronađen</div><h3 style="font-size:27px;margin-top:3px">${p.evidence.title}</h3><div class="reveal-copy">${p.evidence.copy}</div>${p.signals&&p.signals.after?`<div class="card gold" style="margin-top:12px;text-align:left"><div class="eyebrow" style="color:var(--gold-2)">Šta ovo mijenja?</div><div style="font-size:11px;line-height:1.45;margin-top:4px">${p.signals.after.body}</div></div>`:''}<div class="card paper" style="margin-top:12px;text-align:left"><div class="eyebrow" style="color:rgba(29,33,30,.54)">Istorijski trag</div><div style="font-size:11px;line-height:1.42;margin-top:4px">${p.fact}</div></div></div><div class="sheet-actions"><button class="btn primary" id="continueStory">${S.game.idx===currentCase().checkpoints.length-1?'Završi slučaj':'Sljedeći trag'}</button></div></div>`;$('#phone').appendChild(ov);$('#continueStory',ov).onclick=()=>{ov.remove();checkpointSignal('after',true);if(S.game.idx===currentCase().checkpoints.length-1){stopLocationWatch();clearInterval(TIMER);clearInterval(EVENT_TIMER);confetti();setTimeout(()=>nav('finale'),450)}else{S.game.idx++;S.game.distance=850;S.game.arrived=false;S.game.locationShown=false;S.game.arrivalHits=0;S.game.tab='explore';S.game.lastStage='far';render();setTimeout(()=>checkpointSignal('start'),1200);setTimeout(()=>deliverAmbientEvent(),9000);setTimeout(()=>notifyNewSidequests(),13500)}}}

function stageKey(d){if(d>500)return'far';if(d>200)return'near';if(d>60)return'close';return'arrival'}
function approachStage(d){if(d>500)return{key:'far',label:'Daleki trag',icon:'🧭',color:'var(--sea)',copy:p=>p.far};if(d>200)return{key:'near',label:'Pravi smjer',icon:'🌊',color:'var(--gold-2)',copy:p=>p.near};if(d>60)return{key:'close',label:'Vrlo blizu',icon:'🔥',color:'#ef8b55',copy:p=>p.close};return{key:'arrival',label:'Lokacija potvrđena',icon:'📍',color:'var(--green)',copy:p=>p.arrival}}
function stopLocationWatch(){if(GEO_WATCH!==null&&navigator.geolocation){try{navigator.geolocation.clearWatch(GEO_WATCH)}catch(e){}}GEO_WATCH=null;if(S.game)S.game.gpsStatus='idle'}
function startLocationWatch(){if(!navigator.geolocation){S.game.gpsStatus='error';toast('GPS nije dostupan. Test režim i dalje radi.');render();return}if(GEO_WATCH!==null){realLocate();return}S.game.gpsStatus='waiting';render();GEO_WATCH=navigator.geolocation.watchPosition(handlePosition,err=>{S.game.gpsStatus='error';S.game.gpsError=err&&err.message||'Lokacija nije dostupna';render();if(S.test&&S.test.enabled)setTimeout(()=>toast('GPS nije dostupan - nastavi kroz TEST ALATE.'),250)},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function handlePosition(pos){if(S.view!=='game')return;const p=currentCase().checkpoints[S.game.idx],d=distance(pos.coords.latitude,pos.coords.longitude,p.lat,p.lng),old=stageKey(S.game.distance);S.game.distance=Math.round(d);S.game.accuracy=pos.coords.accuracy;S.game.gpsStatus='live';const next=stageKey(d);if(next!==old){checkpointSignal(next);S.game.lastStage=next}if(d<=Math.max(p.radius,55)&&pos.coords.accuracy<=100){S.game.arrivalHits=(S.game.arrivalHits||0)+1;if(S.game.arrivalHits>=2)arriveAtCurrent()}else S.game.arrivalHits=0;render()}
function arriveAtCurrent(force=false){if(S.game.arrived)return;S.game.arrived=true;S.game.distance=Math.min(S.game.distance||40,40);S.game.tab='explore';S.game.locationShown=true;vibrate([35,55,120]);render();setTimeout(()=>{checkpointSignal('arrival',true);showLocationReveal()},180)}
function signalChime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(720,a.currentTime);o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.12);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.055,a.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2);setTimeout(()=>a.close(),300)}catch(e){}}
function checkpointSignal(stage,silent=false){if(S.view!=='game')return;const c=currentCase(),p=c.checkpoints[S.game.idx],raw=p.signals&&p.signals[stage];if(!raw)return;const item={...raw,id:`${c.id}-cp${S.game.idx}-${stage}`};pushSignal(item,{silent})}
function deliverAmbientEvent(force=false){if(S.view!=='game'||S.game.arrived)return;const c=currentCase(),pool=(c.events||[]).filter(e=>e.minIdx<=S.game.idx&&!S.game.eventsSeen[e.id]);if(!pool.length)return;if(!force&&(document.querySelector('.overlay')||document.querySelector('.signal-toast'))){SIGNAL_QUEUE.push(pool[0]);return}pushSignal(pool[0])}
function pushSignal(item,opts={}){if(!item||!item.id||S.game.eventsSeen[item.id])return;S.game.eventsSeen[item.id]=true;const entry={...item,time:S.game.elapsed};S.game.notifications.unshift(entry);S.game.unread++;if(!opts.silent){if(document.querySelector('.overlay')||document.querySelector('.signal-toast'))SIGNAL_QUEUE.push(entry);else{vibrate(18);signalChime();showSignalToast(entry)}}const badge=document.querySelector('#signalCenter .count');if(badge)badge.textContent=S.game.unread}
function showSignalToast(item){if(S.view!=='game'||document.querySelector('.overlay')){SIGNAL_QUEUE.push(item);return}document.querySelectorAll('.signal-toast').forEach(x=>x.remove());SIGNAL_BUSY=true;const el=document.createElement('div');el.className='signal-toast '+(S.game.tab==='map'?'map-mode':'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.dataset.signalId=item.id;el.innerHTML=`<div class="si">${item.icon||'📜'}</div><div class="grow"><div class="sl">${item.label||'Novi signal'}</div><div class="st">${item.title}</div><div class="sb">${item.body}</div><div style="font-size:8px;color:var(--cream-48);margin-top:4px">Dodirni za detalje · ostaje u dnevniku</div></div>`;$('#phone').appendChild(el);const done=()=>{if(!el.isConnected)return;el.remove();SIGNAL_BUSY=false;setTimeout(flushSignalQueue,400)};el.onclick=()=>{el.remove();SIGNAL_BUSY=false;openSignalDetail(item.id)};setTimeout(done,Math.min(7200,4300+String(item.body||'').length*16))}

function currentDeduction(c){if(!S.game.evidence.length)return 'Još nema potvrđenih dokaza. Prva stanica treba da utvrdi početni pravac priče.';const idx=Math.max(0,S.game.idx-(S.game.arrived?0:1));return c.checkpoints[Math.min(idx,c.checkpoints.length-1)].deduction||'Istraga napreduje.'}

vGame=function(){const c=currentCase(),p=c.checkpoints[S.game.idx],a=c.arc||{},tab=S.game.tab||'explore';let content=tab==='explore'?exploreView(c,p):tab==='case'?caseView(c,a):sideView(c);const gps=S.game.gpsStatus||'idle';return `<div class="view game-v2"><header class="game-head v2"><div class="game-head-main"><div class="game-head-copy"><div class="eyebrow">${c.city} · ${S.game.idx+1}/${c.checkpoints.length}</div><div class="game-title">${p.chapter}</div></div><button class="signal-button" id="signalCenter" aria-label="Kapetanov dnevnik">${IC.bell}${S.game.unread?`<i class="count">${S.game.unread}</i>`:''}</button></div><div class="game-meta-row"><span class="game-meta">⏱ <b id="clock">${formatTime(S.game.elapsed)}</b></span><span class="game-meta">⚓ <b>${S.game.score}</b> pts</span><span class="game-meta location"><i class="gps-dot ${gps}"></i><b id="headerDistance">${S.game.arrived?'Na lokaciji':Math.round(S.game.distance||0)+' m'}</b></span>${S.test&&S.test.enabled?`<button class="test-chip" id="testTools">TEST</button>`:''}</div><div class="chapterbar">${c.checkpoints.map((_,i)=>`<i class="chapterdot ${i<S.game.idx?'done':i===S.game.idx?'now':''}"></i>`).join('')}</div></header><main class="game-scroll v2 ${tab==='explore'?'explore-screen':''}">${content}</main>${gameTabs(tab)}</div>`}

function exploreView(c,p){const d=S.game.distance??850,stage=approachStage(d),gps=S.game.gpsStatus||'idle',arr=S.game.arrived,bonus=newSideCount();return `<div class="explore-layout"><div class="live-map-shell"><div id="map" class="map live-map"></div><div class="map-top-actions"><button class="map-pill" id="showRouteMap">${IC.map}<span>Cijela ruta</span></button><button class="map-pill" id="externalNav">↗<span>Navigacija</span></button></div><div class="map-stage-badge" style="--stage:${stage.color}"><span id="stageIcon">${arr?'📍':stage.icon}</span><div><b id="stageLabel">${arr?'Lokacija pronađena':stage.label}</b><small id="gpsLine">${gps==='live'?(S.game.accuracy?'GPS ±'+Math.round(S.game.accuracy)+' m':'GPS aktivan'):gps==='waiting'?'Tražim lokaciju…':gps==='error'?'GPS nije dostupan':'GPS nije pokrenut'}</small></div></div></div><section class="mission-sheet-inline"><div class="mission-grip"></div><div class="mission-heading"><div><div class="eyebrow">${arr?'Stigli ste':'Aktivna stanica'}</div><h2>${arr?p.name:p.chapter}</h2></div><span class="stop-count">${S.game.idx+1}/${c.checkpoints.length}</span></div><p class="mission-copy" id="approachCopy">${arr?p.arrival:stage.copy(p)}</p>${arr?`<div class="arrival-action-card"><div class="arrival-art">${locationArt(p.art)}</div><div class="arrival-task"><div class="eyebrow">Sada uradi ovo</div><b>${p.objective}</b></div></div><button class="btn primary" id="openChallenge">Otvori izazov</button>`:`<div class="distance-block"><div><span>Udaljenost</span><b id="distanceValue">${Math.round(d)} m</b></div><div class="heat compact" style="--w:${Math.max(8,Math.min(100,100-d/9))}%"><i id="heatFill"></i></div></div><div class="primary-route-actions"><button class="btn primary" id="realLocate">${gps==='live'?'Osvježi GPS':'Pokreni GPS'}</button>${S.test&&S.test.enabled?'<button class="btn ghost" id="closer">Približi me</button>':''}</div>`}<div class="deduction-card"><div class="eyebrow">Šta trenutno znamo</div><p>${currentDeduction(c)}</p></div>${bonus?`<button class="bonus-inline" id="openSide"><span>🏴‍☠️</span><div><b>${bonus} ${bonus===1?'novi bonus':'nova bonusa'}</b><small>Opcionalno - ne prekida glavnu priču</small></div><i>→</i></button>`:''}</section></div>`}

function caseView(c,a){const steps=a.steps||c.checkpoints.map(x=>x.chapter);return `<div class="game-pad case-file-v2"><section class="case-hero"><div class="eyebrow">Dosije ${c.caseNo}</div><h2>${c.title}</h2><p>${a.premise||c.briefing}</p><div class="case-question"><span>?</span><div><b>Glavno pitanje</b><small>${a.question||''}</small></div></div></section><section class="logic-spine"><div class="section-head"><h3>Logika slučaja</h3><span class="pill gold">${S.game.evidence.length}/${c.checkpoints.length}</span></div><div class="logic-track">${steps.map((x,i)=>`<div class="logic-step ${i<S.game.evidence.length?'done':i===S.game.idx?'active':''}"><i>${i<S.game.evidence.length?'✓':i+1}</i><span>${x}</span></div>`).join('')}</div></section><section class="known-section"><div class="section-head"><h3>Pronađeni dokazi</h3></div>${c.checkpoints.map((p,i)=>{const got=S.game.evidence.includes(p.evidence.title),active=i===S.game.idx;return `<div class="case-beat ${got?'done':active?'active':'locked'}"><i>${got?'✓':i+1}</i><div><b>${got?p.evidence.title:p.chapter}</b><span>${got?(p.deduction||p.evidence.copy):active?'Ovo je trenutna stanica.':'Otključava se kasnije.'}</span></div></div>`}).join('')}</section><section class="truth-card ${S.game.evidence.length===c.checkpoints.length?'open':''}"><div class="eyebrow">Konačni odgovor</div><h3>${S.game.evidence.length===c.checkpoints.length?'Slučaj riješen':'Još nije moguće zaključiti'}</h3><p>${S.game.evidence.length===c.checkpoints.length?(a.truth||c.finale):'Završi svih pet stanica. Svaki dokaz mora popuniti jedan korak u logici slučaja.'}</p></section><div class="fiction-note"><b>Istorija i fikcija</b><span>${a.fictionNote||c.facts}</span></div></div>`}

function routeSvgMap(c,activeIndex=0,player=null){const pts=c.checkpoints||[];if(!pts.length)return'';const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs),pad=.0004,dx=Math.max(maxLng-minLng,pad),dy=Math.max(maxLat-minLat,pad);const xy=p=>({x:50+(p.lng-minLng)/dx*540,y:330-(p.lat-minLat)/dy*260});const path=pts.map((p,i)=>{const q=xy(p);return`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`}).join(' ');const marks=pts.map((p,i)=>{const q=xy(p),state=i<activeIndex?'done':i===activeIndex?'active':'';return`<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})"><circle r="${i===activeIndex?18:14}" fill="${i<activeIndex?'#3c8f73':i===activeIndex?'#d0a24f':'#20353b'}" stroke="#f4ead4" stroke-opacity=".35" stroke-width="2"/><text text-anchor="middle" dominant-baseline="central" fill="${i===activeIndex?'#211504':'#f4ead4'}" font-size="11" font-weight="800">${i+1}</text></g>`}).join('');let playerMark='';if(player&&Number.isFinite(player.lat)&&Number.isFinite(player.lng)){const q=xy(player);playerMark=`<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})"><circle r="11" fill="#3db6b0" stroke="#fff" stroke-width="3"/><circle r="18" fill="none" stroke="#3db6b0" stroke-opacity=".35" stroke-width="3"/></g>`}return`<div class="local-route-map"><svg viewBox="0 0 640 380" role="img" aria-label="Lokalni prikaz rute"><defs><linearGradient id="seaMap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b32"/><stop offset="1" stop-color="#07171c"/></linearGradient><pattern id="gridMap" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#f4ead4" stroke-opacity=".04"/></pattern></defs><rect width="640" height="380" rx="20" fill="url(#seaMap)"/><rect width="640" height="380" rx="20" fill="url(#gridMap)"/><path d="M0 280 Q120 235 220 285 T450 270 T640 300 V380H0Z" fill="#0b3b45" opacity=".7"/><path d="${path}" fill="none" stroke="#d0a24f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/>${marks}${playerMark}<text x="30" y="34" fill="#efd18b" font-family="Manrope, sans-serif" font-size="12" font-weight="800">${c.city.toUpperCase()} · ${pts.length} STANICA</text><text x="30" y="354" fill="#f4ead4" fill-opacity=".55" font-family="Manrope, sans-serif" font-size="10">Offline prikaz rute - ulična mapa će se pojaviti kada je mreža dostupna.</text></svg></div>`}

async function initPreviewMap(id,c,focusStart=false){const el=document.getElementById(id);if(!el)return;el.innerHTML='<div class="map-fallback"><div class="map-fallback-card"><b>Učitavanje mape…</b></div></div>';const loaded=await loadLeaflet();if(!loaded||!window.L){el.innerHTML=routeSvgMap(c,focusStart?0:0);return}try{if(MAP){try{MAP.remove()}catch(e){}}const pts=c.checkpoints.map(p=>[p.lat,p.lng]);MAP=L.map(id,{zoomControl:true,attributionControl:true,preferCanvas:true,scrollWheelZoom:false,tap:true});L.tileLayer(MTH_CONFIG.MAP_TILE_URL,{maxZoom:19,attribution:MTH_CONFIG.MAP_ATTRIBUTION}).addTo(MAP);const line=L.polyline(pts,{color:'#d0a24f',weight:4,opacity:.9}).addTo(MAP);c.checkpoints.forEach((p,i)=>{const ic=L.divIcon({className:'',html:`<div class="route-pin ${i===0?'active':''}">${i+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]});L.marker([p.lat,p.lng],{icon:ic}).addTo(MAP).bindTooltip(`${i+1}. ${p.name}`,{direction:'top',offset:[0,-10]})});if(focusStart){L.circle([c.checkpoints[0].lat,c.checkpoints[0].lng],{radius:c.checkpoints[0].radius||40,color:'#d0a24f',fillColor:'#d0a24f',fillOpacity:.1}).addTo(MAP);MAP.setView(pts[0],17)}else MAP.fitBounds(line.getBounds(),{padding:[34,34]});setTimeout(()=>MAP&&MAP.invalidateSize(),120)}catch(e){el.innerHTML=routeSvgMap(c,focusStart?0:0)}}

initMap=async function(){const c=currentCase(),p=c.checkpoints[S.game.idx],d=S.game.distance,mapEl=$('#map');if(!mapEl)return;mapEl.innerHTML='<div class="map-fallback"><div class="map-fallback-card"><b>Učitavanje mape…</b></div></div>';const loaded=await loadLeaflet();if(!loaded||!window.L){mapEl.innerHTML=routeSvgMap(c,S.game.idx,S.game.lastPosition);return}try{const pts=c.checkpoints.map(x=>[x.lat,x.lng]);MAP=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true,scrollWheelZoom:false});L.tileLayer(MTH_CONFIG.MAP_TILE_URL,{maxZoom:19,attribution:MTH_CONFIG.MAP_ATTRIBUTION}).addTo(MAP);ROUTE_LAYER=L.polyline(pts,{color:'#d0a24f',weight:4,opacity:.78}).addTo(MAP);c.checkpoints.forEach((x,i)=>{const cls=i<S.game.idx?'done':i===S.game.idx?'active':'';const ic=L.divIcon({className:'',html:`<div class="route-pin ${cls}">${i+1}</div>`,iconSize:i===S.game.idx?[34,34]:[28,28],iconAnchor:i===S.game.idx?[17,17]:[14,14]});L.marker([x.lat,x.lng],{icon:ic}).addTo(MAP).bindTooltip(`${i+1}. ${x.name}`,{direction:'top',offset:[0,-10]})});TARGET_RING=L.circle([p.lat,p.lng],{radius:Math.max(p.radius||35,35),color:'#d0a24f',weight:2,fillColor:'#d0a24f',fillOpacity:.11}).addTo(MAP);if(S.game.lastPosition){PLAYER_MARKER=L.circleMarker([S.game.lastPosition.lat,S.game.lastPosition.lng],{radius:9,color:'#fff',weight:3,fillColor:'#3db6b0',fillOpacity:1}).addTo(MAP).bindTooltip('Vaša pozicija');const bounds=L.latLngBounds([[S.game.lastPosition.lat,S.game.lastPosition.lng],[p.lat,p.lng]]);MAP.fitBounds(bounds,{padding:[70,70],maxZoom:17})}else{MAP.fitBounds(ROUTE_LAYER.getBounds(),{padding:[42,42]});if(d<=250)MAP.setView([p.lat,p.lng],17)}setTimeout(()=>MAP&&MAP.invalidateSize(),120)}catch(e){mapEl.innerHTML=routeSvgMap(c,S.game.idx,S.game.lastPosition)}}

function updateExploreHud(){if(S.view!=='game'||S.game.tab!=='explore')return;const p=currentCase().checkpoints[S.game.idx],d=S.game.distance??850,stage=approachStage(d);const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val};set('headerDistance',S.game.arrived?'Na lokaciji':Math.round(d)+' m');set('distanceValue',Math.round(d)+' m');set('stageLabel',S.game.arrived?'Lokacija pronađena':stage.label);set('stageIcon',S.game.arrived?'📍':stage.icon);set('approachCopy',S.game.arrived?p.arrival:stage.copy(p));set('gpsLine',S.game.gpsStatus==='live'?(S.game.accuracy?'GPS ±'+Math.round(S.game.accuracy)+' m':'GPS aktivan'):S.game.gpsStatus==='waiting'?'Tražim lokaciju…':S.game.gpsStatus==='error'?'GPS nije dostupan':'GPS nije pokrenut');const h=document.querySelector('.heat.compact');if(h)h.style.setProperty('--w',Math.max(8,Math.min(100,100-d/9))+'%')}

handlePosition=function(pos){if(S.view!=='game')return;const p=currentCase().checkpoints[S.game.idx],d=distance(pos.coords.latitude,pos.coords.longitude,p.lat,p.lng),old=stageKey(S.game.distance);S.game.lastPosition={lat:pos.coords.latitude,lng:pos.coords.longitude,at:Date.now()};S.game.distance=Math.round(d);S.game.accuracy=pos.coords.accuracy;S.game.gpsStatus='live';const next=stageKey(d);if(PLAYER_MARKER&&MAP)PLAYER_MARKER.setLatLng([pos.coords.latitude,pos.coords.longitude]);if(MAP&&d<500){const b=L.latLngBounds([[pos.coords.latitude,pos.coords.longitude],[p.lat,p.lng]]);MAP.fitBounds(b,{padding:[70,70],maxZoom:17,animate:true,duration:.5})}if(next!==old){checkpointSignal(next);S.game.lastStage=next}const allowed=Math.max(p.radius,Math.min(85,(pos.coords.accuracy||50)*1.15));if(d<=allowed&&pos.coords.accuracy<=120){S.game.arrivalHits=(S.game.arrivalHits||0)+1;if(S.game.arrivalHits>=2)return arriveAtCurrent()}else S.game.arrivalHits=0;updateExploreHud();persistState()}

simulateCloser=function(){const steps=[850,420,175,48],old=stageKey(S.game.distance);let idx=steps.findIndex(v=>v===S.game.distance);if(idx<0)idx=steps.findIndex(v=>v<S.game.distance)-1;S.game.distance=steps[Math.min(Math.max(idx+1,0),steps.length-1)];const next=stageKey(S.game.distance);S.game.gpsStatus='idle';if(S.game.distance<=60)arriveAtCurrent(true);else{vibrate(20);updateExploreHud();if(MAP){const p=currentCase().checkpoints[S.game.idx];MAP.setView([p.lat,p.lng],next==='close'?18:16,{animate:true})}if(next!==old)setTimeout(()=>checkpointSignal(next),120)}S.game.lastStage=next;persistState()}

arriveAtCurrent=function(force=false){if(S.game.arrived)return;S.game.arrived=true;S.game.distance=Math.min(S.game.distance||40,40);S.game.tab='explore';S.game.locationShown=true;vibrate([35,55,120]);render();setTimeout(()=>{checkpointSignal('arrival',true)},180)}
