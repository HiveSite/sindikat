<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07171d">
  <link rel="stylesheet" href="admin.css?v=22">
  <link rel="stylesheet" href="admin-ux.css?v=22">
  <title>Montenegro Treasure Hunt - Admin</title>
  <style>
    html,body{min-height:100%;margin:0;background:#07171d;color:#eef7f7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #admin-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,#12313a 0,#07171d 45%,#041014 100%)}
    #admin-gate[hidden],#admin-app[hidden]{display:none!important}
    .simple-login,.boot-card{width:min(440px,100%);padding:32px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(9,30,36,.94);box-shadow:0 28px 80px rgba(0,0,0,.42)}
    .simple-login .mark,.boot-card .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#d8b56a;color:#07171d;font-size:24px;font-weight:900;margin-bottom:22px}
    .simple-login small,.boot-card small{display:block;color:#8ca8ad;font-size:11px;letter-spacing:.16em;font-weight:800;margin-bottom:8px}
    .simple-login h1,.boot-card h1{margin:0 0 8px;font-size:30px;line-height:1.08}.simple-login p,.boot-card p{margin:0 0 24px;color:#a9bec2;line-height:1.55}
    .simple-login label{display:block;margin-bottom:8px;font-size:13px;font-weight:800}.simple-login input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.15);background:#071a20;color:#fff;border-radius:14px;padding:15px 16px;font-size:16px;outline:none}.simple-login input:focus{border-color:#d8b56a;box-shadow:0 0 0 3px rgba(216,181,106,.13)}
    .simple-login button,.boot-card button{width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px 18px;background:#d8b56a;color:#07171d;font-size:15px;font-weight:900;cursor:pointer}.simple-login button:disabled{opacity:.55;cursor:wait}
    #gate-error{min-height:22px;margin:13px 0 0;color:#ff9b9b;font-size:13px}
    .admin-boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 15%,#102c34 0,#07171d 46%,#041014 100%)}
    .boot-spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#d8b56a;animation:mthspin .8s linear infinite;margin:6px 0 22px}@keyframes mthspin{to{transform:rotate(360deg)}}
    .boot-card.error{border-color:rgba(255,140,132,.35)}.boot-card.error .mark{background:#7c3732;color:#fff}.boot-error{padding:12px;border-radius:12px;background:#071a20;color:#ffb3ad;font-size:13px;line-height:1.5;word-break:break-word}.boot-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.boot-actions button.secondary{background:#15333a;color:#eef7f7;border:1px solid rgba(255,255,255,.12)}
  </style>
</head>
<body>
  <section id="admin-gate">
    <form id="simple-login" class="simple-login" autocomplete="off">
      <div class="mark">◇</div>
      <small>MONTENEGRO TREASURE HUNT</small>
      <h1>Event Control Center</h1>
      <p>Unesi admin lozinku za pristup programima, timovima, GPS-u i sadržaju igre.</p>
      <label for="simple-password">Lozinka</label>
      <input id="simple-password" type="password" autocomplete="current-password" required autofocus>
      <button id="simple-submit" type="submit">Otvori kontrolni centar</button>
      <div id="gate-error" role="alert"></div>
    </form>
  </section>

  <div id="admin-app" hidden></div>
  <div id="admin-toast" class="toast" role="status"></div>

  <script>
  (() => {
    const KEY = 'mth_simple_admin_password';
    const nativeFetch = window.fetch.bind(window);
    const gate = document.querySelector('#admin-gate');
    const root = document.querySelector('#admin-app');
    const form = document.querySelector('#simple-login');
    const input = document.querySelector('#simple-password');
    const submit = document.querySelector('#simple-submit');
    const error = document.querySelector('#gate-error');
    let moduleLoaded = false;
    let booting = false;

    const reply = (status, data) => Promise.resolve(new Response(JSON.stringify(data), {
      status,
      headers: {'content-type':'application/json; charset=utf-8','cache-control':'no-store'}
    }));

    function bootMarkup(copy = 'Učitavam programe, timove i live kontrolu…') {
      return `<div class="admin-boot"><section class="boot-card"><div class="mark">◇</div><small>MTH CONTROL CENTER</small><h1>Pokrećem admin</h1><div class="boot-spinner"></div><p>${copy}</p></section></div>`;
    }

    function fatalMarkup(message) {
      return `<div class="admin-boot"><section class="boot-card error"><div class="mark">!</div><small>ADMIN RECOVERY</small><h1>Admin se nije pravilno učitao</h1><p>Core ekran ostaje dostupan za oporavak. Osvježi aplikaciju; lozinka ostaje sačuvana samo u ovom tabu.</p><div class="boot-error">${String(message || 'Nepoznata greška').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div><div class="boot-actions"><button id="admin-retry">Osvježi admin</button><button id="admin-signout" class="secondary">Odjavi se</button></div></section></div>`;
    }

    function showFatal(message) {
      if (!gate.hidden) return;
      if (root.querySelector('.admin-shell')) return;
      root.hidden = false;
      root.innerHTML = fatalMarkup(message);
      document.querySelector('#admin-retry')?.addEventListener('click', () => location.reload());
      document.querySelector('#admin-signout')?.addEventListener('click', () => {
        sessionStorage.removeItem(KEY);
        location.reload();
      });
    }

    async function validatePassword(password) {
      const response = await nativeFetch('/hunt/team-api/admin/overview', {
        method: 'GET',
        headers: {'x-mth-admin-password': password},
        cache: 'no-store'
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Pogrešna admin lozinka.');
      }
      return true;
    }

    window.fetch = async (requestInput, init = {}) => {
      const url = typeof requestInput === 'string' ? requestInput : requestInput?.url || '';

      if (url.includes('/hunt/api/admin/me')) {
        const password = sessionStorage.getItem(KEY);
        return password ? reply(200, {admin:{id:'password-admin',email:'Admin',role:'admin'}}) : reply(401, {error:'Prijava je potrebna.'});
      }

      if (url.includes('/hunt/api/admin/login')) {
        let body = {};
        try { body = JSON.parse(init.body || '{}'); } catch {}
        const password = String(body.password || '');
        try {
          await validatePassword(password);
          sessionStorage.setItem(KEY, password);
          return reply(200, {admin:{id:'password-admin',email:'Admin',role:'admin'}});
        } catch (e) {
          return reply(401, {error:e.message || 'Pogrešna admin lozinka.'});
        }
      }

      if (url.includes('/hunt/api/admin/logout')) {
        sessionStorage.removeItem(KEY);
        setTimeout(() => location.reload(), 0);
        return reply(200, {ok:true});
      }

      if (url.includes('/hunt/team-api/admin/')) {
        const password = sessionStorage.getItem(KEY) || '';
        const headers = new Headers(init.headers || (requestInput instanceof Request ? requestInput.headers : undefined) || {});
        headers.set('x-mth-admin-password', password);
        let target = requestInput;
        if (requestInput instanceof Request) {
          try { target = new Request(requestInput, {headers}); } catch {}
        }
        const response = await nativeFetch(target, {...init, headers, cache:'no-store'});
        if (response.status === 401) sessionStorage.removeItem(KEY);
        return response;
      }

      return nativeFetch(requestInput, init);
    };

    function waitForAdmin(timeout = 9000) {
      return new Promise((resolve, reject) => {
        const started = Date.now();
        const check = () => {
          if (root.querySelector('.admin-shell')) return resolve(true);
          if (root.querySelector('.ops-login')) return reject(new Error('Core admin nije prepoznao password-only prijavu.'));
          if (Date.now() - started >= timeout) return reject(new Error('Admin boot je istekao prije prikaza Control Centera.'));
          setTimeout(check, 80);
        };
        check();
      });
    }

    async function openAdmin() {
      if (booting) return;
      booting = true;
      gate.hidden = true;
      root.hidden = false;
      root.innerHTML = bootMarkup();
      try {
        if (!moduleLoaded) {
          moduleLoaded = true;
          await import('./admin.js?v=24');
        }
        await waitForAdmin();
      } catch (e) {
        console.error('MTH admin boot', e);
        showFatal(e?.message || 'Admin aplikacija se nije učitala.');
      } finally {
        booting = false;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      try {
        const password = input.value;
        await validatePassword(password);
        sessionStorage.setItem(KEY, password);
        await openAdmin();
      } catch (e) {
        sessionStorage.removeItem(KEY);
        error.textContent = e?.message || 'Pogrešna admin lozinka.';
        input.select();
      } finally {
        submit.disabled = false;
      }
    });

    window.addEventListener('error', event => {
      if (gate.hidden && !root.querySelector('.admin-shell')) showFatal(event.error?.message || event.message);
    });
    window.addEventListener('unhandledrejection', event => {
      if (gate.hidden && !root.querySelector('.admin-shell')) showFatal(event.reason?.message || String(event.reason || 'Unhandled promise rejection'));
    });

    (async () => {
      const saved = sessionStorage.getItem(KEY);
      if (!saved) return;
      try {
        await validatePassword(saved);
        await openAdmin();
      } catch (e) {
        sessionStorage.removeItem(KEY);
        root.hidden = true;
        gate.hidden = false;
        error.textContent = e?.message || '';
      }
    })();
  })();
  </script>
</body>
</html>
