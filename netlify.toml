[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "montenegro-treasure-hunt-app/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/hunt/api/*"
  to = "/.netlify/functions/hunt-api-v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/hunt"
  to = "/hunt/"
  status = 301

[[redirects]]
  from = "/hunt/"
  to = "/hunt/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hunt/admin"
  to = "/hunt/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/hunt/admin/"
  to = "/hunt/admin.html"
  status = 200
  force = true

# Isolated v4 route - branch workspace only.
[[redirects]]
  from = "/hunt-v4"
  to = "/hunt-v4/"
  status = 301

[[redirects]]
  from = "/hunt-v4/"
  to = "/hunt-v4/index.html"
  status = 200
  force = true

[[headers]]
  for = "/hunt/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"

[[headers]]
  for = "/hunt/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/hunt-v4/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"
